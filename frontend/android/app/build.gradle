apply plugin: 'com.android.application'

// Persistent release signing must be provided outside source control.
// One external directory is accepted through JOBTOMATIK_SIGNING_DIR or
// the jobtomatikSigningDir Gradle property. Its contents are ephemeral:
//   identity.jks  - persistent release keystore
//   material-1    - keystore unlock material
//   material-2    - key alias
//   material-3    - key unlock material
def signingDirPath = System.getenv('JOBTOMATIK_SIGNING_DIR') ?: project.findProperty('jobtomatikSigningDir')
def signingDir = signingDirPath ? file(signingDirPath) : null
def signingFile = { String name ->
    signingDir ? new File(signingDir, name) : null
}
def signingText = { String name ->
    def source = signingFile(name)
    source != null && source.isFile() ? source.getText('UTF-8').trim() : null
}
def releaseKeystoreFile = signingFile('identity.jks')
def releaseMaterialOne = signingText('material-1')
def releaseMaterialTwo = signingText('material-2')
def releaseMaterialThree = signingText('material-3')
def releaseSigningConfigured = [
        releaseKeystoreFile != null && releaseKeystoreFile.isFile(),
        releaseMaterialOne,
        releaseMaterialTwo,
        releaseMaterialThree,
].every { value -> value != null && value.toString().trim() }

def distributionReleaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    def leafTaskName = taskName.tokenize(':').last().toLowerCase()
    leafTaskName ==~ /^(assemble|bundle|package|publish).*release.*$/
}
if (distributionReleaseTaskRequested && !releaseSigningConfigured) {
    throw new GradleException(
            "Persistent JobTomatik release signing is required for release artifact tasks. " +
            "Provide JOBTOMATIK_SIGNING_DIR outside source control."
    )
}
android {
    namespace "ca.jobtomatik.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "ca.jobtomatik.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 210
        versionName "2.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and directories omitted from the packaged web assets.
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile releaseKeystoreFile
                storePassword releaseMaterialOne
                keyAlias releaseMaterialTwo
                keyPassword releaseMaterialThree
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
