<!doctype html>
<html>
  <body>
    <form id="application_form">
      <label for="first">First name</label>
      <input id="first" name="first_name" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="auth">Are you legally authorized to work in Canada?</label>
      <select id="auth" name="work_authorization" required>
        <option value="">Select</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
      <button id="submit_app" type="submit">Submit Application</button>
    </form>
    <script>
      window.__jobtomatikSubmitClicked = false;
      document.querySelector("#application_form").onsubmit = (event) => {
        event.preventDefault();
        window.__jobtomatikSubmitClicked = true;
      };
    </script>
  </body>
</html>
