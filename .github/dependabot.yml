version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      capacitor:
        patterns:
          - "@capacitor/*"
        update-types:
          - minor
          - patch
      frontend-runtime:
        dependency-type: production
        exclude-patterns:
          - "@capacitor/*"
        update-types:
          - minor
          - patch
      frontend-development:
        dependency-type: development
        exclude-patterns:
          - "@capacitor/*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@capacitor/*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: gradle
    directory: /frontend/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - android
    ignore:
      - dependency-name: "com.android.tools.build:gradle"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
