name: JT5 exact-head focused and full backend verification

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/jt5-exact-head.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: sqlite:///./jt5-exact-head.db
  REDIS_URL: redis://localhost:6379/1
  SECRET_KEY: jt5-exact-head-ci-not-production
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
  LEVER_SUPERVISED_PILOT_ENABLED: "false"
  AUTOPILOT_ENABLED: "false"
  ALLOW_REAL_FOLLOWUP_SEND: "false"

jobs:
  jt5-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Exact revision and static compilation
        run: |
          git -C .. rev-parse HEAD
          python -m compileall -q app tests
      - name: JT5 focused tests
        run: |
          python -m pytest -q --tb=short -ra \
            tests/test_application_execution_gate_jt5.py \
            tests/test_application_attempt_lifecycle_jt5.py \
            tests/test_jt5_browser_outcome_fail_closed.py \
            tests/test_jt5_reservation_and_worker.py \
            tests/test_jt5_reconciliation.py

  backend-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Install Chromium for full backend browser fixtures
        run: python -m playwright install --with-deps chromium
      - name: Exact-head full backend suite
        run: |
          git -C .. rev-parse HEAD
          python -m pytest -q --tb=short -ra tests/

  jt5-postgres-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jt5_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: jt5_recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jt5_test -d jt5_recovery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://jt5_test:synthetic-ci-only@localhost:5432/jt5_recovery_test
      JT5_TEST_DATABASE_URL: postgresql+psycopg2://jt5_test:synthetic-ci-only@localhost:5432/jt5_recovery_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: PostgreSQL row-lock recovery and receipt retention
        run: |
          git -C .. rev-parse HEAD
          python -m pytest -q --tb=short -ra \
            tests/test_jt5_late_browser_results.py \
            tests/test_jt5_reconciliation.py
