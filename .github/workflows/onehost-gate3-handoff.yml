name: OneHost Gate 3 retained handoff

on:
  pull_request:
    paths:
      - backend/app/api/handoffs.py
      - backend/app/services/browser_handoff.py
      - backend/app/services/browser_runtime.py
      - backend/app/services/browser_runtime_base.py
      - backend/app/services/handoff_session.py
      - backend/app/services/handoff_integration.py
      - backend/app/tasks/handoffs.py
      - backend/tests/test_onehost_gate3_handoff.py
      - backend/tests/test_handoff_submission_confirmation.py
      - backend/tests/test_operator_assisted_submission.py
      - docs/ONEHOST_GATE3_HANDOFF_CONTRACT.md
      - scripts/verify-onehost-handoff.sh
      - .github/workflows/onehost-gate3-handoff.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onehost-gate3-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  onehost-handoff-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SECRET_KEY: gate3-synthetic-ci-secret-20261005
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      AUTOPILOT_ENABLED: "false"
      GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
      LEVER_SUPERVISED_PILOT_ENABLED: "false"
      ENABLE_RESUMABLE_HANDOFFS: "false"
      JOBTOMATIK_RUNTIME_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind runner-local Gate 3 evidence paths
        shell: bash
        run: |
          echo "JOBTOMATIK_GATE3_EVIDENCE_DIR=$RUNNER_TEMP/gate3-evidence" >> "$GITHUB_ENV"
          echo "HANDOFF_STORAGE_DIR=$RUNNER_TEMP/gate3-handoffs" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -q -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Prove same-browser authenticated handoff and reconciliation
        run: bash scripts/verify-onehost-handoff.sh

      - name: Retain Gate 3 proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onehost-gate3-handoff-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/gate3-evidence
            ${{ runner.temp }}/gate3-handoffs
          if-no-files-found: error
          retention-days: 30
