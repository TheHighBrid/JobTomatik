name: Lever hosted metadata fallback patch once

on:
  push:
    branches:
      - codex/lever-hosted-metadata-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lever-hosted-metadata-fallback
          fetch-depth: 0

      - name: Patch strict hosted-page fallback and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path('backend/app/services/ats_lever.py')
          text = adapter.read_text(encoding='utf-8')
          text = text.replace('import re\n', 'from html import unescape\nimport re\n', 1)

          old = '''async def fetch_lever_posting(
              site: str,
              posting_id: str,
              *,
              region: str = "global",
              timeout: float = 15.0,
          ) -> Dict[str, Any]:
              host = LEVER_EU_API_HOST if region == "eu" else LEVER_GLOBAL_API_HOST
              url = f"https://{host}/v0/postings/{site}/{posting_id}"
              async with httpx.AsyncClient(timeout=timeout, follow_redirects=True) as client:
                  response = await client.get(url, params={"mode": "json"})
                  response.raise_for_status()
                  payload = response.json()
              if not isinstance(payload, dict):
                  raise ValueError("Lever posting metadata did not return an object.")
              return payload
          '''

          new = '''def _clean_hosted_text(value: str) -> str:
              without_tags = re.sub(r"<[^>]+>", " ", value or "")
              return " ".join(unescape(without_tags).split())


          def _hosted_role_from_html(body: str) -> Optional[str]:
              patterns = (
                  r'<div[^>]*class=["\\'][^"\\']*posting-headline[^"\\']*["\\'][^>]*>.*?<h2[^>]*>(.*?)</h2>',
                  r'<h2[^>]*>(.*?)</h2>',
              )
              for pattern in patterns:
                  match = re.search(pattern, body or "", flags=re.IGNORECASE | re.DOTALL)
                  if not match:
                      continue
                  role = _clean_hosted_text(match.group(1))
                  if role:
                      return role
              return None


          async def _fetch_lever_hosted_posting(
              client: httpx.AsyncClient,
              site: str,
              posting_id: str,
              *,
              region: str,
          ) -> Dict[str, Any]:
              jobs_host = LEVER_EU_JOBS_HOST if region == "eu" else LEVER_GLOBAL_JOBS_HOST
              hosted_url = f"https://{jobs_host}/{site}/{posting_id}"
              apply_url = f"{hosted_url}/apply"
              response = await client.get(hosted_url)
              response.raise_for_status()

              final_url = str(response.url)
              parsed = urlparse(final_url)
              observed_site, observed_posting_id, observed_region = parse_lever_job_url(final_url)
              if (
                  parsed.scheme.lower() != "https"
                  or (parsed.hostname or "").lower() != jobs_host
                  or parsed.path.rstrip("/") != f"/{site}/{posting_id}"
                  or parsed.query
                  or parsed.fragment
                  or observed_site != site
                  or observed_posting_id != posting_id
                  or observed_region != region
              ):
                  raise ValueError("Lever hosted posting redirected away from the exact selected target.")

              content_type = str(response.headers.get("content-type") or "").lower()
              if "text/html" not in content_type:
                  raise ValueError("Lever hosted posting fallback did not return HTML.")

              body = response.text
              role = _hosted_role_from_html(body)
              if not role:
                  raise ValueError("Lever hosted posting fallback did not expose an exact role title.")

              apply_path = f"/{site}/{posting_id}/apply"
              if apply_url not in body and apply_path not in body:
                  raise ValueError("Lever hosted posting fallback did not expose the exact apply route.")

              return {
                  "id": posting_id,
                  "text": role,
                  "categories": {},
                  "description": "",
                  "descriptionPlain": "",
                  "hostedUrl": hosted_url,
                  "applyUrl": apply_url,
                  "_metadata_source": "hosted_page_404_fallback",
              }


          async def fetch_lever_posting(
              site: str,
              posting_id: str,
              *,
              region: str = "global",
              timeout: float = 15.0,
          ) -> Dict[str, Any]:
              host = LEVER_EU_API_HOST if region == "eu" else LEVER_GLOBAL_API_HOST
              url = f"https://{host}/v0/postings/{site}/{posting_id}"
              async with httpx.AsyncClient(timeout=timeout, follow_redirects=True) as client:
                  response = await client.get(url, params={"mode": "json"})
                  if response.status_code == 404:
                      return await _fetch_lever_hosted_posting(
                          client,
                          site,
                          posting_id,
                          region=region,
                      )
                  response.raise_for_status()
                  payload = response.json()
              if not isinstance(payload, dict):
                  raise ValueError("Lever posting metadata did not return an object.")
              return payload
          '''

          if old not in text:
              raise SystemExit('Expected fetch_lever_posting source block not found')
          text = text.replace(old, new, 1)
          adapter.write_text(text, encoding='utf-8')

          tests = Path('backend/tests/test_day39_current_lever_intake.py')
          test_text = tests.read_text(encoding='utf-8')
          test_text = test_text.replace(
              'from __future__ import annotations\n\n',
              'from __future__ import annotations\n\nimport httpx\nimport pytest\n\n',
              1,
          )
          test_text = test_text.replace(
              'from app.services import lever_phase_b_current_intake as intake_service\n',
              'from app.services import ats_lever\nfrom app.services import lever_phase_b_current_intake as intake_service\n',
              1,
          )
          marker = 'def test_hosted_metadata_fallback_is_strictly_404_scoped'
          if marker in test_text:
              raise SystemExit('Fallback regression tests already exist')

          test_text += '''\n\n@pytest.mark.asyncio\nasync def test_hosted_metadata_fallback_is_strictly_404_scoped(monkeypatch):\n    posting_id = "a52e4915-8239-4581-8828-84661f070424"\n    hosted_url = f"https://jobs.lever.co/fullscript/{posting_id}"\n    apply_path = f"/fullscript/{posting_id}/apply"\n    calls = []\n\n    def handler(request: httpx.Request) -> httpx.Response:\n        calls.append(str(request.url))\n        if request.url.host == "api.lever.co":\n            return httpx.Response(\n                404,\n                request=request,\n                json={"ok": False, "error": "Document not found"},\n            )\n        assert request.url.host == "jobs.lever.co"\n        html = (\n            '<!doctype html><html><head><title>Fullscript - Technical Support Specialist</title></head>'\n            '<body><div class="posting-headline"><h2>Technical Support Specialist</h2></div>'\n            f'<a href="{apply_path}">Apply for this job</a></body></html>'\n        )\n        return httpx.Response(\n            200,\n            request=request,\n            headers={"content-type": "text/html; charset=utf-8"},\n            text=html,\n        )\n\n    transport = httpx.MockTransport(handler)\n    real_client = ats_lever.httpx.AsyncClient\n\n    def client_factory(*args, **kwargs):\n        kwargs["transport"] = transport\n        return real_client(*args, **kwargs)\n\n    monkeypatch.setattr(ats_lever.httpx, "AsyncClient", client_factory)\n    payload = await ats_lever.fetch_lever_posting("fullscript", posting_id)\n\n    assert payload["id"] == posting_id\n    assert payload["text"] == "Technical Support Specialist"\n    assert payload["hostedUrl"] == hosted_url\n    assert payload["applyUrl"] == f"{hosted_url}/apply"\n    assert payload["_metadata_source"] == "hosted_page_404_fallback"\n    assert len(calls) == 2\n\n\n@pytest.mark.asyncio\nasync def test_hosted_metadata_fallback_does_not_mask_non_404_api_failures(monkeypatch):\n    posting_id = "a52e4915-8239-4581-8828-84661f070424"\n\n    def handler(request: httpx.Request) -> httpx.Response:\n        assert request.url.host == "api.lever.co"\n        return httpx.Response(403, request=request, text="forbidden")\n\n    transport = httpx.MockTransport(handler)\n    real_client = ats_lever.httpx.AsyncClient\n\n    def client_factory(*args, **kwargs):\n        kwargs["transport"] = transport\n        return real_client(*args, **kwargs)\n\n    monkeypatch.setattr(ats_lever.httpx, "AsyncClient", client_factory)\n    with pytest.raises(httpx.HTTPStatusError):\n        await ats_lever.fetch_lever_posting("fullscript", posting_id)\n\n\n@pytest.mark.asyncio\nasync def test_hosted_metadata_fallback_requires_exact_apply_route(monkeypatch):\n    posting_id = "a52e4915-8239-4581-8828-84661f070424"\n\n    def handler(request: httpx.Request) -> httpx.Response:\n        if request.url.host == "api.lever.co":\n            return httpx.Response(404, request=request, json={"ok": False})\n        html = (\n            '<!doctype html><html><body>'\n            '<div class="posting-headline"><h2>Technical Support Specialist</h2></div>'\n            '</body></html>'\n        )\n        return httpx.Response(\n            200,\n            request=request,\n            headers={"content-type": "text/html"},\n            text=html,\n        )\n\n    transport = httpx.MockTransport(handler)\n    real_client = ats_lever.httpx.AsyncClient\n\n    def client_factory(*args, **kwargs):\n        kwargs["transport"] = transport\n        return real_client(*args, **kwargs)\n\n    monkeypatch.setattr(ats_lever.httpx, "AsyncClient", client_factory)\n    with pytest.raises(ValueError, match="exact apply route"):\n        await ats_lever.fetch_lever_posting("fullscript", posting_id)\n'''
          tests.write_text(test_text, encoding='utf-8')
          PY

          python -m py_compile \
            backend/app/services/ats_lever.py \
            backend/tests/test_day39_current_lever_intake.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/services/ats_lever.py backend/tests/test_day39_current_lever_intake.py
          git commit -m "Handle Lever hosted postings missing from public API"
          git push origin HEAD:codex/lever-hosted-metadata-fallback
