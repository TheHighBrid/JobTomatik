name: Clear obsolete Day 13 CI runs

on:
  push:
    branches:
      - agent/day13-run-observer

permissions:
  actions: write
  contents: write

jobs:
  cancel-obsolete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out observer branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Cancel superseded PR workflow runs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          obsolete_runs=(
            30876867656 30876867664 30876867669 30876867674 30876867675
            30876867677 30876867679 30876867683 30876867697
            30876867700 30876867703 30876867704 30876867706 30876867709
            30876867711 30876867717 30876867720 30876867724 30876867732
            30876867735 30876867737 30876867738 30876867740 30876867742
            30876867750 30876867755 30876867771 30876867784
            30877078270 30877078272 30877078273 30877078281 30877078290
            30877078297 30877078301 30877078303 30877078306 30877078311
            30877078319 30877078320 30877078321 30877078343 30877078348
            30877078349 30877078351 30877078353 30877078355 30877078363
            30877078366 30877078373 30877078380 30877078397 30877078399
            30877078404 30877078407 30877078411
          )
          for run_id in "${obsolete_runs[@]}"; do
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
              >/dev/null 2>&1 || true
          done

      - name: Remove cleanup workflow
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git rm .github/workflows/clear-obsolete-day13-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove obsolete Day 13 CI cleanup"
          git push origin "HEAD:${HEAD_BRANCH}"
