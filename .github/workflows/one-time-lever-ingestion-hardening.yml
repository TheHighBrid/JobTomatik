name: One-time Lever ingestion hardening

on:
  push:
    branches:
      - agent/fix-readiness-verification-policy-safety

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Harden root Phase A qualification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/lever_pilot_ingestion.py')
          text = path.read_text(encoding='utf-8')

          old_pairs = '''PHASE_A_SUCCESS_PAIRS = {
              ("ready_to_submit", "dry_run_passed"),
              ("manual_challenge_handoff", "needs_review"),
          }'''
          new_pairs = '''PHASE_A_SUCCESS_PAIRS = {
              ("ready_to_submit", "dry_run_passed"),
          }'''
          if old_pairs not in text:
              raise SystemExit('Expected Phase A success-pair block was not found')
          text = text.replace(old_pairs, new_pairs, 1)

          old_qualification = '''                    "reviewed_by": None,
                              "review_reference": None,
                              "qualifies_for_dry_run_matrix": (pre_submit_state, final_status)
                              in PHASE_A_SUCCESS_PAIRS,
                              "synthetic_profile": True,'''
          new_qualification = '''                    "reviewed_by": None,
                              "review_reference": None,
                              "official_posting_inspection_passed": str(
                                  row.get("official_posting_inspection_passed") or ""
                              ).strip().lower()
                              in {"1", "true", "yes", "on"},
                              "qualifies_for_dry_run_matrix": (
                                  (pre_submit_state, final_status) in PHASE_A_SUCCESS_PAIRS
                                  and str(
                                      row.get("official_posting_inspection_passed") or ""
                                  ).strip().lower()
                                  in {"1", "true", "yes", "on"}
                              ),
                              "synthetic_profile": True,'''
          if old_qualification not in text:
              raise SystemExit('Expected Phase A qualification block was not found')
          text = text.replace(old_qualification, new_qualification, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit root fix and remove one-time workflow
        run: |
          git config user.name "jobtomatik-safety-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-time-lever-ingestion-hardening.yml
          git add backend/app/services/lever_pilot_ingestion.py
          git commit -m "Enforce Phase A inspection at ingestion root"
          git push origin HEAD:${{ github.ref_name }}
