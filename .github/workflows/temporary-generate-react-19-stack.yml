name: Temporary React 19 stack generator

on:
  pull_request:
    paths:
      - .github/workflows/temporary-generate-react-19-stack.yml
      - frontend/package.json
      - frontend/package-lock.json

permissions:
  contents: write

jobs:
  generate-validate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/react-19-aligned-stack
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate aligned React 19 package files
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts react@19.2.8 react-dom@19.2.8
          npm install --package-lock-only --ignore-scripts --save-dev @types/react@19.2.17 @types/react-dom@19.2.3
          node - <<'NODE'
          const pkg = require('./package.json');
          const expected = {
            react: '^19.2.8',
            'react-dom': '^19.2.8',
            '@types/react': '^19.2.17',
            '@types/react-dom': '^19.2.3',
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = pkg.dependencies?.[name] ?? pkg.devDependencies?.[name];
            if (actual !== version) {
              throw new Error(`${name} expected ${version}, received ${actual}`);
            }
          }
          NODE

      - name: Validate aligned frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit package files and remove generator
        run: |
          rm .github/workflows/temporary-generate-react-19-stack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json .github/workflows/temporary-generate-react-19-stack.yml
          git commit -m "Align React runtime and type packages on 19.2"
          git push origin HEAD:fix/react-19-aligned-stack
