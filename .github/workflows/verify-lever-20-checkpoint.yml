name: Verify Lever Phase A 20-run checkpoint

on:
  push:
    branches:
      - evidence/lever-phase-a-20-run-checkpoint

permissions:
  contents: write

concurrency:
  group: verify-lever-phase-a-20-run-checkpoint
  cancel-in-progress: false

env:
  DATABASE_URL: sqlite:///./lever-20-checkpoint-verification.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: lever-20-checkpoint-verification-secret
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
  LEVER_SUPERVISED_PILOT_ENABLED: "false"
  AUTOPILOT_ENABLED: "false"
  ENABLE_RESUMABLE_HANDOFFS: "false"
  REQUIRE_BROWSER_TESTS: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out checkpoint branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run canonical full verification
        run: bash scripts/verify.sh full --install

      - name: Re-certify retained Lever checkpoint
        working-directory: backend
        run: |
          python scripts/certify_lever_pilot_readiness.py \
            --baseline evidence/lever-phase-a-baseline.csv \
            --ledger evidence/.missing-phase-b-runtime.jsonl \
            --json-output /tmp/lever-20-certification.json \
            --markdown-output /tmp/lever-20-certification.md

          pytest -q --tb=short -ra \
            tests/test_lever_phase_a_multi_archive.py \
            tests/test_lever_phase_a_title_compat.py \
            tests/test_lever_phase_a_ready_archive.py \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_readiness_hardening.py \
            tests/test_lever_pilot_certification.py \
            tests/test_campaign_day_gates.py \
            tests/test_certification_regressions.py

          git diff --check

      - name: Write exact-head verification receipt
        working-directory: backend
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          readiness_path = Path('evidence/lever-pilot-readiness.json')
          checkpoint_path = Path('evidence/campaign-days-12-22.json')
          readiness = json.loads(readiness_path.read_text(encoding='utf-8'))
          checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8'))
          summary = readiness['summary']
          day12 = next(item for item in checkpoint['checkpoints'] if item['day'] == 12)

          assert summary['qualifying_dry_run_count'] == 20
          assert summary['distinct_site_count'] == 20
          assert summary['phase_a_external_archive_failure_count'] == 0
          assert summary['duplicate_submission_count'] == 0
          assert summary['false_submitted_count'] == 0
          assert summary['canonical_maturity'] == 'dry_run'
          assert summary['promotion_ready'] is False
          assert day12['passed'] is True
          assert checkpoint['safety']['final_submit_clicked'] is False
          assert checkpoint['safety']['maturity_promoted'] is False

          receipt = {
              'schema_version': '1.0',
              'verified_commit_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'commands': [
                  'bash scripts/verify.sh full --install',
                  'python scripts/certify_lever_pilot_readiness.py',
                  'pytest focused Lever readiness and campaign regression suites',
                  'git diff --check',
              ],
              'readiness_sha256': hashlib.sha256(readiness_path.read_bytes()).hexdigest(),
              'campaign_checkpoint_sha256': hashlib.sha256(checkpoint_path.read_bytes()).hexdigest(),
              'qualifying_dry_run_count': 20,
              'distinct_site_count': 20,
              'regions_covered': summary['regions_covered'],
              'day_12_complete': True,
              'safety': {
                  'final_submit_clicked': False,
                  'maturity_promoted': False,
                  'duplicate_submission_count': 0,
                  'false_submitted_count': 0,
                  'external_archive_failure_count': 0,
              },
          }
          Path('evidence/lever-phase-a-20-run-verification.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Commit verification receipt and remove one-shot workflow
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-lever-20-checkpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Verify Lever Phase A 20-run checkpoint"
          git push origin "HEAD:${HEAD_BRANCH}"
