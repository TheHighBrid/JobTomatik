name: Materialize Lever title normalization

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/materialize-lever-title-normalization.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'evidence/lever-phase-a-resweep-visible-challenge'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Apply narrow title normalization and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          finalizer = Path('backend/scripts/finalize_lever_phase_a_ready.py')
          source = finalizer.read_text(encoding='utf-8')

          import_needle = 'import os\nimport zipfile\n'
          assert source.count(import_needle) == 1
          source = source.replace(import_needle, 'import os\nimport re\nimport zipfile\n', 1)

          normalized_needle = dedent('''
          def _normalized(value: Any) -> str:
              return " ".join(str(value or "").split()).casefold()
          ''')
          title_helper = normalized_needle + dedent('''

          _TITLE_DASH_PATTERN = re.compile(r"\\s*[-‐‑‒–—―−]\\s*")


          def _normalized_title(value: Any) -> str:
              return _TITLE_DASH_PATTERN.sub("-", _normalized(value))
          ''')
          assert source.count(normalized_needle) == 1
          source = source.replace(normalized_needle, title_helper, 1)

          comparison = (
              '    if _normalized(posting.get("title")) != '
              '_normalized(target.get("role")):\n'
          )
          replacement = (
              '    if _normalized_title(posting.get("title")) != '
              '_normalized_title(target.get("role")):\n'
          )
          assert source.count(comparison) == 1
          source = source.replace(comparison, replacement, 1)
          finalizer.write_text(source, encoding='utf-8')

          tests = Path('backend/tests/test_lever_phase_a_ready_provenance.py')
          test_source = tests.read_text(encoding='utf-8').rstrip()
          additions = dedent('''


          @pytest.mark.parametrize(
              "observed_title",
              [
                  "Lead Data Scientist - Growth & Experimentation",
                  "Lead Data Scientist — Growth & Experimentation",
                  "Lead Data Scientist– Growth & Experimentation",
                  "Lead Data Scientist ‐ Growth & Experimentation",
              ],
          )
          def test_ready_report_accepts_equivalent_title_dash_variants(
              observed_title: str,
          ) -> None:
              target = dict(
                  load_locked_target(
                      REVIEW_ID,
                      Path("evidence/lever-phase-a-target-corpus"),
                  )
              )
              target["role"] = "Lead Data Scientist - Growth & Experimentation"
              report = _report()
              report["reports"][0]["posting_metadata"]["title"] = observed_title
              result = validate_ready_report(report, target)
              assert result["review_id"] == REVIEW_ID


          def test_ready_report_rejects_title_word_changes() -> None:
              target = dict(
                  load_locked_target(
                      REVIEW_ID,
                      Path("evidence/lever-phase-a-target-corpus"),
                  )
              )
              target["role"] = "Staff Data Scientist - Pricing Science"
              report = _report()
              report["reports"][0]["posting_metadata"]["title"] = (
                  "Senior Data Scientist — Pricing Science"
              )
              with pytest.raises(
                  LeverPhaseAProvenanceError,
                  match="official title",
              ):
                  validate_ready_report(report, target)
          ''')
          tests.write_text((test_source + additions).rstrip() + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/lever-phase-a-corpus-resweep.yml

      - name: Verify focused fix
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile scripts/finalize_lever_phase_a_ready.py
          pytest -q --tb=short -ra tests/test_lever_phase_a_ready_provenance.py
          git -C .. diff --check

      - name: Commit source fix and remove materializer
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-lever-title-normalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Normalize equivalent Lever title dash variants"
          git push origin "HEAD:${HEAD_BRANCH}"
