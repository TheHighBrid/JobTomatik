name: Lever Phase A ready evidence retention

on:
  workflow_dispatch:
    inputs:
      review_id:
        description: Exact frozen review ID to retain, for example D8-003
        required: true
        type: string
  pull_request:
    paths:
      - "backend/scripts/finalize_lever_phase_a_ready.py"
      - "backend/scripts/finalize_lever_phase_a_ready_compatible.py"
      - "backend/evidence/lever-phase-a-artifacts/**/lever-phase-a-report.json"
      - "backend/evidence/lever-phase-a-artifacts/**/lever-phase-a-synthetic-resume.pdf"
      - "backend/evidence/lever-phase-a-candidate-*.csv"
      - "backend/evidence/lever-phase-a-source-*.csv"
      - "backend/evidence/lever-phase-a-sources.csv"
      - "backend/evidence/lever-phase-a-external-archives/**"
      - "backend/tests/test_lever_phase_a_ready_provenance.py"
      - "backend/tests/test_lever_phase_a_title_compat.py"
      - ".github/workflows/lever-phase-a-ready-retention.yml"

permissions:
  contents: read

jobs:
  retain-ready-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Compile and test ready-retention tooling
        run: |
          python -m py_compile \
            scripts/finalize_lever_phase_a_ready.py \
            scripts/finalize_lever_phase_a_ready_compatible.py
          pytest -q --tb=short -ra \
            tests/test_lever_phase_a_ready_provenance.py \
            tests/test_lever_phase_a_title_compat.py

      - name: Select ready report
        id: selection
        shell: bash
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_REVIEW_ID: ${{ inputs.review_id }}
        run: |
          set -euo pipefail
          reports=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            while IFS= read -r path; do
              [[ -n "$path" ]] && reports+=("$path")
            done < <(
              git diff --name-only "$BASE_SHA" HEAD -- \
                'backend/evidence/lever-phase-a-artifacts/*/lever-phase-a-report.json'
            )
          else
            [[ "${DISPATCH_REVIEW_ID:-}" =~ ^D8-[0-9]{3}$ ]] || {
              echo "Invalid review_id: ${DISPATCH_REVIEW_ID:-}" >&2
              exit 1
            }
            reports+=("backend/evidence/lever-phase-a-artifacts/${DISPATCH_REVIEW_ID}/lever-phase-a-report.json")
          fi

          if (( ${#reports[@]} > 1 )); then
            printf '%s\n' "${reports[@]}" > backend/lever-phase-a-ready-batch-reports.txt
            echo 'has_report=false' >> "$GITHUB_OUTPUT"
            echo 'has_batch=true' >> "$GITHUB_OUTPUT"
            echo "report_count=${#reports[@]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( ${#reports[@]} == 0 )); then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo 'The requested ready report is not committed on this ref.' >&2
              exit 1
            fi
            echo 'has_report=false' >> "$GITHUB_OUTPUT"
            echo 'has_batch=false' >> "$GITHUB_OUTPUT"
            echo 'report_count=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          report="${reports[0]}"
          [[ -f "$GITHUB_WORKSPACE/$report" ]] || {
            echo "Selected report does not exist: $report" >&2
            exit 1
          }
          review_id="$(basename "$(dirname "$report")")"
          [[ "$review_id" =~ ^D8-[0-9]{3}$ ]] || {
            echo "Invalid frozen review ID directory: $review_id" >&2
            exit 1
          }
          echo 'has_report=true' >> "$GITHUB_OUTPUT"
          echo 'has_batch=false' >> "$GITHUB_OUTPUT"
          echo 'report_count=1' >> "$GITHUB_OUTPUT"
          echo "review_id=$review_id" >> "$GITHUB_OUTPUT"
          echo "report_path=${report#backend/}" >> "$GITHUB_OUTPUT"
          echo "report_dir=$(dirname "${report#backend/}")" >> "$GITHUB_OUTPUT"

      - name: Validate ordinary ready-to-submit report
        if: steps.selection.outputs.has_report == 'true'
        env:
          REVIEW_ID: ${{ steps.selection.outputs.review_id }}
          REPORT_PATH: ${{ steps.selection.outputs.report_path }}
        run: |
          python scripts/finalize_lever_phase_a_ready_compatible.py \
            --validate-only \
            --review-id "$REVIEW_ID" \
            --report "$REPORT_PATH"

      - name: Build one-record retention manifest
        if: steps.selection.outputs.has_report == 'true'
        env:
          REVIEW_ID: ${{ steps.selection.outputs.review_id }}
          REPORT_PATH: ${{ steps.selection.outputs.report_path }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ['REPORT_PATH'])
          manifest = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'commit_sha': os.environ['GITHUB_SHA'],
              'retained_record_count': 1,
              'report': {
                  'review_id': os.environ['REVIEW_ID'],
                  'path': report_path.as_posix(),
                  'sha256': hashlib.sha256(report_path.read_bytes()).hexdigest(),
              },
          }
          Path('lever-phase-a-ready-retention-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload externally retained ready evidence
        if: steps.selection.outputs.has_report == 'true'
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-ready-${{ steps.selection.outputs.review_id }}-${{ github.sha }}
          path: |
            backend/${{ steps.selection.outputs.report_dir }}/**
            backend/lever-phase-a-ready-retention-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish finalizer provenance
        if: steps.selection.outputs.has_report == 'true'
        shell: bash
        run: |
          {
            echo '## Lever Phase A ready evidence retained'
            echo
            echo "- Review ID: \`${{ steps.selection.outputs.review_id }}\`"
            echo "- Workflow run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Artifact ID: \`${{ steps.upload.outputs.artifact-id }}\`"
            echo "- Artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`"
            echo '- Retained record count: `1`'
            echo
            echo 'Download the artifact metadata and ZIP, then run `scripts/finalize_lever_phase_a_ready_compatible.py`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate finalized ready-report batch
        if: steps.selection.outputs.has_batch == 'true'
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          from app.services.lever_phase_a_operator import load_locked_target
          from scripts.finalize_lever_phase_a_ready import require_report_path
          from scripts.finalize_lever_phase_a_ready_compatible import (
              validate_ready_report,
          )

          evidence = Path('evidence')
          corpus = evidence / 'lever-phase-a-target-corpus'
          baseline_path = evidence / 'lever-phase-a-baseline.csv'
          sources_path = evidence / 'lever-phase-a-sources.csv'

          def rows(path: Path):
              with path.open(encoding='utf-8', newline='') as handle:
                  return list(csv.DictReader(handle))

          baseline = rows(baseline_path)
          canonical_sources = rows(sources_path)
          paths = [
              Path(line.strip().removeprefix('backend/'))
              for line in Path('lever-phase-a-ready-batch-reports.txt').read_text(
                  encoding='utf-8'
              ).splitlines()
              if line.strip()
          ]
          assert len(paths) > 1
          seen_review_ids = set()
          seen_sites = set()

          for report_path in paths:
              review_id = report_path.parent.name
              assert review_id not in seen_review_ids
              seen_review_ids.add(review_id)
              target = load_locked_target(review_id, corpus)
              assert target['site'] not in seen_sites
              seen_sites.add(target['site'])

              report = json.loads(report_path.read_text(encoding='utf-8'))
              validate_ready_report(report, target)
              artifact_path = require_report_path(report_path, evidence)
              report_sha = hashlib.sha256(report_path.read_bytes()).hexdigest()

              candidate_path = evidence / f'lever-phase-a-candidate-{review_id}.csv'
              source_path = evidence / f'lever-phase-a-source-{review_id}.csv'
              assert candidate_path.is_file(), candidate_path
              assert source_path.is_file(), source_path
              candidate_rows = rows(candidate_path)
              source_rows = rows(source_path)
              assert len(candidate_rows) == 1
              assert len(source_rows) == 1
              candidate = candidate_rows[0]
              source = source_rows[0]

              assert candidate['artifact_path'] == artifact_path
              assert candidate['artifact_sha256'] == report_sha
              assert candidate['pre_submit_state'] == 'ready_to_submit'
              assert candidate['final_status'] == 'dry_run_passed'
              assert candidate['site'] == target['site']
              assert candidate['posting_id'] == target['posting_id']
              assert candidate['region'] == target['region']
              assert candidate['source_reference'].endswith(
                  '/' + source['workflow_run_id']
              )

              matching_baseline = [
                  item for item in baseline
                  if item.get('run_id') == candidate['run_id']
              ]
              assert matching_baseline == [candidate]
              matching_source = [
                  item for item in canonical_sources
                  if item.get('workflow_run_id') == source['workflow_run_id']
                  and item.get('artifact_id') == source['artifact_id']
              ]
              assert matching_source == [source]

              archive = (
                  evidence
                  / 'lever-phase-a-external-archives'
                  / review_id
                  / (
                      'artifact-'
                      + source['artifact_id']
                      + '-'
                      + source['artifact_digest']
                      + '.zip'
                  )
              )
              assert archive.is_file(), archive
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == (
                  source['artifact_digest']
              )

          print(
              json.dumps(
                  {
                      'batch_report_count': len(paths),
                      'review_ids': sorted(seen_review_ids),
                      'distinct_sites': len(seen_sites),
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

          python scripts/certify_lever_pilot_readiness.py \
            --baseline evidence/lever-phase-a-baseline.csv \
            --ledger evidence/.missing-phase-b-runtime.jsonl \
            --json-output /tmp/lever-batch-certification.json \
            --markdown-output /tmp/lever-batch-certification.md

          git diff --check

      - name: Record finalized batch validation
        if: steps.selection.outputs.has_batch == 'true'
        shell: bash
        run: |
          {
            echo '## Lever Phase A finalized batch validated'
            echo
            echo "- Changed ready reports: \`${{ steps.selection.outputs.report_count }}\`"
            echo '- Every report has a matching canonical baseline row.'
            echo '- Every report has a matching source receipt and durable archive.'
            echo '- No new external artifact was created by this validation-only pass.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record code-only validation
        if: >-
          steps.selection.outputs.has_report != 'true' &&
          steps.selection.outputs.has_batch != 'true'
        run: |
          echo 'Ready-retention tooling passed. No evidence report was selected on this code-only change.' >> "$GITHUB_STEP_SUMMARY"
