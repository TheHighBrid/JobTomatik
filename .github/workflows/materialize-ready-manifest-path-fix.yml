name: Materialize ready manifest path fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/materialize-ready-manifest-path-fix.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/lever-ready-manifest-path'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Apply focused manifest-path normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          finalizer = Path('backend/scripts/finalize_lever_phase_a_ready.py')
          source = finalizer.read_text(encoding='utf-8')

          helper = '''

          def _normalized_manifest_report_path(value: Any) -> str:
              path = PurePosixPath(str(value or "").strip())
              if path.is_absolute() or ".." in path.parts:
                  raise LeverPhaseAProvenanceError(
                      "The retention manifest contains an unsafe report path"
                  )
              parts = list(path.parts)
              if parts[:1] == ["backend"]:
                  parts = parts[1:]
              if parts[:1] == ["evidence"]:
                  parts = parts[1:]
              normalized = PurePosixPath(*parts).as_posix() if parts else ""
              if not normalized:
                  raise LeverPhaseAProvenanceError(
                      "The retention manifest report path is empty"
                  )
              return normalized
          '''
          helper = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in helper.splitlines()
          )

          needle = '\n\ndef _safe_members(archive: zipfile.ZipFile) -> list[str]:\n'
          assert source.count(needle) == 1
          source = source.replace(needle, helper + needle, 1)

          old = '        or manifest_report.get("path") != artifact_path\n'
          new = (
              '        or _normalized_manifest_report_path(\n'
              '            manifest_report.get("path")\n'
              '        ) != artifact_path\n'
          )
          assert source.count(old) == 1
          source = source.replace(old, new, 1)
          finalizer.write_text(source, encoding='utf-8')

          tests = Path('backend/tests/test_lever_phase_a_ready_provenance.py')
          test_source = tests.read_text(encoding='utf-8')
          import_needle = '    MANIFEST_NAME,\n'
          assert test_source.count(import_needle) == 1
          test_source = test_source.replace(
              import_needle,
              import_needle + '    _normalized_manifest_report_path,\n',
              1,
          )
          test_source += '''

          def test_manifest_report_path_normalizes_repository_roots() -> None:
              expected = "lever-phase-a-artifacts/D8-003/lever-phase-a-report.json"
              assert _normalized_manifest_report_path(expected) == expected
              assert _normalized_manifest_report_path("evidence/" + expected) == expected
              assert _normalized_manifest_report_path("backend/evidence/" + expected) == expected


          @pytest.mark.parametrize(
              "value",
              [
                  "",
                  "/evidence/lever-phase-a-artifacts/D8-003/lever-phase-a-report.json",
                  "evidence/../secrets.json",
              ],
          )
          def test_manifest_report_path_rejects_unsafe_values(value: str) -> None:
              with pytest.raises(LeverPhaseAProvenanceError):
                  _normalized_manifest_report_path(value)
          '''
          test_source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in test_source.splitlines()
          ) + "\n"
          tests.write_text(test_source, encoding='utf-8')
          PY

      - name: Test finalizer contract
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile scripts/finalize_lever_phase_a_ready.py
          pytest -q --tb=short -ra tests/test_lever_phase_a_ready_provenance.py

      - name: Commit fix and remove one-shot workflow
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-ready-manifest-path-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize ready-retention manifest report paths"
          git push origin "HEAD:${HEAD_BRANCH}"
