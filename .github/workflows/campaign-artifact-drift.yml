name: Campaign artifact drift

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/services/campaign_day_gates.py"
      - "backend/scripts/evaluate_campaign_days_12_22.py"
      - "backend/evidence/lever-pilot-readiness.json"
      - "backend/evidence/lever-phase-b-launch.json"
      - "backend/evidence/lever-phase-b-dossiers/**"
      - "backend/evidence/greenhouse-phase-a-readiness.json"
      - "backend/evidence/campaign-days-12-22.json"
      - "backend/tests/test_campaign_day_gates.py"
      - "backend/tests/test_certification_regressions.py"
      - ".github/workflows/campaign-artifact-drift.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/services/campaign_day_gates.py"
      - "backend/scripts/evaluate_campaign_days_12_22.py"
      - "backend/evidence/lever-pilot-readiness.json"
      - "backend/evidence/lever-phase-b-launch.json"
      - "backend/evidence/lever-phase-b-dossiers/**"
      - "backend/evidence/greenhouse-phase-a-readiness.json"
      - "backend/evidence/campaign-days-12-22.json"
      - "backend/tests/test_campaign_day_gates.py"
      - "backend/tests/test_certification_regressions.py"
      - ".github/workflows/campaign-artifact-drift.yml"

permissions:
  contents: read

jobs:
  regenerate-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./campaign-artifact-drift.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: campaign-artifact-drift-secret
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
      LEVER_SUPERVISED_PILOT_ENABLED: "false"
      AUTOPILOT_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r backend/requirements.txt

      - name: Run campaign gate regressions
        working-directory: backend
        run: |
          pytest -q --tb=short -ra \
            tests/test_campaign_day_gates.py \
            tests/test_certification_regressions.py

      - name: Regenerate the committed campaign checkpoint
        working-directory: backend
        run: |
          mkdir -p evidence-ci
          python scripts/evaluate_campaign_days_12_22.py \
            --lever evidence/lever-pilot-readiness.json \
            --lever-phase-b-launch evidence/lever-phase-b-launch.json \
            --greenhouse evidence/greenhouse-phase-a-readiness.json \
            --output evidence-ci/campaign-days-12-22.json

      - name: Reject stale campaign artifacts
        working-directory: backend
        run: cmp evidence/campaign-days-12-22.json evidence-ci/campaign-days-12-22.json

      - name: Upload regenerated checkpoint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campaign-artifact-drift
          path: backend/evidence-ci/campaign-days-12-22.json
          if-no-files-found: error
          retention-days: 30
