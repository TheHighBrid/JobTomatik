name: Phase 1 release gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".env.example"
      - "scripts/verify.sh"
      - "backend/app/services/ats_manifest.py"
      - "backend/app/services/lever_phase_a_evidence.py"
      - "backend/app/services/lever_pilot_ingestion.py"
      - "backend/app/services/lever_pilot_ledger_boundary.py"
      - "backend/app/services/lever_readiness_hardening.py"
      - "backend/app/services/campaign_day_gates.py"
      - "backend/scripts/certify_lever_pilot_readiness.py"
      - "backend/scripts/export_lever_phase_a_record.py"
      - "backend/scripts/evaluate_campaign_days_12_22.py"
      - "backend/evidence/lever-phase-a-baseline.csv"
      - "backend/evidence/lever-phase-a-sources.csv"
      - "backend/evidence/lever-pilot-readiness.json"
      - "backend/evidence/lever-pilot-readiness.md"
      - "backend/evidence/lever-phase-b-launch.json"
      - "backend/evidence/lever-phase-b-dossiers/*.json"
      - "backend/evidence/campaign-days-12-22.json"
      - "backend/tests/test_campaign_day_gates.py"
      - "backend/tests/test_phase_1_release_gate.py"
      - "backend/tests/test_certification_regressions.py"
      - "docs/operations/lever-phase-2-measurement-freeze.*"
      - "docs/roadmaps/2026-07-29-day-07-*"
      - "docs/roadmaps/baselines/2026-07-29-day-07-phase-1-gate.json"
      - "docs/roadmaps/JOBTOMATIK_AUTONOMY_42_DAY_PLAN.md"
      - ".github/workflows/lever-phase-a-certification.yml"
      - ".github/workflows/phase-1-release-gate.yml"
  push:
    branches:
      - main
    paths:
      - ".env.example"
      - "scripts/verify.sh"
      - "backend/app/services/ats_manifest.py"
      - "backend/app/services/lever_phase_a_evidence.py"
      - "backend/app/services/lever_pilot_ingestion.py"
      - "backend/app/services/lever_pilot_ledger_boundary.py"
      - "backend/app/services/lever_readiness_hardening.py"
      - "backend/app/services/campaign_day_gates.py"
      - "backend/scripts/certify_lever_pilot_readiness.py"
      - "backend/scripts/export_lever_phase_a_record.py"
      - "backend/scripts/evaluate_campaign_days_12_22.py"
      - "backend/evidence/lever-phase-a-baseline.csv"
      - "backend/evidence/lever-phase-a-sources.csv"
      - "backend/evidence/lever-pilot-readiness.json"
      - "backend/evidence/lever-pilot-readiness.md"
      - "backend/evidence/lever-phase-b-launch.json"
      - "backend/evidence/lever-phase-b-dossiers/*.json"
      - "backend/evidence/campaign-days-12-22.json"
      - "backend/tests/test_campaign_day_gates.py"
      - "backend/tests/test_phase_1_release_gate.py"
      - "backend/tests/test_certification_regressions.py"
      - "docs/operations/lever-phase-2-measurement-freeze.*"
      - "docs/roadmaps/2026-07-29-day-07-*"
      - "docs/roadmaps/baselines/2026-07-29-day-07-phase-1-gate.json"
      - "docs/roadmaps/JOBTOMATIK_AUTONOMY_42_DAY_PLAN.md"
      - ".github/workflows/lever-phase-a-certification.yml"
      - ".github/workflows/phase-1-release-gate.yml"

permissions:
  contents: read

jobs:
  clean-phase-1-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./phase-1-release-gate.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: phase-1-release-gate-development-secret
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      AUTOMATION_GLOBAL_KILL_SWITCH: "false"
      AUTOPILOT_ENABLED: "false"
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
      LEVER_SUPERVISED_PILOT_ENABLED: "false"
      ENABLE_RESUMABLE_HANDOFFS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install clean-state dependencies
        shell: bash
        run: |
          python -m pip install -q --disable-pip-version-check -r backend/requirements.txt
          npm --prefix frontend ci

      - name: Compile Day 7 contracts
        shell: bash
        run: |
          python -m py_compile \
            backend/tests/test_campaign_day_gates.py \
            backend/tests/test_phase_1_release_gate.py \
            backend/tests/test_certification_regressions.py \
            backend/scripts/certify_lever_pilot_readiness.py \
            backend/scripts/export_lever_phase_a_record.py \
            backend/scripts/evaluate_campaign_days_12_22.py \
            backend/app/services/lever_phase_a_evidence.py \
            backend/app/services/lever_readiness_hardening.py \
            backend/app/services/campaign_day_gates.py

      - name: Run Phase 1 and frozen-measurement tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          pytest -q --tb=short -ra \
            tests/test_campaign_day_gates.py \
            tests/test_phase_1_release_gate.py \
            tests/test_certification_regressions.py \
            tests/test_day06_operational_safety.py \
            tests/test_lever_phase_a_export.py \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_readiness_hardening.py \
            tests/test_reproducible_verification_contract.py \
            --junitxml=phase-1-release-gate.xml \
            > phase-1-release-gate.txt 2>&1
          status=$?
          cat phase-1-release-gate.txt
          exit $status

      - name: Run fast clean-reproduction gate
        shell: bash
        run: bash scripts/verify.sh fast

      - name: Verify fail-safe runtime defaults
        shell: bash
        run: bash scripts/verify.sh safety

      - name: Recalculate Lever readiness from locked inputs
        working-directory: backend
        shell: bash
        run: |
          mkdir -p phase-1-evidence
          python scripts/certify_lever_pilot_readiness.py \
            --baseline evidence/lever-phase-a-baseline.csv \
            --ledger phase-1-evidence/missing-phase-b.jsonl \
            --json-output phase-1-evidence/lever-certification.json \
            --markdown-output phase-1-evidence/lever-certification.md

      - name: Assert durable Phase 2 evidence invariants
        working-directory: backend
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('phase-1-evidence/lever-certification.json').read_text())
          summary = report['readiness']['summary']
          freeze = json.loads(
              Path('../docs/operations/lever-phase-2-measurement-freeze.json').read_text()
          )
          gate = json.loads(
              Path('../docs/roadmaps/baselines/2026-07-29-day-07-phase-1-gate.json').read_text()
          )

          current = int(summary['qualifying_dry_run_count'])
          required = int(freeze['starting_point']['required_qualifying_dry_runs'])
          assert report['passed'] is True
          assert freeze['starting_point']['qualifying_dry_runs'] == 0
          assert 0 <= current <= required
          assert summary['manual_challenge_boundary_count'] >= freeze['starting_point']['manual_challenge_boundary_rows']
          assert summary['phase_a_inspection_failure_count'] == 0
          assert summary['promotion_ready'] is False
          assert freeze['starting_point']['historical_rows_counted_toward_quota'] == 0
          assert freeze['promotion']['authorized'] is False
          assert gate['phase_2_launch']['lever_qualifying_dry_runs'] == 0
          assert gate['autonomous_adapters'] == []
          PY

      - name: Upload Phase 1 certification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-1-release-gate-report
          path: |
            backend/phase-1-release-gate.txt
            backend/phase-1-release-gate.xml
            backend/phase-1-evidence/lever-certification.json
            backend/phase-1-evidence/lever-certification.md
            docs/roadmaps/baselines/2026-07-29-day-07-phase-1-gate.json
            docs/operations/lever-phase-2-measurement-freeze.json
            docs/roadmaps/2026-07-29-day-07-backlog-surgery.json
          if-no-files-found: error
          retention-days: 30
