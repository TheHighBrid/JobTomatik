name: Temporary Phase 2 rebase replay

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-phase2-rebase-replay.yml"

permissions:
  contents: write

jobs:
  replay-and-test:
    if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./phase2-rebase-replay.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: phase2-rebase-replay-secret
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      AUTOMATION_GLOBAL_KILL_SWITCH: "false"
      AUTOPILOT_ENABLED: "false"
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      LEVER_SUPERVISED_PILOT_ENABLED: "false"
      ENABLE_RESUMABLE_HANDOFFS: "false"

    steps:
      - name: Check out rebased pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replay exact tested non-workflow patch
        shell: bash
        run: |
          git fetch origin agent/backup-phase2-integrity-before-rebase
          git checkout origin/agent/backup-phase2-integrity-before-rebase -- \
            backend/app/services/lever_phase_a_evidence.py \
            backend/app/services/lever_pilot_ingestion.py \
            backend/app/services/lever_readiness_hardening.py \
            backend/evidence/lever-phase-a-baseline.csv \
            backend/scripts/certify_lever_pilot_readiness.py \
            backend/scripts/export_lever_phase_a_record.py \
            backend/tests/test_lever_phase_a_readiness_validation.py \
            backend/tests/test_lever_readiness_hardening.py \
            backend/tests/test_phase2_integrity_regressions.py \
            backend/tests/test_phase_1_release_gate.py \
            docs/operations/lever-phase-2-measurement-freeze.json \
            docs/operations/lever-phase-2-measurement-freeze.md
          git diff --check

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r backend/requirements.txt

      - name: Run focused safety and certification regressions
        working-directory: backend
        run: |
          pytest -q --tb=short -ra \
            tests/test_phase2_integrity_regressions.py \
            tests/test_phase_1_release_gate.py \
            tests/test_day06_operational_safety.py \
            tests/test_lever_phase_a_export.py \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_readiness_hardening.py

      - name: Commit replayed non-workflow patch
        shell: bash
        run: |
          git restore --source=HEAD -- .github/workflows/temporary-phase2-rebase-replay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replay Phase 2 integrity fixes on latest main"
          git push origin HEAD:${{ github.head_ref }}
