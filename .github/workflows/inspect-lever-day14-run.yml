name: Inspect Lever Day 14 workflow

on:
  push:
    branches:
      - checkpoint/lever-phase-a-day14-dry-run
    paths:
      - .github/workflows/inspect-lever-day14-run.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: inspect-lever-day14-workflow
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Read latest one-shot run metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          token = os.environ['GH_TOKEN']
          branch = 'checkpoint/lever-phase-a-day14-dry-run'
          workflow = 'lever-day14-final-dry-run.yml'

          def get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'JobTomatik-Day14-Diagnostic',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          query = urllib.parse.urlencode({
              'branch': branch,
              'event': 'push',
              'per_page': 10,
          })
          runs_payload = get(
              f'{api}/repos/{repository}/actions/workflows/{workflow}/runs?{query}'
          )
          runs = list(runs_payload.get('workflow_runs') or [])
          if not runs:
              result = {
                  'schema_version': '1.0',
                  'workflow': workflow,
                  'branch': branch,
                  'run_found': False,
              }
          else:
              run = runs[0]
              jobs_payload = get(run['jobs_url'] + '?per_page=100')
              artifacts_payload = get(
                  f"{api}/repos/{repository}/actions/runs/{run['id']}/artifacts?per_page=100"
              )
              jobs = []
              for job in jobs_payload.get('jobs') or []:
                  jobs.append({
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'started_at': job.get('started_at'),
                      'completed_at': job.get('completed_at'),
                      'failed_steps': [
                          {
                              'name': step.get('name'),
                              'number': step.get('number'),
                              'conclusion': step.get('conclusion'),
                          }
                          for step in job.get('steps') or []
                          if step.get('conclusion') not in (None, 'success', 'skipped')
                      ],
                  })
              result = {
                  'schema_version': '1.0',
                  'workflow': workflow,
                  'branch': branch,
                  'run_found': True,
                  'run': {
                      'id': run.get('id'),
                      'run_number': run.get('run_number'),
                      'run_attempt': run.get('run_attempt'),
                      'head_sha': run.get('head_sha'),
                      'event': run.get('event'),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'created_at': run.get('created_at'),
                      'updated_at': run.get('updated_at'),
                  },
                  'jobs': jobs,
                  'artifacts': [
                      {
                          'id': item.get('id'),
                          'name': item.get('name'),
                          'expired': item.get('expired'),
                          'digest': item.get('digest'),
                          'size_in_bytes': item.get('size_in_bytes'),
                      }
                      for item in artifacts_payload.get('artifacts') or []
                  ],
              }

          path = Path('backend/evidence/lever-phase-a-day14-run-status.json')
          path.write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Commit diagnostic metadata and remove inspector
        run: |
          set -euo pipefail
          rm -f .github/workflows/inspect-lever-day14-run.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Record final dry-run workflow status"
          git push origin HEAD:checkpoint/lever-phase-a-day14-dry-run
