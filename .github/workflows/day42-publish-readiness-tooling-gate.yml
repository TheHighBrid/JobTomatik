name: Day 42 publish-readiness tooling gate

on:
  pull_request:
    paths:
      - '.github/workflows/day42-publish-readiness-tooling-gate.yml'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/publish-v1-command.yml'
      - 'backend/app/services/day42_publish_readiness.py'
      - 'backend/scripts/build_day42_publish_readiness.py'
      - 'backend/tests/test_day42_publish_readiness.py'
      - 'backend/tests/test_v1_release_contract.py'
      - 'backend/tests/test_v2_release_provenance.py'
      - 'docs/operations/DAY_42_V2_RELEASE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-readiness-contract:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./day42-publish-readiness.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: day42-publish-readiness-ci-only-secret-key
      AI_PROVIDER: template
      DEV_MOCK_JOBS: 'false'
      ALLOW_REAL_APPLICATION_SUBMIT: 'false'
      ALLOW_REAL_FOLLOWUP_SEND: 'false'
      AUTOPILOT_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt
      - name: Compile Day 42 tooling
        run: |
          python -m compileall -q \
            app/services/day42_publish_readiness.py \
            scripts/build_day42_publish_readiness.py \
            tests/test_day42_publish_readiness.py \
            tests/test_v1_release_contract.py \
            tests/test_v2_release_provenance.py
      - name: Run Day 42 and release provenance contract tests
        run: |
          pytest -q --tb=short -ra \
            tests/test_day42_publish_readiness.py \
            tests/test_v1_release_contract.py \
            tests/test_v2_release_provenance.py
      - name: Prove readiness tooling has no publisher authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              'tooling_ready': True,
              'real_day42_release_claimed': False,
              'publication_eligible_from_ci': False,
              'publication_executed': False,
              'release_tag_created': False,
              'github_release_created': False,
              'main_modified': False,
              'real_submission_enabled': False,
              'real_followup_send_enabled': False,
              'requires_real_day41_audit': True,
              'requires_exact_final_commit_matrix': True,
              'requires_exact_apk_identity': True,
              'requires_truthful_maturity_manifest': True,
              'requires_separate_owner_publication_authorization': True,
              'requires_separate_hardened_publisher': True,
              'publisher_is_workflow_dispatch_only': True,
              'pr_apk_build_is_read_only': True,
          }
          Path('day42-publish-readiness-tooling.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, sort_keys=True))
          assert payload['real_day42_release_claimed'] is False
          assert payload['publication_eligible_from_ci'] is False
          assert payload['publication_executed'] is False
          assert payload['release_tag_created'] is False
          assert payload['github_release_created'] is False
          assert payload['main_modified'] is False
          assert payload['publisher_is_workflow_dispatch_only'] is True
          assert payload['pr_apk_build_is_read_only'] is True
          PY
      - name: Upload Day 42 tooling evidence
        uses: actions/upload-artifact@v7
        with:
          name: day42-publish-readiness-tooling
          path: backend/day42-publish-readiness-tooling.json
          if-no-files-found: error
          retention-days: 30
