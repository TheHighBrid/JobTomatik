name: Retain Lever Phase A Day 13 checkpoint

on:
  push:
    branches:
      - agent/lever-day13-text-evidence

permissions:
  contents: write
  actions: read

concurrency:
  group: lever-phase-a-day13-retention
  cancel-in-progress: false

env:
  PYTHONPATH: .
  DATABASE_URL: sqlite:///./lever-day13.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: lever-day13-retention-secret
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
  LEVER_SUPERVISED_PILOT_ENABLED: "false"
  AUTOPILOT_ENABLED: "false"
  ENABLE_RESUMABLE_HANDOFFS: "false"

jobs:
  certify-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -q --disable-pip-version-check -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify privacy-safe text evidence
        env:
          REQUIRE_BROWSER_TESTS: "1"
        run: |
          python -m compileall -q app scripts tests
          pytest -q --tb=short -ra \
            tests/test_text_control_evidence.py \
            tests/test_form_filler_anonymous_controls.py \
            tests/test_lever_synthetic_certification.py \
            tests/test_lever_phase_a_ready_provenance.py

  exercise-and-retain:
    needs: certify-instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        review_id: [D8-004, D8-009, D8-010, D8-018, D8-020, D8-030, D8-034, D8-036, D8-040]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -q --disable-pip-version-check -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Resolve frozen target
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from app.services.lever_phase_a_operator import load_locked_target
          target = load_locked_target(
              os.environ['REVIEW_ID'], Path('evidence/lever-phase-a-target-corpus')
          )
          Path('day13-url.txt').write_text(
              str(target['canonical_application_url']), encoding='utf-8'
          )
          print(target['review_id'], target['employer'], target['canonical_application_url'])
          PY

      - name: Exercise exact target without submission
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          set +e
          destination="evidence/lever-phase-a-artifacts/${REVIEW_ID}"
          mkdir -p "$destination"
          python -u scripts/certify_lever_live.py \
            --urls "$(cat day13-url.txt)" \
            --exercise \
            --synthetic-resume-path "$destination/lever-phase-a-synthetic-resume.pdf" \
            --report "$destination/lever-phase-a-report.json" \
            > "day13-${REVIEW_ID}.log" 2>&1
          cat "day13-${REVIEW_ID}.log"
          exit 0

      - name: Assert immutable safety boundary
        if: always()
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          review_id = os.environ['REVIEW_ID']
          path = Path(f'evidence/lever-phase-a-artifacts/{review_id}/lever-phase-a-report.json')
          assert path.is_file(), path
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['final_submit_clicked'] is False
          assert not any(item.get('final_submit_clicked') is True for item in report.get('reports') or [])
          PY

      - name: Validate frozen qualification contract
        id: qualify
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          set +e
          python scripts/finalize_lever_phase_a_ready_compatible.py \
            --validate-only \
            --review-id "$REVIEW_ID" \
            --report "evidence/lever-phase-a-artifacts/${REVIEW_ID}/lever-phase-a-report.json" \
            > "day13-${REVIEW_ID}-validation.log" 2>&1
          status=$?
          cat "day13-${REVIEW_ID}-validation.log"
          [[ "$status" -eq 0 ]] && echo "qualifying=true" >> "$GITHUB_OUTPUT" || echo "qualifying=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete attempt evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-day13-attempt-${{ matrix.review_id }}-${{ github.sha }}
          path: |
            backend/evidence/lever-phase-a-artifacts/${{ matrix.review_id }}/**
            backend/day13-${{ matrix.review_id }}.log
            backend/day13-${{ matrix.review_id }}-validation.log
          if-no-files-found: error
          retention-days: 30

      - name: Build one-record retention manifest
        if: steps.qualify.outputs.qualifying == 'true'
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          review_id = os.environ['REVIEW_ID']
          report = Path(f'evidence/lever-phase-a-artifacts/{review_id}/lever-phase-a-report.json')
          manifest = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'commit_sha': os.environ['GITHUB_SHA'],
              'retained_record_count': 1,
              'report': {
                  'review_id': review_id,
                  'path': report.as_posix(),
                  'sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
              },
          }
          Path('lever-phase-a-ready-retention-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload independently retained ready evidence
        if: steps.qualify.outputs.qualifying == 'true'
        id: retained
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-ready-${{ matrix.review_id }}-${{ github.sha }}
          path: |
            backend/evidence/lever-phase-a-artifacts/${{ matrix.review_id }}/**
            backend/lever-phase-a-ready-retention-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Download and finalize official retained artifact
        if: steps.qualify.outputs.qualifying == 'true'
        env:
          REVIEW_ID: ${{ matrix.review_id }}
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
          ARTIFACT_DIGEST_OUTPUT: ${{ steps.retained.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest="${ARTIFACT_DIGEST_OUTPUT#sha256:}"
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "$api" > "/tmp/${REVIEW_ID}-metadata.json" && break
            sleep $((attempt * 2))
          done
          for attempt in 1 2 3 4 5 6; do
            curl -fL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "${api}/zip" -o "/tmp/${REVIEW_ID}-artifact.zip" && break
            sleep $((attempt * 2))
          done
          [[ -s "/tmp/${REVIEW_ID}-metadata.json" && -s "/tmp/${REVIEW_ID}-artifact.zip" ]]
          echo "${digest}  /tmp/${REVIEW_ID}-artifact.zip" | sha256sum -c -
          python scripts/finalize_lever_phase_a_ready_compatible.py \
            --review-id "$REVIEW_ID" \
            --report "evidence/lever-phase-a-artifacts/${REVIEW_ID}/lever-phase-a-report.json" \
            --artifact-metadata "/tmp/${REVIEW_ID}-metadata.json" \
            --artifact-zip "/tmp/${REVIEW_ID}-artifact.zip" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$digest" \
            --operator github-actions

      - name: Stage independently finalized package
        if: steps.qualify.outputs.qualifying == 'true'
        env:
          REVIEW_ID: ${{ matrix.review_id }}
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
          ARTIFACT_DIGEST_OUTPUT: ${{ steps.retained.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          digest="${ARTIFACT_DIGEST_OUTPUT#sha256:}"
          stage="day13-package/evidence"
          rm -rf day13-package
          mkdir -p "$stage/lever-phase-a-artifacts/${REVIEW_ID}" "$stage/lever-phase-a-external-archives/${REVIEW_ID}"
          cp -a "evidence/lever-phase-a-artifacts/${REVIEW_ID}/." "$stage/lever-phase-a-artifacts/${REVIEW_ID}/"
          cp "evidence/lever-phase-a-candidate-${REVIEW_ID}.csv" "$stage/"
          cp "evidence/lever-phase-a-source-${REVIEW_ID}.csv" "$stage/"
          cp "evidence/lever-phase-a-external-archives/${REVIEW_ID}/artifact-${ARTIFACT_ID}-${digest}.zip" "$stage/lever-phase-a-external-archives/${REVIEW_ID}/"

      - name: Upload finalized Day 13 package
        if: steps.qualify.outputs.qualifying == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-day13-package-${{ matrix.review_id }}-${{ github.sha }}
          path: backend/day13-package
          if-no-files-found: error
          retention-days: 30

  import-checkpoint:
    needs: exercise-and-retain
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -q --disable-pip-version-check -r requirements.txt
      - name: Download finalized packages
        uses: actions/download-artifact@v8
        with:
          pattern: lever-phase-a-day13-package-*-${{ github.sha }}
          path: /tmp/day13-packages
          merge-multiple: true
      - name: Import at least five verified packages
        run: python scripts/import_lever_day13_packages.py --package-root /tmp/day13-packages --minimum-count 5
      - name: Regenerate and verify campaign checkpoint
        run: |
          python scripts/evaluate_campaign_days_12_22.py --lever evidence/lever-pilot-readiness.json --output evidence/campaign-days-12-22.json
          python scripts/verify_lever_phase_a_checkpoint.py --evidence-root evidence --output-root evidence-ci
          python - <<'PY'
          import json
          from pathlib import Path
          readiness = json.loads(Path('evidence/lever-pilot-readiness.json').read_text(encoding='utf-8'))
          checkpoint = json.loads(Path('evidence/campaign-days-12-22.json').read_text(encoding='utf-8'))
          summary = readiness['summary']
          day13 = next(item for item in checkpoint['checkpoints'] if item['day'] == 13)
          assert summary['qualifying_dry_run_count'] >= 25
          assert summary['distinct_site_count'] >= 25
          assert summary['phase_a_external_archive_failure_count'] == 0
          assert summary['duplicate_submission_count'] == 0
          assert summary['false_submitted_count'] == 0
          assert summary['canonical_maturity'] == 'dry_run'
          assert summary['promotion_ready'] is False
          assert day13['passed'] is True
          assert checkpoint['safety']['final_submit_clicked'] is False
          assert checkpoint['safety']['maturity_promoted'] is False
          PY
      - name: Certify Day 13 evidence boundary
        run: |
          python scripts/certify_lever_pilot_readiness.py \
            --baseline evidence/lever-phase-a-baseline.csv \
            --ledger evidence/.missing-phase-b-runtime.jsonl \
            --json-output /tmp/lever-day13-certification.json \
            --markdown-output /tmp/lever-day13-certification.md
          pytest -q --tb=short -ra \
            tests/test_text_control_evidence.py \
            tests/test_form_filler_anonymous_controls.py \
            tests/test_lever_phase_a_multi_archive.py \
            tests/test_lever_phase_a_ready_archive.py \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_readiness_hardening.py \
            tests/test_lever_pilot_certification.py \
            tests/test_campaign_day_gates.py \
            tests/test_certification_regressions.py
          git diff --check
      - name: Commit canonical Day 13 checkpoint
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f "$GITHUB_WORKSPACE/.github/workflows/lever-day13-retention.yml" "$GITHUB_WORKSPACE/backend/scripts/import_lever_day13_packages.py"
          rm -rf evidence-ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Retain Lever Phase A Day 13 checkpoint"
          git push origin "HEAD:${HEAD_BRANCH}"
