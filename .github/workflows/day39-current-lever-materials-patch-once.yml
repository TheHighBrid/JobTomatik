name: Day39 current Lever material bridge patch once

on:
  push:
    branches:
      - codex/day39-current-lever-materials

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/day39-current-lever-materials
          fetch-depth: 0

      - name: Patch current Lever material preparation and review
        run: |
          python - <<'PY'
          from pathlib import Path

          ats = Path('backend/app/services/ats_lever.py')
          text = ats.read_text(encoding='utf-8')
          marker = '\n\nasync def _fetch_lever_hosted_posting(\n'
          helper = '''\n\ndef _hosted_description_from_html(body: str) -> Optional[str]:\n    source = body or ""\n    source = re.sub(\n        r"<(script|style|noscript)\\b[^>]*>.*?</\\1>",\n        " ",\n        source,\n        flags=re.IGNORECASE | re.DOTALL,\n    )\n    body_match = re.search(\n        r"<body\\b[^>]*>(.*?)</body>",\n        source,\n        flags=re.IGNORECASE | re.DOTALL,\n    )\n    if body_match:\n        source = body_match.group(1)\n    description = _clean_hosted_text(source)\n    if len(description) < 120:\n        return None\n    return description\n'''
          if '_hosted_description_from_html' not in text:
              if marker not in text:
                  raise SystemExit('Expected hosted fallback insertion point not found')
              text = text.replace(marker, helper + marker, 1)
          old = '''    body = response.text\n    role = _hosted_role_from_html(body)\n    if not role:\n        raise ValueError("Lever hosted posting fallback did not expose an exact role title.")\n\n    apply_path = f"/{site}/{posting_id}/apply"\n'''
          new = '''    body = response.text\n    role = _hosted_role_from_html(body)\n    if not role:\n        raise ValueError("Lever hosted posting fallback did not expose an exact role title.")\n    description = _hosted_description_from_html(body)\n    if not description:\n        raise ValueError("Lever hosted posting fallback did not expose usable posting text.")\n\n    apply_path = f"/{site}/{posting_id}/apply"\n'''
          if old not in text:
              raise SystemExit('Expected hosted fallback body block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '        "description": "",\n        "descriptionPlain": "",\n',
              '        "description": description,\n        "descriptionPlain": description,\n',
              1,
          )
          ats.write_text(text, encoding='utf-8')

          svc = Path('backend/app/services/lever_phase_b_reviewed_materials.py')
          text = svc.read_text(encoding='utf-8')
          text = text.replace('import hashlib\n', 'import asyncio\nimport hashlib\n', 1)
          text = text.replace(
              '    inspect_lever_posting,\n)',
              '    fetch_lever_posting,\n    inspect_lever_posting,\n)',
              1,
          )
          text = text.replace(
              'from app.services.lever_phase_b_runtime import (\n',
              'from app.services.lever_phase_b_current_intake import INTAKE_SOURCE\nfrom app.services.lever_phase_b_runtime import (\n',
              1,
          )
          text = text.replace(
              'from app.services.material_generation import (\n',
              'from app.services.supervised_target_identity import persisted_supervised_target_metadata\nfrom app.services.material_generation import (\n',
              1,
          )

          old_fetch = '''def _fetch_official_posting(candidate: Mapping[str, Any]) -> Dict[str, Any]:\n    host = (\n        LEVER_EU_API_HOST\n        if str(candidate.get("region") or "").lower() == "eu"\n        else LEVER_GLOBAL_API_HOST\n    )\n    url = (\n        f"https://{host}/v0/postings/{candidate['site']}/"\n        f"{candidate['posting_id']}"\n    )\n    try:\n        with httpx.Client(timeout=15.0, follow_redirects=True) as client:\n            response = client.get(url, params={"mode": "json"})\n            response.raise_for_status()\n            payload = response.json()\n    except Exception as exc:\n        raise LeverPhaseBReviewedMaterialsError(\n            "The exact official Lever posting metadata could not be refreshed"\n        ) from exc\n    if not isinstance(payload, dict):\n        raise LeverPhaseBReviewedMaterialsError(\n            "The official Lever posting metadata was not an object"\n        )\n    return payload\n'''
          new_fetch = '''def _fetch_official_posting(candidate: Mapping[str, Any]) -> Dict[str, Any]:\n    try:\n        payload = asyncio.run(\n            fetch_lever_posting(\n                str(candidate["site"]),\n                str(candidate["posting_id"]),\n                region=str(candidate.get("region") or "global"),\n            )\n        )\n    except Exception as exc:\n        raise LeverPhaseBReviewedMaterialsError(\n            "The exact official Lever posting metadata could not be refreshed"\n        ) from exc\n    if not isinstance(payload, dict):\n        raise LeverPhaseBReviewedMaterialsError(\n            "The official Lever posting metadata was not an object"\n        )\n    return payload\n'''
          if old_fetch not in text:
              raise SystemExit('Expected reviewed-material official fetch block not found')
          text = text.replace(old_fetch, new_fetch, 1)
          text = text.replace(
              '        "source": "lever_official_postings_api",\n',
              '        "source": str(payload.get("_metadata_source") or "lever_official_postings_api"),\n',
              1,
          )
          text = text.replace(
              '        "posting_source": "lever_official_postings_api",\n',
              '        "posting_source": posting_snapshot["source"],\n',
              1,
          )

          insert_before = '\n\ndef _preparation_snapshot(material: ApplicationMaterial) -> Dict[str, Any]:\n'
          current_prepare = r'''

def _current_candidate_records(
    db: Session,
    user: User,
    application_id: int,
) -> tuple[Dict[str, Any], Application, Job]:
    application = (
        db.query(Application)
        .filter(
            Application.id == int(application_id),
            Application.user_id == user.id,
        )
        .with_for_update()
        .first()
    )
    if application is None:
        raise LeverPhaseBReviewedMaterialsError("Current Lever application was not found")
    job = db.query(Job).filter(Job.id == application.job_id).first()
    if job is None:
        raise LeverPhaseBReviewedMaterialsError("Current Lever application job is missing")
    if str((job.raw_data or {}).get("selection_source") or "") != INTAKE_SOURCE:
        raise LeverPhaseBReviewedMaterialsError(
            "Application is not a current owner-selected Lever Phase B target"
        )
    state = normalize_state(application.automation_state)
    if state not in SUPPORTED_LOCAL_STATES:
        raise LeverPhaseBReviewedMaterialsError(
            "The application already entered an execution or terminal state"
        )
    target = persisted_supervised_target_metadata(job)
    if target.get("verified") is not True or target.get("blockers"):
        raise LeverPhaseBReviewedMaterialsError(
            "Current Lever application exact target identity is not verified"
        )
    site = str(target.get("site") or "").strip()
    posting_id = str(target.get("posting_id") or "").strip()
    region = str(target.get("region") or "").strip()
    application_url = canonical_lever_application_url(
        str(target.get("canonical_application_url") or job.url or "")
    )
    if not site or not posting_id or region not in {"global", "eu"}:
        raise LeverPhaseBReviewedMaterialsError(
            "Current Lever application target identity is incomplete"
        )
    candidate = {
        "review_id": f"current-lever-{application.id}",
        "application_id": f"current-lever-{application.id}",
        "employer": str(job.company or "").strip(),
        "role": str(job.title or "").strip(),
        "application_url": application_url,
        "site": site,
        "posting_id": posting_id,
        "region": region,
    }
    return candidate, application, job


def prepare_current_lever_materials(
    db: Session,
    user: User,
    *,
    application_id: int,
) -> Dict[str, Any]:
    resume_path = _required_resume_path(user)
    candidate, application, job = _current_candidate_records(db, user, application_id)
    posting_snapshot, posting_sha256 = _posting_snapshot(
        candidate,
        _fetch_official_posting(candidate),
    )

    refreshed_at = _utcnow()
    job.raw_data = {
        **(job.raw_data or {}),
        "lever_official_posting": posting_snapshot,
        "lever_official_posting_sha256": posting_sha256,
        "lever_official_posting_refreshed_at": refreshed_at,
        "material_preparation_source": REVIEW_STAGE,
    }
    job.description = posting_snapshot["description_plain"]
    job.requirements = posting_snapshot.get("requirements_plain")
    application.application_target_metadata = {
        **(application.application_target_metadata or {}),
        "lever_official_posting_sha256": posting_sha256,
        "lever_official_posting_refreshed_at": refreshed_at,
        "requires_fresh_runtime_preflight": True,
    }
    application.resume_path = str(resume_path)

    evidence_result = rebuild_user_evidence(db, user)
    eligible = eligible_evidence_query(db, user.id).order_by(EvidenceUnit.id).all()
    resume_units = [unit for unit in eligible if unit.source_type == "resume_pdf"]
    if not resume_units:
        raise LeverPhaseBReviewedMaterialsError(
            "The résumé was readable as a file but produced no source-backed text evidence"
        )
    evidence_sha256 = _evidence_digest(eligible)

    materials = []
    all_critical_errors: list[str] = []
    for material_type in MATERIAL_TYPES:
        material = generate_application_material(
            db,
            application,
            user,
            job,
            material_type=material_type,
            rebuild_evidence=False,
        )
        critical_errors = _critical_material_errors(material, eligible)
        _set_material_preparation_snapshot(
            material,
            candidate=candidate,
            posting_sha256=posting_sha256,
            evidence_digest=evidence_sha256,
            critical_errors=critical_errors,
        )
        materials.append(material)
        all_critical_errors.extend(critical_errors)
        db.add(
            ApplicationEvent(
                application_id=application.id,
                event_type="lever_phase_b_verified_material_generated",
                from_state=normalize_state(application.automation_state),
                to_state=normalize_state(application.automation_state),
                payload={
                    "review_id": candidate["review_id"],
                    "material_id": material.id,
                    "material_type": material.material_type,
                    "material_version": material.version,
                    "material_status": material.status,
                    "posting_sha256": posting_sha256,
                    "evidence_digest": evidence_sha256,
                    "critical_error_count": len(critical_errors),
                    "submission_queued": False,
                    "approval_issued": False,
                },
            )
        )

    unique_critical = sorted(set(all_critical_errors))
    _upsert_material_review_task(
        db,
        application,
        summary=(
            "Generated Lever materials have source-validation blockers."
            if unique_critical
            else "Review both latest source-backed Lever materials before preflight."
        ),
        details={
            "stage": REVIEW_STAGE,
            "review_id": candidate["review_id"],
            "material_ids": [material.id for material in materials],
            "material_versions": {
                material.material_type: material.version for material in materials
            },
            "posting_sha256": posting_sha256,
            "evidence_digest": evidence_sha256,
            "review_eligible": not unique_critical,
            "critical_errors": unique_critical,
            "current_lever_application_id": application.id,
        },
        blocking_url=candidate["application_url"],
    )

    return {
        "review_id": candidate["review_id"],
        "launch_application_id": candidate["application_id"],
        "application_id": application.id,
        "job_id": job.id,
        "posting_sha256": posting_sha256,
        "posting_source": posting_snapshot["source"],
        "resume_filename": user.resume_filename or resume_path.name,
        "resume_evidence_count": len(resume_units),
        "evidence_unit_count": len(eligible),
        "evidence_digest": evidence_sha256,
        "evidence_rebuild": evidence_result,
        "review_eligible": not unique_critical,
        "critical_errors": unique_critical,
        "materials": [
            {
                "id": material.id,
                "material_type": material.material_type,
                "version": material.version,
                "status": material.status,
                "warning_count": len(material.warnings or []),
                "review_status": "pending",
            }
            for material in materials
        ],
        "automation_state": normalize_state(application.automation_state),
        "requires_explicit_material_review": True,
        "requires_fresh_runtime_preflight": True,
        "approval_issued": False,
        "submission_queued": False,
    }
'''
          if insert_before not in text:
              raise SystemExit('Expected insertion point before preparation snapshot not found')
          text = text.replace(insert_before, current_prepare + insert_before, 1)

          insert_before_review = '\n\ndef review_retained_lever_materials(\n'
          current_review = r'''

def review_current_lever_materials(
    db: Session,
    user: User,
    *,
    application_id: int,
    approved: bool,
    notes: Optional[str] = None,
) -> Dict[str, Any]:
    candidate, application, job = _current_candidate_records(db, user, application_id)
    posting_sha256 = str((job.raw_data or {}).get("lever_official_posting_sha256") or "")
    if not posting_sha256:
        raise LeverPhaseBReviewedMaterialsError(
            "Prepare current Lever materials before reviewing them"
        )

    materials = {
        material_type: _latest_material(db, application.id, material_type)
        for material_type in MATERIAL_TYPES
    }
    if any(material is None for material in materials.values()):
        raise LeverPhaseBReviewedMaterialsError(
            "Both latest Lever material types must exist before review"
        )

    eligible = eligible_evidence_query(db, user.id).order_by(EvidenceUnit.id).all()
    current_evidence_digest = _evidence_digest(eligible)
    critical_errors: list[str] = []
    for material in materials.values():
        assert material is not None
        preparation = _preparation_snapshot(material)
        if preparation.get("posting_sha256") != posting_sha256:
            critical_errors.append(f"{material.material_type} was generated from stale posting context")
        if preparation.get("evidence_digest") != current_evidence_digest:
            critical_errors.append(f"{material.material_type} was generated from stale evidence")
        critical_errors.extend(_critical_material_errors(material, eligible))

    unique_critical = sorted(set(critical_errors))
    if approved and unique_critical:
        raise LeverPhaseBReviewedMaterialsError(
            "The latest materials cannot be approved because source validation failed: "
            + "; ".join(unique_critical[:5])
        )

    reviewed_at = _utcnow()
    for material in materials.values():
        assert material is not None
        material.source_snapshot = {
            **(material.source_snapshot or {}),
            "user_review": {
                "status": "approved" if approved else "rejected",
                "reviewed_at": reviewed_at,
                "reviewed_by_user_id": user.id,
                "notes": str(notes or "").strip() or None,
                "accepted_warning_count": len(material.warnings or []) if approved else 0,
            },
        }
        material.status = "verified" if approved else "needs_review"

    if not approved:
        _upsert_material_review_task(
            db,
            application,
            summary="The owner rejected the latest current Lever material bundle.",
            details={
                "stage": REVIEW_STAGE,
                "review_id": candidate["review_id"],
                "material_ids": [material.id for material in materials.values()],
                "review_eligible": not unique_critical,
                "critical_errors": unique_critical,
                "owner_rejected": True,
                "current_lever_application_id": application.id,
            },
            blocking_url=candidate["application_url"],
        )
        return {
            "review_id": candidate["review_id"],
            "application_id": application.id,
            "approved": False,
            "material_review_status": "rejected",
            "ready_for_fresh_preflight": False,
            "automation_state": normalize_state(application.automation_state),
            "open_review_count": _open_review_count(db, application.id),
            "approval_issued": False,
            "submission_queued": False,
        }

    _required_resume_path(user)
    cover_letter = materials["cover_letter"]
    assert cover_letter is not None
    application.cover_letter = cover_letter.content
    application.resume_path = user.resume_path
    _resolve_material_review_tasks(db, application.id, notes=notes)
    remaining_reviews = _open_review_count(db, application.id)
    ready = remaining_reviews == 0
    current_state = normalize_state(application.automation_state)
    if ready:
        transition_application_state(
            db,
            application,
            ApplicationAutomationState.ready_to_apply,
            "lever_phase_b_material_bundle_reviewed",
            {
                "review_id": candidate["review_id"],
                "material_ids": [material.id for material in materials.values()],
                "posting_sha256": posting_sha256,
                "evidence_digest": current_evidence_digest,
                "requires_fresh_runtime_preflight": True,
                "approval_issued": False,
                "submission_queued": False,
                "current_lever_application_id": application.id,
            },
        )
    else:
        db.add(
            ApplicationEvent(
                application_id=application.id,
                event_type="lever_phase_b_material_bundle_reviewed_with_other_blockers",
                from_state=current_state,
                to_state=current_state,
                payload={
                    "review_id": candidate["review_id"],
                    "remaining_open_review_count": remaining_reviews,
                    "requires_fresh_runtime_preflight": True,
                    "current_lever_application_id": application.id,
                },
            )
        )

    db.flush()
    return {
        "review_id": candidate["review_id"],
        "application_id": application.id,
        "approved": True,
        "material_review_status": "approved",
        "ready_for_fresh_preflight": ready,
        "automation_state": normalize_state(application.automation_state),
        "open_review_count": remaining_reviews,
        "posting_sha256": posting_sha256,
        "evidence_digest": current_evidence_digest,
        "requires_fresh_runtime_preflight": True,
        "approval_issued": False,
        "submission_queued": False,
    }
'''
          if insert_before_review not in text:
              raise SystemExit('Expected retained review insertion point not found')
          text = text.replace(insert_before_review, current_review + insert_before_review, 1)
          text = text.replace(
              '    "prepare_retained_lever_materials",\n    "review_retained_lever_materials",\n',
              '    "prepare_retained_lever_materials",\n    "review_retained_lever_materials",\n    "prepare_current_lever_materials",\n    "review_current_lever_materials",\n',
              1,
          )
          svc.write_text(text, encoding='utf-8')

          api = Path('backend/app/api/supervised_pilot_roster.py')
          text = api.read_text(encoding='utf-8')
          text = text.replace(
              '    prepare_retained_lever_materials,\n    review_retained_lever_materials,\n',
              '    prepare_current_lever_materials,\n    prepare_retained_lever_materials,\n    review_current_lever_materials,\n    review_retained_lever_materials,\n',
              1,
          )
          marker = '\n\n@router.get(\n    "/lever-launch",\n'
          routes = r'''

@router.post(
    "/lever-candidates/{application_id}/prepare-materials",
    response_model=LeverPhaseBPrepareMaterialsOut,
)
def prepare_current_lever_phase_b_materials(
    application_id: int,
    current_user: User = Depends(get_current_user),
    db: Session = Depends(get_db),
):
    try:
        result = prepare_current_lever_materials(db, current_user, application_id=application_id)
    except LeverPhaseBReviewedMaterialsError as exc:
        db.rollback()
        raise HTTPException(status_code=409, detail=str(exc)) from exc
    db.commit()
    return result


@router.post(
    "/lever-candidates/{application_id}/review-materials",
    response_model=LeverPhaseBMaterialReviewOut,
)
def review_current_lever_phase_b_materials(
    application_id: int,
    data: LeverPhaseBMaterialReviewIn,
    current_user: User = Depends(get_current_user),
    db: Session = Depends(get_db),
):
    try:
        result = review_current_lever_materials(
            db,
            current_user,
            application_id=application_id,
            approved=data.approved,
            notes=data.notes,
        )
    except LeverPhaseBReviewedMaterialsError as exc:
        db.rollback()
        raise HTTPException(status_code=409, detail=str(exc)) from exc
    db.commit()
    return result
'''
          if marker not in text:
              raise SystemExit('Expected Lever launch API insertion point not found')
          text = text.replace(marker, routes + marker, 1)
          api.write_text(text, encoding='utf-8')

          tests = Path('backend/tests/test_day39_current_lever_materials.py')
          tests.write_text(r'''from __future__ import annotations

from app.models.application import Application, ApplicationAutomationState
