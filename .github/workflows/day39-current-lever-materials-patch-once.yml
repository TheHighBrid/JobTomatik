def _create_current_application(auth_client, monkeypatch):
    from app.services import lever_phase_b_current_intake as intake_service
    async def verified(_job):
        return {
            "platform": "lever", "adapter": "lever", "adapter_version": "1.1.0",
            "verified": True, "blockers": [], "target_url": APPLY_URL,
            "canonical_application_url": APPLY_URL, "site": "fullscript",
            "posting_id": POSTING_ID, "region": "global",
            "official_title": "Technical Support Specialist", "title_matches_local_job": True,
