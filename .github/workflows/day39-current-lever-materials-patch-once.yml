def _patch_resume_evidence(monkeypatch):
    original = reviewed_materials.rebuild_user_evidence
    def rebuild_with_resume_statement(db, user):
        result = original(db, user)
        statement = "Investigated API and web issues, documented escalations, and supported customers."
        digest = evidence_hash(statement, kind="employment")
        unit = db.query(EvidenceUnit).filter(
            EvidenceUnit.user_id == user.id,
            EvidenceUnit.source_type == "resume_pdf",
            EvidenceUnit.source_ref == "resume:test-owner:line:1",
            EvidenceUnit.source_hash == digest,
        ).first()
        if unit is None:
            unit = EvidenceUnit(
                user_id=user.id,
                kind="employment",
                label="Résumé experience",
                statement=statement,
                organization="Example SaaS",
                role="Technical Support Specialist",
                source_type="resume_pdf",
                source_ref="resume:test-owner:line:1",
                source_hash=digest,
                verification_status="source_backed",
                confidence=0.9,
                provenance={"document": "owner-resume.pdf", "line_number": 1, "verbatim": True},
                is_active=True,
            )
            db.add(unit)
        else:
            unit.is_active = True
        db.flush()
        return dict(result)
    monkeypatch.setattr(reviewed_materials, "rebuild_user_evidence", rebuild_with_resume_statement)


