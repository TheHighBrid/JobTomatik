name: Sync v2 frontend version once

on:
  push:
    branches:
      - codex/v2-release-docs-prep

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch head
        uses: actions/checkout@v7
        with:
          ref: codex/v2-release-docs-prep
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'

      - name: Regenerate npm package metadata at v2.0.0
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm version 2.0.0 --no-git-tag-version
          node - <<'NODE'
          const pkg = require('./package.json')
          const lock = require('./package-lock.json')
          if (pkg.version !== '2.0.0') throw new Error(`package.json version=${pkg.version}`)
          if (lock.version !== '2.0.0') throw new Error(`package-lock.json version=${lock.version}`)
          if (lock.packages?.['']?.version !== '2.0.0') throw new Error(`package-lock root version=${lock.packages?.['']?.version}`)
          NODE

      - name: Commit synchronized metadata to this branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Frontend metadata already synchronized.'
            exit 0
          fi
          git commit -m 'Align frontend package metadata with v2 candidate'
          git push origin HEAD:codex/v2-release-docs-prep
