name: Codacy frozen-boundary verification

on:
  push:
    branches:
      - codex/codacy-frozen-verify
    paths:
      - .github/workflows/codacy-frozen-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./codacy-frozen-verify.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: codacy-frozen-verify-ci-only-secret-000000000000
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      ALLOW_REAL_FOLLOWUP_SEND: "false"
      AUTOPILOT_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/codacy-frozen-verify
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt
      - name: Verify restored frozen boundaries
        run: |
          python -m pytest -q \
            tests/test_phase4_candidate_gate.py \
            tests/test_day35_operations_rehearsal.py \
            tests/test_day36_shadow_endurance.py
