name: Temporary Phase 2 integrity patch

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-phase2-integrity-patch.yml"
      - "scripts/.phase2_patch.part*"
      - "backend/app/services/lever_phase_a_evidence.py"

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./phase2-integrity-patch.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: phase2-integrity-patch-secret
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      AUTOMATION_GLOBAL_KILL_SWITCH: "false"
      AUTOPILOT_ENABLED: "false"
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      LEVER_SUPERVISED_PILOT_ENABLED: "false"
      ENABLE_RESUMABLE_HANDOFFS: "false"

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          cat > /tmp/phase2-chunks.sha256 <<'EOF'
          e1662121a6c13bebd736fea737a78d70d2978388d16845af71ab837d177fc752  scripts/.phase2_patch.part01_01
          5ffbf92e082038b3e3a73b05287fc8cbc9082564756ab0f6d2556e172c633068  scripts/.phase2_patch.part01_02
          bbe0780384becef3f59d4651a9210e11c602effe29cf5b1bb9e7c14f35d317ed  scripts/.phase2_patch.part01_03
          473e19df965dce84b58c69d4241091f888d1432179b4a1ab55ea5694d9b734e9  scripts/.phase2_patch.part01_04
          d64bfc9f0f082cbf44849d9b7a7fa73196e5e2999f79e6e6c996d3e5ff780dd3  scripts/.phase2_patch.part01_05
          73aa3fe78a66921c50cd9869096c9c5f4e1ffc642640d3608e445d41a11f3913  scripts/.phase2_patch.part01_06
          09cd629527692ac43ba84ddcb134a3c1eec8aa99b715e3da39b2292f98c1da4c  scripts/.phase2_patch.part02
          d86a5c59cdc53a514fb7c7fdbc0835c50a899ad2db8e929c238e51b18db831cd  scripts/.phase2_patch.part03_01
          516613c1f4183b91a7169085e982408e2864175abfc19529f2f553723c2daf8f  scripts/.phase2_patch.part03_02
          de0b578010ea273934b8eb13914efd8a842dbc212f6b40ca619e3914bf798180  scripts/.phase2_patch.part03_03
          adc08a19887d39c4ed4644814bed5b50e0f47bc79291a591304f418cf422a8a6  scripts/.phase2_patch.part03_04
          d196d65774cf1011286db67406d24fc69c195343ab94c6b94f8185cdda23c264  scripts/.phase2_patch.part03_05
          81ce056d0d594ff34179df9afb4bbb5bbff3a2f98532351415440113d129b50e  scripts/.phase2_patch.part03_06
          1de0bf042771e50885ab8c9c3672eba7f8ee9fc1555475730892db6a9ad0ddf1  scripts/.phase2_patch.part04
          fd474329d9e45c04f4b624ac1dbaf63a76b9e9fbbdd81d957017bfbe7cf2354d  scripts/.phase2_patch.part05_01
          d2118254bc12a30252cd41be8d266b16ff62a984a530766c7ea1ea430b21c661  scripts/.phase2_patch.part05_02
          523581984bf1cbc501a9231659ab93f1a69c0cf729321bd20cced7cb25574634  scripts/.phase2_patch.part05_03
          21a667d23e1de7b6dcd39b6612c7d5d613f0c4e3cca6a4efba47e9351fba518e  scripts/.phase2_patch.part05_04
          44caa26c0f787b8614ef889e270343901238a756f94f600b2d66641f9554289e  scripts/.phase2_patch.part05_05
          e4a91f11c7ed758330f48eea12c72e65a4325389d6df297d8a21fc2cea2810db  scripts/.phase2_patch.part05_06
          3bd8e4efcda34f228cf3dbb7df70cc796281494e4930846d991e7e6c6985d486  scripts/.phase2_patch.part06_01
          4d0663f2e7417c4acbe0593fb49daaab1e2f9f103c277aa8a34d3e8f0fbefcfb  scripts/.phase2_patch.part06_02
          e698dcbf9af0d200309b6b64ba0f460e62e6d6bb71d85b3c07d9738a80f8532a  scripts/.phase2_patch.part06_03
          f90e3189cabff34a78ad8f01ab6c6f4163afc9b60e5c5015500091620b291f42  scripts/.phase2_patch.part06_04
          48842fb79bbbbfa82a4f56d67b944c1fdf0a6588486ea1f18520f7945f2280c2  scripts/.phase2_patch.part06_05
          a3ba755c9f56049961ad16a97eccc119f4b4ea9c85e78798c07f8d8ec84aad6f  scripts/.phase2_patch.part06_06
          20fe365e3fd6dced5c8fd49c9f2c28d9b522bb505f47f5ed16ce5973dcdde327  scripts/.phase2_patch.part07_01
          436fa152ce4a0ff8c7ab3d0bbc7ed53f31387771f1543b4629b4ab53252136e4  scripts/.phase2_patch.part07_02
          3be0dab7cca72ac9fc2291fb5d25855e1dd638ac44e56726fb64fbdac3c4f6b9  scripts/.phase2_patch.part07_03
          EOF
          sha256sum --check --strict /tmp/phase2-chunks.sha256
          cat scripts/.phase2_patch.part* | base64 --decode > scripts/apply_phase2_integrity_patch.py
          echo "b97f0140321f8b5869bdf0ff59787b6858b64887824c485b906ca34c7a802d8d  scripts/apply_phase2_integrity_patch.py" | sha256sum --check --strict
          python -m py_compile scripts/apply_phase2_integrity_patch.py

      - name: Apply certification integrity fixes
        run: python scripts/apply_phase2_integrity_patch.py

      - name: Complete permanent safety-test coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/phase-1-release-gate.yml')
          text = path.read_text(encoding='utf-8')
          if 'tests/test_day06_operational_safety.py' not in text:
              anchor = '            tests/test_phase_1_release_gate.py \\\n'
              if anchor not in text:
                  raise SystemExit('Phase 1 pytest anchor missing')
              text = text.replace(
                  anchor,
                  anchor + '            tests/test_day06_operational_safety.py \\\n',
                  1,
              )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r backend/requirements.txt

      - name: Compile changed Python surfaces
        run: |
          python -m py_compile \
            backend/app/services/lever_phase_a_evidence.py \
            backend/app/services/lever_pilot_ingestion.py \
            backend/app/services/lever_readiness_hardening.py \
            backend/scripts/export_lever_phase_a_record.py \
            backend/scripts/certify_lever_pilot_readiness.py \
            backend/tests/test_phase2_integrity_regressions.py

      - name: Run focused safety and certification regressions
        working-directory: backend
        run: |
          pytest -q --tb=short -ra \
            tests/test_phase2_integrity_regressions.py \
            tests/test_phase_1_release_gate.py \
            tests/test_day06_operational_safety.py \
            tests/test_lever_phase_a_export.py \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_readiness_hardening.py

      - name: Remove temporary patch scaffolding
        shell: bash
        run: |
          rm -f scripts/.phase2_patch.part* scripts/apply_phase2_integrity_patch.py
          rm -f .github/workflows/temporary-phase2-integrity-patch.yml

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Phase 2 certification integrity regressions"
          git push origin HEAD:${{ github.head_ref }}
