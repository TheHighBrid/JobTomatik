name: Import finalized Lever Phase A resweep

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/lever-phase-a-resweep-import-once.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: lever-phase-a-resweep-import-once
  cancel-in-progress: false

env:
  PYTHONPATH: .
  ORIGINAL_RUN_ID: "30871406281"
  ORIGINAL_HEAD_SHA: "ce5ed31448ffbf8a1e5a44ee1c4bd905186f808c"
  RECOVERY_RUN_ID: "30872849666"

jobs:
  import-checkpoint:
    if: github.head_ref == 'evidence/lever-phase-a-resweep-visible-challenge'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out resweep branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Download original resweep catalog
        uses: actions/download-artifact@v8
        with:
          name: lever-phase-a-resweep-catalog-${{ env.ORIGINAL_HEAD_SHA }}
          path: /tmp/original-catalog
          repository: ${{ github.repository }}
          run-id: ${{ env.ORIGINAL_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download original 17 finalized packages
        uses: actions/download-artifact@v8
        with:
          pattern: lever-phase-a-finalized-*-${{ env.ORIGINAL_HEAD_SHA }}
          path: /tmp/original-finalized
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.ORIGINAL_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download recovered finalized packages
        uses: actions/download-artifact@v8
        with:
          pattern: lever-phase-a-recovery-package-*
          path: /tmp/recovered-finalized
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.RECOVERY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Import canonical 20-run checkpoint
        run: |
          python scripts/import_lever_phase_a_resweep.py \
            --catalog-dir /tmp/original-catalog \
            --original-finalized /tmp/original-finalized/evidence \
            --recovered-finalized /tmp/recovered-finalized/evidence \
            --evidence-dir evidence \
            --source-run-id "$ORIGINAL_RUN_ID"

      - name: Regenerate and verify campaign checkpoint
        run: |
          python scripts/evaluate_campaign_days_12_22.py \
            --lever evidence/lever-pilot-readiness.json \
            --output evidence/campaign-days-12-22.json

          python - <<'PY'
          import json
          from pathlib import Path

          checkpoint = json.loads(
              Path('evidence/campaign-days-12-22.json').read_text(encoding='utf-8')
          )
          day12 = next(
              item for item in checkpoint['checkpoints']
              if item['day'] == 12
          )
          day13 = next(
              item for item in checkpoint['checkpoints']
              if item['day'] == 13
          )
          assert day12['passed'] is True
          assert day12['facts']['qualifying_dry_runs'] == 20
          assert day12['facts']['distinct_sites'] == 20
          assert day13['passed'] is False
          assert checkpoint['safety']['final_submit_clicked'] is False
          assert checkpoint['safety']['maturity_promoted'] is False
          print(json.dumps({
              'day12': day12,
              'day13': day13,
              'safety': checkpoint['safety'],
          }, indent=2, sort_keys=True))
          PY

      - name: Certify imported evidence boundary
        run: |
          python -m py_compile \
            app/services/lever_phase_a_archive.py \
            scripts/finalize_lever_phase_a_ready.py \
            scripts/import_lever_phase_a_resweep.py

          python scripts/certify_lever_pilot_readiness.py \
            --baseline evidence/lever-phase-a-baseline.csv \
            --ledger evidence/.missing-phase-b-runtime.jsonl \
            --json-output /tmp/lever-resweep-certification.json \
            --markdown-output /tmp/lever-resweep-certification.md

          pytest -q --tb=short -ra \
            tests/test_lever_phase_a_multi_archive.py \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_readiness_hardening.py \
            tests/test_lever_pilot_certification.py \
            tests/test_lever_phase_a_ready_provenance.py

          git diff --check

      - name: Commit canonical 20-run checkpoint
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f "$GITHUB_WORKSPACE/.github/workflows/lever-phase-a-resweep-import-once.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Retain Lever Phase A 20-run checkpoint"
          git push origin "HEAD:${HEAD_BRANCH}"
