name: OneHost fixture recovery gate

on:
  pull_request:
    paths:
      - backend/**
      - docker-compose.onehost-fixture.yml
      - scripts/verify-onehost-fixture.sh
      - .github/workflows/onehost-fixture-gate.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - docker-compose.onehost-fixture.yml
      - scripts/verify-onehost-fixture.sh
      - .github/workflows/onehost-fixture-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onehost-fixture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  owned-browser-compose-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify fixture and safety regressions in the existing backend image
        run: bash scripts/verify-onehost-fixture.sh
      - name: Retain synthetic proof, traces and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onehost-fixture-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification-artifacts/onehost-fixture.*/
          if-no-files-found: error
          retention-days: 7
