name: v2 release document consistency

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/RELEASE_NOTES_v2.00.md'
      - 'docs/KNOWN_BOUNDARIES_v2.00.md'
      - 'docs/OPERATOR_GUIDE_v2.00.md'
      - 'docs/RELEASE_CHECKLIST_v2.00.md'
      - 'docs/operations/recovery-incident-response.md'
      - 'docs/operations/DAY_41_RELEASE_CANDIDATE_AUDIT.md'
      - 'docs/operations/DAY_42_V2_RELEASE.md'
      - 'backend/tests/test_v2_release_documents.py'
      - '.github/workflows/v2-release-documents-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-document-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run v2 release-document consistency tests
        working-directory: backend
        run: |
          python -m pip install -q --disable-pip-version-check pytest
          python -m pytest -q --tb=short -ra tests/test_v2_release_documents.py

      - name: Retain prepublication document state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = [
              'VERSION',
              'README.md',
              'CHANGELOG.md',
              'docs/RELEASE_NOTES_v2.00.md',
              'docs/KNOWN_BOUNDARIES_v2.00.md',
              'docs/OPERATOR_GUIDE_v2.00.md',
              'docs/RELEASE_CHECKLIST_v2.00.md',
              'docs/operations/recovery-incident-response.md',
              'docs/operations/DAY_41_RELEASE_CANDIDATE_AUDIT.md',
              'docs/operations/DAY_42_V2_RELEASE.md',
          ]
          digests = {}
          for raw in paths:
              path = Path(raw)
              assert path.is_file(), raw
              digests[raw] = hashlib.sha256(path.read_bytes()).hexdigest()
          payload = {
              'version': 'v2-release-document-prepublication-v1',
              'source_revision': '${{ github.event.pull_request.head.sha || github.sha }}',
              'documents_consistent': True,
              'publication_claimed': False,
              'day38_to_day42_evidence_claimed_by_docs_ci': False,
              'final_evidence_reconciliation_still_required': True,
              'document_sha256': digests,
          }
          output = Path('v2-release-document-state.json')
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Upload document-state evidence
        uses: actions/upload-artifact@v7
        with:
          name: v2-release-document-state-${{ github.event.pull_request.head.sha || github.sha }}
          path: v2-release-document-state.json
          if-no-files-found: error
          retention-days: 30
