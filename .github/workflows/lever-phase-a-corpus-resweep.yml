name: Lever Phase A locked corpus resweep

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/lever-phase-a-corpus-resweep.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: lever-phase-a-corpus-resweep
  cancel-in-progress: false

env:
  PYTHONPATH: .
  DATABASE_URL: sqlite:///./lever-phase-a-resweep.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: lever-phase-a-resweep-synthetic-secret
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  APPLICATION_BROWSER_HEADLESS: "true"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  LEVER_SUPERVISED_PILOT_ENABLED: "false"
  AUTOPILOT_ENABLED: "false"
  ENABLE_RESUMABLE_HANDOFFS: "false"

jobs:
  sweep:
    if: github.head_ref == 'evidence/lever-phase-a-resweep-visible-challenge'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out resweep branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Exercise locked targets without submission
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "4"
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import shutil
          import subprocess
          import sys
          from collections import Counter
          from pathlib import Path

          shard = int(os.environ['SHARD_INDEX'])
          shard_count = int(os.environ['SHARD_COUNT'])
          root = Path('lever-phase-a-resweep') / f'shard-{shard}'
          attempts_root = root / 'attempts'
          qualifying_root = root / 'qualifying' / 'evidence' / 'lever-phase-a-artifacts'
          attempts_root.mkdir(parents=True, exist_ok=True)
          qualifying_root.mkdir(parents=True, exist_ok=True)

          def read_rows(path: Path):
              with path.open(encoding='utf-8', newline='') as handle:
                  return list(csv.DictReader(handle))

          baseline = read_rows(Path('evidence/lever-phase-a-baseline.csv'))
          already_qualified_sites = {
              row['site']
              for row in baseline
              if row.get('final_status') == 'dry_run_passed'
          }

          targets = []
          for path in sorted(Path('evidence/lever-phase-a-target-corpus').glob('part-*.csv')):
              for row in read_rows(path):
                  if str(row.get('viable') or '').lower() != 'true':
                      continue
                  if row.get('site') in already_qualified_sites:
                      continue
                  targets.append(row)
          targets.sort(key=lambda row: row['review_id'])
          targets = [
              row for index, row in enumerate(targets)
              if index % shard_count == shard
          ]

          results = []
          for target in targets:
              review_id = target['review_id']
              attempt = attempts_root / review_id
              attempt.mkdir(parents=True, exist_ok=True)
              report_path = attempt / 'lever-phase-a-report.json'
              resume_path = attempt / 'lever-phase-a-synthetic-resume.pdf'
              log_path = attempt / 'attempt.log'
              command = [
                  sys.executable,
                  '-u',
                  'scripts/certify_lever_live.py',
                  '--urls',
                  target['canonical_application_url'],
                  '--exercise',
                  '--synthetic-resume-path',
                  str(resume_path),
                  '--report',
                  str(report_path),
              ]
              return_code = None
              timeout = False
              with log_path.open('w', encoding='utf-8') as log:
                  try:
                      completed = subprocess.run(
                          command,
                          stdout=log,
                          stderr=subprocess.STDOUT,
                          check=False,
                          timeout=720,
                      )
                      return_code = completed.returncode
                  except subprocess.TimeoutExpired:
                      timeout = True
                      log.write('\nTimed out after 720 seconds.\n')

              report = None
              parse_error = None
              if report_path.is_file():
                  try:
                      report = json.loads(report_path.read_text(encoding='utf-8'))
                  except Exception as exc:
                      parse_error = f'{type(exc).__name__}: {exc}'

              items = [
                  item for item in (report or {}).get('reports') or []
                  if isinstance(item, dict)
              ]
              inspections = [item for item in items if item.get('mode') == 'inspect']
              exercises = [item for item in items if item.get('mode') == 'exercise']
              inspection = inspections[0] if len(inspections) == 1 else {}
              exercise = exercises[0] if len(exercises) == 1 else {}
              final_submit_clicked = bool(
                  (report or {}).get('final_submit_clicked')
                  or inspection.get('final_submit_clicked')
                  or exercise.get('final_submit_clicked')
              )
              if final_submit_clicked:
                  raise SystemExit(
                      f'Safety violation: {review_id} recorded a final submit action.'
                  )

              ready = bool(
                  report
                  and report.get('passed') is True
                  and len(inspections) == 1
                  and len(exercises) == 1
                  and inspection.get('passed') is True
                  and inspection.get('posting_available') is True
                  and inspection.get('posting_http_status') == 200
                  and exercise.get('passed') is True
                  and exercise.get('certification_outcome') == 'ready_to_submit'
                  and exercise.get('ready_to_submit') is True
                  and exercise.get('requires_manual_review') is False
                  and not exercise.get('review_items')
                  and not exercise.get('validation_errors')
                  and exercise.get('error') in (None, '')
                  and int(exercise.get('fields_filled') or 0) > 0
                  and int(exercise.get('control_evidence_count') or 0) > 0
                  and any(
                      item.get('verification') == 'passed'
                      for item in exercise.get('upload_evidence') or []
                  )
              )

              if ready:
                  destination = qualifying_root / review_id
                  destination.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(report_path, destination / report_path.name)
                  shutil.copy2(resume_path, destination / resume_path.name)

              results.append({
                  'review_id': review_id,
                  'employer': target['employer'],
                  'role': target['role'],
                  'site': target['site'],
                  'posting_id': target['posting_id'],
                  'region': target['region'],
                  'application_url': target['canonical_application_url'],
                  'return_code': return_code,
                  'timed_out': timeout,
                  'report_written': report_path.is_file(),
                  'report_parse_error': parse_error,
                  'inspection_passed': inspection.get('passed') is True,
                  'posting_available': inspection.get('posting_available'),
                  'posting_http_status': inspection.get('posting_http_status'),
                  'certification_outcome': exercise.get('certification_outcome') or 'failed',
                  'ready_to_submit': ready,
                  'requires_manual_review': exercise.get('requires_manual_review'),
                  'fields_filled': int(exercise.get('fields_filled') or 0),
                  'review_reason_codes': [
                      item.get('reason_code')
                      for item in exercise.get('review_items') or []
                      if item.get('reason_code')
                  ],
                  'error': str(exercise.get('error') or inspection.get('error') or '')[:500],
                  'final_submit_clicked': False,
              })

          summary = {
              'schema_version': '1.0',
              'shard_index': shard,
              'shard_count': shard_count,
              'attempted_target_count': len(results),
              'qualifying_target_count': sum(
                  1 for item in results if item['ready_to_submit']
              ),
              'outcome_counts': dict(Counter(
                  item['certification_outcome'] for item in results
              )),
              'final_submit_clicked_count': 0,
              'safety': {
                  'synthetic_profiles_only': True,
                  'captcha_bypassed': False,
                  'final_submit_clicked': False,
                  'real_submission_enabled': False,
                  'supervised_pilot_enabled': False,
                  'autopilot_enabled': False,
              },
              'results': results,
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload shard evidence
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-resweep-shard-${{ matrix.shard }}-${{ github.sha }}
          path: backend/lever-phase-a-resweep/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  catalog:
    needs: sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      review_ids: ${{ steps.catalog.outputs.review_ids }}
      qualifying_count: ${{ steps.catalog.outputs.qualifying_count }}
      attempted_count: ${{ steps.catalog.outputs.attempted_count }}

    steps:
      - name: Download all shard evidence
        uses: actions/download-artifact@v8
        with:
          pattern: lever-phase-a-resweep-shard-*-${{ github.sha }}
          path: /tmp/lever-phase-a-resweep
          merge-multiple: false

      - name: Build qualifying catalog
        id: catalog
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          root = Path('/tmp/lever-phase-a-resweep')
          summaries = []
          for path in sorted(root.rglob('summary.json')):
              summaries.append(json.loads(path.read_text(encoding='utf-8')))
          assert len(summaries) == 4, len(summaries)

          results = [
              item
              for summary in summaries
              for item in summary.get('results') or []
          ]
          review_ids = sorted(
              item['review_id']
              for item in results
              if item.get('ready_to_submit') is True
          )
          assert len(review_ids) == len(set(review_ids))
          assert not any(item.get('final_submit_clicked') for item in results)

          catalog = {
              'schema_version': '1.0',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'head_sha': os.environ['GITHUB_SHA_VALUE'],
              'attempted_target_count': len(results),
              'qualifying_target_count': len(review_ids),
              'qualifying_review_ids': review_ids,
              'outcome_counts': dict(Counter(
                  item.get('certification_outcome') or 'failed'
                  for item in results
              )),
              'safety': {
                  'synthetic_profiles_only': True,
                  'captcha_bypassed': False,
                  'final_submit_clicked': False,
                  'real_submission_enabled': False,
                  'maturity_promoted': False,
              },
              'results': results,
          }
          Path('/tmp/lever-phase-a-resweep-catalog.json').write_text(
              json.dumps(catalog, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(
                  'review_ids='
                  + json.dumps(review_ids, separators=(',', ':'))
                  + '\n'
              )
              handle.write(f'qualifying_count={len(review_ids)}\n')
              handle.write(f'attempted_count={len(results)}\n')
          print(json.dumps(catalog, indent=2, sort_keys=True))
          PY

      - name: Upload resweep catalog
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-resweep-catalog-${{ github.sha }}
          path: /tmp/lever-phase-a-resweep-catalog.json
          if-no-files-found: error
          retention-days: 30

  retain:
    needs: catalog
    if: needs.catalog.outputs.qualifying_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        review_id: ${{ fromJSON(needs.catalog.outputs.review_ids) }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out resweep branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Download shard evidence
        uses: actions/download-artifact@v8
        with:
          pattern: lever-phase-a-resweep-shard-*-${{ github.sha }}
          path: /tmp/lever-phase-a-resweep
          merge-multiple: false

      - name: Stage and validate qualifying report
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          set -euo pipefail
          report="$(find /tmp/lever-phase-a-resweep -type f -path "*/evidence/lever-phase-a-artifacts/${REVIEW_ID}/lever-phase-a-report.json" -print -quit)"
          resume="$(find /tmp/lever-phase-a-resweep -type f -path "*/evidence/lever-phase-a-artifacts/${REVIEW_ID}/lever-phase-a-synthetic-resume.pdf" -print -quit)"
          [[ -n "$report" && -f "$report" ]]
          [[ -n "$resume" && -f "$resume" ]]
          destination="evidence/lever-phase-a-artifacts/${REVIEW_ID}"
          mkdir -p "$destination"
          cp "$report" "$destination/lever-phase-a-report.json"
          cp "$resume" "$destination/lever-phase-a-synthetic-resume.pdf"

          python scripts/finalize_lever_phase_a_ready.py \
            --validate-only \
            --review-id "$REVIEW_ID" \
            --report "$destination/lever-phase-a-report.json"

      - name: Build one-record retention manifest
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          review_id = os.environ['REVIEW_ID']
          report = Path(
              f'evidence/lever-phase-a-artifacts/{review_id}/lever-phase-a-report.json'
          )
          manifest = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'commit_sha': os.environ['GITHUB_SHA'],
              'retained_record_count': 1,
              'report': {
                  'review_id': review_id,
                  'path': report.as_posix(),
                  'sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
              },
          }
          Path('lever-phase-a-ready-retention-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload independently retained ready evidence
        id: retained
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-ready-${{ matrix.review_id }}-${{ github.sha }}
          path: |
            backend/evidence/lever-phase-a-artifacts/${{ matrix.review_id }}/**
            backend/lever-phase-a-ready-retention-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Download and finalize official artifact
        env:
          REVIEW_ID: ${{ matrix.review_id }}
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
          ARTIFACT_DIGEST_OUTPUT: ${{ steps.retained.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest="${ARTIFACT_DIGEST_OUTPUT#sha256:}"
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" \
              > "/tmp/${REVIEW_ID}-metadata.json"; then
              break
            fi
            sleep $((attempt * 2))
          done
          for attempt in 1 2 3 4 5 6; do
            if curl -fL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/zip" \
              -o "/tmp/${REVIEW_ID}-artifact.zip"; then
              break
            fi
            sleep $((attempt * 2))
          done
          [[ -s "/tmp/${REVIEW_ID}-metadata.json" ]]
          [[ -s "/tmp/${REVIEW_ID}-artifact.zip" ]]
          echo "${digest}  /tmp/${REVIEW_ID}-artifact.zip" | sha256sum -c -

          python scripts/finalize_lever_phase_a_ready.py \
            --review-id "$REVIEW_ID" \
            --report "evidence/lever-phase-a-artifacts/${REVIEW_ID}/lever-phase-a-report.json" \
            --artifact-metadata "/tmp/${REVIEW_ID}-metadata.json" \
            --artifact-zip "/tmp/${REVIEW_ID}-artifact.zip" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$digest" \
            --operator github-actions

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          review_id = os.environ['REVIEW_ID']
          digest = os.environ['ARTIFACT_DIGEST_OUTPUT'].removeprefix('sha256:')
          report = Path(
              f'evidence/lever-phase-a-artifacts/{review_id}/lever-phase-a-report.json'
          )
          value = {
              'review_id': review_id,
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'artifact_id': os.environ['ARTIFACT_ID'],
              'artifact_digest': digest,
              'report_sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
              'final_submit_clicked': False,
          }
          Path(f'evidence/lever-phase-a-finalization-{review_id}.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Stage finalized package
        env:
          REVIEW_ID: ${{ matrix.review_id }}
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
          ARTIFACT_DIGEST_OUTPUT: ${{ steps.retained.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          digest="${ARTIFACT_DIGEST_OUTPUT#sha256:}"
          stage="finalized-package/evidence"
          rm -rf finalized-package
          mkdir -p \
            "$stage/lever-phase-a-artifacts/${REVIEW_ID}" \
            "$stage/lever-phase-a-external-archives/${REVIEW_ID}"
          cp -a \
            "evidence/lever-phase-a-artifacts/${REVIEW_ID}/." \
            "$stage/lever-phase-a-artifacts/${REVIEW_ID}/"
          cp \
            "evidence/lever-phase-a-candidate-${REVIEW_ID}.csv" \
            "$stage/"
          cp \
            "evidence/lever-phase-a-source-${REVIEW_ID}.csv" \
            "$stage/"
          cp \
            "evidence/lever-phase-a-finalization-${REVIEW_ID}.json" \
            "$stage/"
          cp \
            "evidence/lever-phase-a-external-archives/${REVIEW_ID}/artifact-${ARTIFACT_ID}-${digest}.zip" \
            "$stage/lever-phase-a-external-archives/${REVIEW_ID}/"

      - name: Upload finalized candidate package
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-finalized-${{ matrix.review_id }}-${{ github.sha }}
          path: backend/finalized-package
          if-no-files-found: error
          retention-days: 30

  import:
    needs: [catalog, retain]
    if: >-
      always() &&
      needs.catalog.result == 'success' &&
      (
        needs.catalog.outputs.qualifying_count == '0' ||
        needs.retain.result == 'success'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out resweep branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Download resweep catalog
        uses: actions/download-artifact@v8
        with:
          name: lever-phase-a-resweep-catalog-${{ github.sha }}
          path: /tmp/lever-phase-a-resweep-catalog

      - name: Download finalized packages
        if: needs.catalog.outputs.qualifying_count != '0'
        uses: actions/download-artifact@v8
        with:
          pattern: lever-phase-a-finalized-*-${{ github.sha }}
          path: /tmp/lever-phase-a-finalized
          merge-multiple: true

      - name: Import verified candidates and source receipts
        env:
          QUALIFYING_COUNT: ${{ needs.catalog.outputs.qualifying_count }}
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import shutil
          from pathlib import Path

          from app.services.lever_pilot_ingestion import load_phase_a_baseline

          evidence = Path('evidence')
          baseline_path = evidence / 'lever-phase-a-baseline.csv'
          sources_path = evidence / 'lever-phase-a-sources.csv'
          catalog_path = next(
              Path('/tmp/lever-phase-a-resweep-catalog').rglob(
                  'lever-phase-a-resweep-catalog.json'
              )
          )
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          review_ids = list(catalog.get('qualifying_review_ids') or [])
          assert len(review_ids) == int(os.environ['QUALIFYING_COUNT'])

          if review_ids:
              package_evidence = Path('/tmp/lever-phase-a-finalized/evidence')
              assert package_evidence.is_dir(), package_evidence
              shutil.copytree(package_evidence, evidence, dirs_exist_ok=True)

          def read_rows(path: Path):
              with path.open(encoding='utf-8', newline='') as handle:
                  reader = csv.DictReader(handle)
                  return list(reader.fieldnames or []), [dict(row) for row in reader]

          def append_one(target: Path, incoming: Path, unique_fields: tuple[str, ...]):
              fields, existing = read_rows(target)
              incoming_fields, rows = read_rows(incoming)
              assert fields == incoming_fields, (target, fields, incoming_fields)
              assert len(rows) == 1, (incoming, len(rows))
              row = rows[0]
              for old in existing:
                  assert not all(
                      old.get(key) == row.get(key) for key in unique_fields
                  ), ('duplicate import', target, unique_fields, row)
              with target.open('a', encoding='utf-8', newline='') as handle:
                  csv.DictWriter(
                      handle,
                      fieldnames=fields,
                      lineterminator='\n',
                  ).writerow(row)
              return row

          before = load_phase_a_baseline(baseline_path)
          before_qualifying = sum(
              1 for row in before if row.get('qualifies_for_dry_run_matrix') is True
          )
          imported = []
          provenance = []
          for review_id in sorted(review_ids):
              candidate = append_one(
                  baseline_path,
                  evidence / f'lever-phase-a-candidate-{review_id}.csv',
                  ('run_id',),
              )
              source = append_one(
                  sources_path,
                  evidence / f'lever-phase-a-source-{review_id}.csv',
                  ('workflow_run_id', 'artifact_id'),
              )
              finalization = json.loads(
                  (evidence / f'lever-phase-a-finalization-{review_id}.json').read_text(
                      encoding='utf-8'
                  )
              )
              assert finalization['workflow_run_id'] == source['workflow_run_id']
              assert finalization['artifact_id'] == source['artifact_id']
              assert finalization['artifact_digest'] == source['artifact_digest']
              assert candidate['source_reference'].endswith(
                  '/' + source['workflow_run_id']
              )
              imported.append(candidate)
              provenance.append(finalization)

          after = load_phase_a_baseline(baseline_path)
          for candidate in imported:
              matches = [
                  row for row in after if row.get('run_id') == candidate['run_id']
              ]
              assert len(matches) == 1
              assert matches[0]['qualifies_for_dry_run_matrix'] is True
              assert matches[0]['final_submit_clicked'] is False

          summary = {
              'schema_version': '1.0',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'head_sha': os.environ['GITHUB_SHA'],
              'attempted_target_count': catalog['attempted_target_count'],
              'outcome_counts': catalog['outcome_counts'],
              'qualifying_count_before': before_qualifying,
              'qualifying_count_added': len(imported),
              'qualifying_count_after': before_qualifying + len(imported),
              'retained_review_ids': sorted(review_ids),
              'retained_provenance': provenance,
              'safety': catalog['safety'],
              'results': catalog['results'],
          }
          (evidence / 'lever-phase-a-corpus-resweep-2026-08-04.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Regenerate readiness and campaign checkpoints
        env:
          QUALIFYING_COUNT: ${{ needs.catalog.outputs.qualifying_count }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from app.services.lever_pilot_ingestion import render_readiness_markdown
          from app.services.lever_pilot_ledger_boundary import read_lever_pilot_readiness

          readiness = read_lever_pilot_readiness(
              baseline_path=Path('evidence/lever-phase-a-baseline.csv'),
              ledger_path=Path('evidence/.missing-phase-b-runtime.jsonl'),
          )
          Path('evidence/lever-pilot-readiness.json').write_text(
              json.dumps(readiness, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('evidence/lever-pilot-readiness.md').write_text(
              render_readiness_markdown(readiness),
              encoding='utf-8',
          )
          summary = readiness['summary']
          expected = 1 + int(os.environ['QUALIFYING_COUNT'])
          assert summary['qualifying_dry_run_count'] == expected, (
              summary['qualifying_dry_run_count'], expected
          )
          assert summary['distinct_site_count'] == expected
          assert summary['canonical_maturity'] == 'dry_run'
          assert summary['promotion_ready'] is False
          assert summary['duplicate_submission_count'] == 0
          assert summary['false_submitted_count'] == 0
          assert summary['phase_a_external_archive_failure_count'] == 0
          assert summary['phase_a_inspection_failure_count'] == 0
          assert summary['gates'][
              'all_qualifying_phase_a_records_have_durable_external_archives'
          ] is True
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

          python scripts/evaluate_campaign_days_12_22.py \
            --lever evidence/lever-pilot-readiness.json \
            --output evidence/campaign-days-12-22.json

      - name: Certify regenerated evidence boundary
        run: |
          python scripts/certify_lever_pilot_readiness.py \
            --baseline evidence/lever-phase-a-baseline.csv \
            --ledger evidence/.missing-phase-b-runtime.jsonl \
            --json-output /tmp/lever-resweep-certification.json \
            --markdown-output /tmp/lever-resweep-certification.md

          pytest -q --tb=short -ra \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_readiness_hardening.py \
            tests/test_lever_pilot_certification.py \
            tests/test_lever_phase_a_ready_provenance.py

          git diff --check

      - name: Commit canonical batch import and remove one-shot workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f "$GITHUB_WORKSPACE/.github/workflows/lever-phase-a-corpus-resweep.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Retain qualifying Lever Phase A corpus resweep evidence"
          git push origin "HEAD:${HEAD_BRANCH}"
