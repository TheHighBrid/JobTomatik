name: Codacy Wave 8 exception observability

on:
  push:
    branches:
      - codex/codacy-wave8-exception-observability
    paths:
      - .github/workflows/codacy-wave8-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/codacy-wave8-exception-observability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend validation dependencies
        run: |
          python -m pip install -q -r backend/requirements.txt
          python -m pip install -q ruff
      - name: Compile and lint claimed Wave 8 files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            backend/scripts/certify_lever_live.py
            backend/scripts/certify_ashby_live.py
            backend/scripts/certify_greenhouse_live.py
            backend/scripts/certify_smartrecruiters_live.py
            backend/scripts/certify_workday_live.py
            backend/app/services/upload_handler.py
            backend/app/services/application_target_resolver.py
            backend/app/services/browser_runtime.py
            backend/app/services/operator_assisted_live_pilot_hardening.py
            backend/app/services/day37_shadow_incidents.py
            backend/scripts/probe_lever_phase_b_maple.py
            backend/app/services/control_primitives.py
            backend/app/services/application_target_handoff.py
          )
          python -m py_compile "${files[@]}"
          ruff check --select S110 "${files[@]}"
          git diff 382b1e3d6e275a1baf1c83f464fd7da0083de817...HEAD --check
      - name: Run focused regressions
        working-directory: backend
        run: |
          pytest -q \
            tests/test_external_cdp_runtime.py \
            tests/test_operator_assisted_live_pilot_hardening.py \
            tests/test_day37_shadow_incidents.py \
            tests/test_application_entry_multitab_correlation.py \
            tests/test_greenhouse_synthetic_certification.py
