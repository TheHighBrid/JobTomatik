name: Inspect PR-triggered Lever Day 14 cleanup

on:
  push:
    branches:
      - diag/lever-day14-cleanup-status
    paths:
      - .github/workflows/inspect-lever-day14-cleanup-status-v2.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Inspect cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          token = os.environ['GH_TOKEN']
          branch = 'fix/complete-lever-day14-checkpoint'
          expected_name = 'Complete Lever Day 14 checkpoint'

          def get(url):
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'JobTomatik-Day14-Cleanup-Diagnostic',
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          query = urllib.parse.urlencode({'branch': branch, 'per_page': 100})
          payload = get(f'{api}/repos/{repo}/actions/runs?{query}')
          matching = [
              run for run in payload.get('workflow_runs') or []
              if run.get('name') == expected_name
          ]
          result = {
              'schema_version': '1.0',
              'branch': branch,
              'workflow_name': expected_name,
              'runs': [],
          }
          for run in matching[:10]:
              jobs_payload = get(run['jobs_url'] + '?per_page=100')
              result['runs'].append({
                  'id': run.get('id'),
                  'head_sha': run.get('head_sha'),
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'jobs': [
                      {
                          'id': job.get('id'),
                          'name': job.get('name'),
                          'status': job.get('status'),
                          'conclusion': job.get('conclusion'),
                          'steps': [
                              {
                                  'number': step.get('number'),
                                  'name': step.get('name'),
                                  'status': step.get('status'),
                                  'conclusion': step.get('conclusion'),
                              }
                              for step in job.get('steps') or []
                          ],
                      }
                      for job in jobs_payload.get('jobs') or []
                  ],
              })
          Path('backend/evidence/lever-day14-cleanup-status-v2.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Commit diagnostic result
        run: |
          rm -f .github/workflows/inspect-lever-day14-cleanup-status-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Record PR-triggered cleanup status"
          git push origin HEAD:diag/lever-day14-cleanup-status
