name: Shadow evidence provenance

on:
  pull_request:
    paths:
      - "backend/app/api/certification.py"
      - "backend/app/services/certification_scale.py"
      - "backend/app/services/shadow_evidence_provenance.py"
      - "backend/app/services/shadow_rehearsal.py"
      - "backend/app/services/full_stack_shadow.py"
      - "backend/tests/test_certification_scale.py"
      - "backend/tests/test_shadow_evidence_provenance.py"
      - "backend/tests/test_shadow_rehearsal.py"
      - "backend/tests/test_full_stack_shadow.py"
      - "frontend/src/pages/CertificationCenter.jsx"
      - "frontend/test/certification-center.test.js"
      - "docs/PHASE12_SHADOW_EVIDENCE_PROVENANCE.md"
      - ".github/workflows/shadow-evidence-provenance.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/api/certification.py"
      - "backend/app/services/certification_scale.py"
      - "backend/app/services/shadow_evidence_provenance.py"
      - "backend/app/services/shadow_rehearsal.py"
      - "backend/app/services/full_stack_shadow.py"
      - "backend/tests/test_certification_scale.py"
      - "backend/tests/test_shadow_evidence_provenance.py"
      - "backend/tests/test_shadow_rehearsal.py"
      - "backend/tests/test_full_stack_shadow.py"
      - "frontend/src/pages/CertificationCenter.jsx"
      - "frontend/test/certification-center.test.js"
      - "docs/PHASE12_SHADOW_EVIDENCE_PROVENANCE.md"
      - ".github/workflows/shadow-evidence-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-evidence-provenance-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: sqlite:///./shadow-evidence-provenance.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: phase12-shadow-evidence-provenance-secret-2026
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  ALLOW_REAL_FOLLOWUP_SEND: "false"
  AUTOPILOT_ENABLED: "false"
  GLOBAL_KILL_SWITCH: "false"

jobs:
  phase12-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Compile Phase 12 backend surfaces
        working-directory: backend
        run: |
          python -m compileall -q \
            app/api/certification.py \
            app/services/certification_scale.py \
            app/services/shadow_evidence_provenance.py \
            app/services/shadow_rehearsal.py

      - name: Run Phase 12 provenance and bridge matrix
        working-directory: backend
        run: |
          python -m pytest -q --tb=short -ra \
            tests/test_shadow_evidence_provenance.py \
            tests/test_certification_scale.py \
            tests/test_shadow_rehearsal.py \
            tests/test_full_stack_shadow.py

      - name: Prove consequential runtime controls remain off
        working-directory: backend
        run: |
          python - <<'PY'
          from app.config import get_settings
          settings = get_settings()
          assert settings.allow_real_application_submit is False
          assert settings.allow_real_followup_send is False
          PY

      - name: Prove policy-only rehearsal cannot produce certification evidence
        working-directory: backend
        run: |
          python - <<'PY'
          from app.services.shadow_rehearsal import QUALIFICATION_SECONDS, run_shadow_rehearsal

          class Clock:
              value = 0.0
              def monotonic(self):
                  return self.value
              def sleep(self, seconds):
                  self.value += float(seconds)

          clock = Clock()
          report = run_shadow_rehearsal(
              duration_seconds=QUALIFICATION_SECONDS['shadow_run_4h'],
              interval_seconds=QUALIFICATION_SECONDS['shadow_run_4h'],
              monotonic=clock.monotonic,
              sleeper=clock.sleep,
          )
          assert report['qualification_eligible'] is True
          assert report['certification_evidence_eligible'] is False
          assert report['certification_evidence_source'] == 'full_stack_shadow_campaign_required'
          PY

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run Phase 12 frontend contract
        working-directory: frontend
        run: node --test test/certification-center.test.js

      - name: Build frontend
        working-directory: frontend
        run: npm run build
