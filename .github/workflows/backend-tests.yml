name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/package-lock.json"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: write

jobs:
  normalize-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/runtime-maintenance-regressions'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Normalize release version and remove this temporary job
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("frontend/package-lock.json")
          text = path.read_text(encoding="utf-8")
          text, top_count = re.subn(
              r'(?m)^  "version": "1\.1\.0",$',
              '  "version": "1.0.0",',
              text,
              count=1,
          )
          text, root_count = re.subn(
              r'(?m)^      "version": "1\.1\.0",$',
              '      "version": "1.0.0",',
              text,
              count=1,
          )
          if (top_count, root_count) != (1, 1):
              raise SystemExit(
                  f"Expected two stale 1.1.0 lockfile fields, found {(top_count, root_count)}"
              )
          parsed = json.loads(text)
          if parsed.get("version") != "1.0.0" or parsed.get("packages", {}).get("", {}).get("version") != "1.0.0":
              raise SystemExit("Lockfile release metadata did not normalize to 1.0.0")
          path.write_text(text, encoding="utf-8")
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/backend-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/backend-tests.yml
          if git diff --cached --quiet; then
            echo "No normalization commit required."
            exit 0
          fi
          git commit -m "Normalize release metadata"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: sqlite:///./ci-test.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      ALLOW_REAL_APPLICATION_SUBMIT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Run backend test suite
        id: pytest
        shell: bash
        run: |
          set +e
          pytest -q --tb=short --maxfail=5 -ra > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-pytest-output
          path: backend/pytest-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail when pytest failed
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
