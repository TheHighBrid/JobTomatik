name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".jobtomatik-toolchain.env"
      - ".github/dependabot.yml"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".jobtomatik-toolchain.env"
      - ".github/dependabot.yml"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: sqlite:///./ci-test.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      ALLOW_REAL_APPLICATION_SUBMIT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Run backend test suite
        id: pytest
        shell: bash
        run: |
          set +e
          pytest -q --tb=short --maxfail=5 -ra > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-pytest-output
          path: backend/pytest-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail when pytest failed
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1

  complete-day14-checkpoint:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'fix/complete-lever-day14-checkpoint'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./lever-day14-cleanup.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: lever-day14-cleanup-secret
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
      LEVER_SUPERVISED_PILOT_ENABLED: "false"
      AUTOPILOT_ENABLED: "false"
      ENABLE_RESUMABLE_HANDOFFS: "false"
    steps:
      - name: Check out immutable cleanup head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and browser dependencies
        run: |
          python -m pip install -q --disable-pip-version-check \
            -r backend/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Refuse stale completion
        run: |
          remote_sha="$(git ls-remote origin refs/heads/fix/complete-lever-day14-checkpoint | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA" || {
            echo "Branch advanced from $SOURCE_SHA to $remote_sha; refusing stale completion." >&2
            exit 1
          }

      - name: Complete checkpoint from retained artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python backend/scripts/complete_lever_day14_checkpoint.py

      - name: Run focused evidence and browser regressions
        working-directory: backend
        env:
          REQUIRE_BROWSER_TESTS: "1"
        run: |
          python -m compileall -q app scripts tests
          pytest -q --tb=short -ra \
            tests/test_text_control_evidence.py \
            tests/test_lever_control_evidence_integrity.py \
            tests/test_lever_synthetic_certification.py \
            tests/test_lever_phase_a_title_compat.py \
            tests/test_lever_phase_a_ready_provenance.py \
            tests/test_lever_phase_a_multi_archive.py \
            tests/test_lever_phase_a_ready_archive.py \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_phase_a_checkpoint_progression.py \
            tests/test_lever_readiness_hardening.py \
            tests/test_lever_pilot_certification.py \
            tests/test_campaign_day_gates.py \
            tests/test_certification_regressions.py \
            tests/test_form_filler_anonymous_controls.py

      - name: Prepare clean final checkpoint patch
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/fix/complete-lever-day14-checkpoint | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA" || {
            echo "Branch advanced before patch preparation; refusing stale completion." >&2
            exit 1
          }
          git fetch origin main
          git checkout origin/main -- .github/workflows/backend-tests.yml
          rm -f \
            .github/workflows/lever-day14-final-dry-run.yml \
            .github/workflows/recover-lever-day14-import.yml \
            .github/workflows/complete-lever-day14-checkpoint.yml \
            backend/scripts/import_lever_day14_packages.py \
            backend/scripts/complete_lever_day14_checkpoint.py \
            backend/evidence/lever-phase-a-day14-run-status.json
          rm -rf backend/evidence-ci backend/.lever-day14-staged-evidence
          git add -A
          git diff --cached --check
          git diff --cached --binary > /tmp/lever-day14-final.patch
          test -s /tmp/lever-day14-final.patch
          git status --short

      - name: Upload recoverable final patch
        uses: actions/upload-artifact@v7
        with:
          name: lever-day14-final-checkpoint-patch-${{ env.SOURCE_SHA }}
          path: /tmp/lever-day14-final.patch
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push clean checkpoint
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/fix/complete-lever-day14-checkpoint | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA" || {
            echo "Branch advanced before commit; refusing stale completion." >&2
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Complete Lever Phase A 30-run dry-run checkpoint"
          remote_sha="$(git ls-remote origin refs/heads/fix/complete-lever-day14-checkpoint | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA" || {
            echo "Branch advanced before push; refusing stale completion." >&2
            exit 1
          }
          git push origin HEAD:fix/complete-lever-day14-checkpoint
