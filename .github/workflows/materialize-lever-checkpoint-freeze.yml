name: Materialize Lever checkpoint freeze

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/materialize-lever-checkpoint-freeze.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/lever-20-run-ci-contracts'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Refresh frozen checkpoint identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/operations/lever-phase-2-measurement-freeze.json')
          freeze = json.loads(path.read_text(encoding='utf-8'))
          freeze['contract_version'] = '2026-08-04.day12.1'
          freeze['effective_date'] = '2026-08-04'
          freeze['amendment'] = {
              'previous_contract_version': '2026-08-01.day9.1',
              'purpose': (
                  'Freeze the independently archived 20-run checkpoint, '
                  'multi-artifact workflow provenance, and the audited D8-043 '
                  'supersession after visible-challenge detection was corrected.'
              ),
              'qualification_rules_changed': True,
              'qualification_weakened': False,
              'retroactive_credit_added': False,
              'canonical_qualifying_count_changed': True,
              'checkpoint_qualifying_dry_runs': 20,
              'checkpoint_distinct_sites': 20,
              'audited_supersession_count': 1,
              'remaining_manual_challenge_boundary_rows': 1,
          }
          freeze['qualification'].update({
              'multi_artifact_workflow_run_allowed': True,
              'per_record_archive_binding_required': True,
              'audited_supersession_required_for_reclassified_identity': True,
          })
          freeze['retroactive_credit_policy'] = (
              'Historical records receive quota credit only if they independently '
              'satisfy every rule in this frozen contract. The two retained '
              'CAPTCHA-boundary rows do not qualify. A later exact-target resweep '
              'may supersede a stale boundary only when the historical attempt and '
              'source receipt remain preserved, the replacement is independently '
              'archived, and quota credit is counted once.'
          )

          inputs = freeze['canonical_inputs']
          for value in (
              'backend/scripts/verify_lever_phase_a_checkpoint.py',
              'backend/tests/test_lever_phase_a_multi_archive.py',
          ):
              if value not in inputs:
                  inputs.append(value)

          freeze['locked_input_blobs'].update({
              'backend/app/services/lever_phase_a_archive.py': (
                  'f513d632738a3c06124e0f1dd98ab6af8306e746'
              ),
              'backend/scripts/verify_lever_phase_a_checkpoint.py': (
                  'af7380981421dba4645fa8bf1b3ce0008b5ba541'
              ),
              '.github/workflows/lever-phase-a-certification.yml': (
                  '0e923eb6ea5317279ab2a878e2936cd88713461f'
              ),
              '.github/workflows/phase-1-release-gate.yml': (
                  'b51e50716c4697c7e0bdec0f439d32c0cf5c33a9'
              ),
              'backend/tests/test_phase_1_release_gate.py': (
                  '51404bda7bdf328e4419021f12456b1b4db350e9'
              ),
              'backend/tests/test_lever_phase_a_multi_archive.py': (
                  'a74b029772194fc457dfca2d140363b02644c321'
              ),
          })

          receipts = freeze['audit_receipts']
          for value in (
              'backend/evidence/lever-phase-a-corpus-resweep-2026-08-04.json',
              'backend/evidence/lever-phase-a-supersessions.json',
          ):
              if value not in receipts:
                  receipts.append(value)

          evidence_inputs = freeze['evidence_inputs']
          supersession = 'backend/evidence/lever-phase-a-supersessions.json'
          if supersession not in evidence_inputs:
              evidence_inputs.insert(2, supersession)

          path.write_text(
              json.dumps(freeze, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Verify freeze and Phase 1 checkpoint test
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q --tb=short -ra tests/test_phase_1_release_gate.py
          git -C .. diff --check

      - name: Commit freeze and remove materializer
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-lever-checkpoint-freeze.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh Lever Phase A checkpoint freeze"
          git push origin "HEAD:${HEAD_BRANCH}"
