name: Publish JobTomatik v2 by owner-authorized exact commit

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character main commit approved for JobTomatik v2.00
        required: true
        type: string
      authorization_reference:
        description: Owner approval or release-audit reference
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-jobtomatik-v2
  cancel-in-progress: false

env:
  APK_NAME: JobTomatik-v2.00.apk
  RELEASE_TAG: v2.0.0
  EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
  AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}

jobs:
  authorize-exact-release:
    if: github.actor == 'TheHighBrid'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify owner authorization and exact current main commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test -n "$AUTHORIZATION_REFERENCE"
          git fetch origin main --no-tags
          MAIN_HEAD="$(git rev-parse origin/main)"
          test "$EXPECTED_SOURCE_COMMIT" = "$MAIN_HEAD"
          git cat-file -e "$EXPECTED_SOURCE_COMMIT^{commit}"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists; refusing mutable republish." >&2
            exit 1
          fi
          echo "source_commit=$EXPECTED_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: authorize-exact-release
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SOURCE_COMMIT: ${{ needs.authorize-exact-release.outputs.source_commit }}
      VITE_JOBTOMATIK_RUNTIME_REVISION: ${{ needs.authorize-exact-release.outputs.source_commit }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out exact approved source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize-exact-release.outputs.source_commit }}
          fetch-depth: 0

      - name: Re-attest source before build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend and synchronize Capacitor
        run: npm run android:prepare

      - name: Select explicit signing mode
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.JOBTOMATIK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JOBTOMATIK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JOBTOMATIK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JOBTOMATIK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/jobtomatik-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "JOBTOMATIK_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "JOBTOMATIK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "JOBTOMATIK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "JOBTOMATIK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "APK_VARIANT=release" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
          else
            echo "APK_VARIANT=debug" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=development" >> "$GITHUB_ENV"
          fi

      - name: Lint and assemble exact-source APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon lintDebug
          if [ "$APK_VARIANT" = "release" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Package and verify JobTomatik v2.00
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APK_VARIANT" = "release" ]; then
            SOURCE_APK="android/app/build/outputs/apk/release/app-release.apk"
          else
            SOURCE_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          fi

          test -s "$SOURCE_APK"
          mkdir -p release
          cp "$SOURCE_APK" "release/$APK_NAME"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "release/$APK_NAME" | tee release/APK-BADGING.txt
          grep -q "package: name='ca.jobtomatik.app'" release/APK-BADGING.txt
          grep -q "versionCode='200'" release/APK-BADGING.txt
          grep -q "versionName='2.0.0'" release/APK-BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "release/$APK_NAME" | tee release/APK-SIGNING.txt

          sha256sum "release/$APK_NAME" > release/JobTomatik-v2.00.sha256
          printf '%s\n' "$SOURCE_COMMIT" > release/SOURCE-COMMIT.txt
          grep -Fxq "$SOURCE_COMMIT" release/SOURCE-COMMIT.txt

          cat > release/BUILD-INFO.txt <<EOF
          JobTomatik v2.00
          Technical version: 2.0.0
          Android application ID: ca.jobtomatik.app
          Android version code: 200
          Signing mode: $SIGNING_MODE
          Source commit: $SOURCE_COMMIT
          Authorization reference: $AUTHORIZATION_REFERENCE
          Built by: GitHub Actions exact-commit publisher
          EOF

          cat > release/RELEASE_NOTES.md <<EOF
          # JobTomatik v2.00

          This artifact is built from the exact owner-authorized release commit.

          - Android version: 2.0.0
          - Android version code: 200
          - Application ID: ca.jobtomatik.app
          - Signing mode: $SIGNING_MODE
          - Source commit: $SOURCE_COMMIT
          - Authorization reference: $AUTHORIZATION_REFERENCE

          Publication does not itself promote adapter maturity. Runtime autonomy remains bounded by the exact tagged manifest, certified-adapter maturity, policy limits, and fail-safe submission controls.
          EOF

      - name: Upload immutable release bundle candidate
        uses: actions/upload-artifact@v7
        with:
          name: JobTomatik-v2.00-${{ needs.authorize-exact-release.outputs.source_commit }}
          path: frontend/release/*
          if-no-files-found: error
          retention-days: 90

      - name: Re-attest main immediately before publication
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG appeared during build; refusing overwrite." >&2
            exit 1
          fi

      - name: Publish immutable GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.0.0
          target_commitish: ${{ needs.authorize-exact-release.outputs.source_commit }}
          name: JobTomatik v2.00
          body_path: frontend/release/RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            frontend/release/JobTomatik-v2.00.apk
            frontend/release/JobTomatik-v2.00.sha256
            frontend/release/SOURCE-COMMIT.txt
            frontend/release/BUILD-INFO.txt
            frontend/release/APK-BADGING.txt
            frontend/release/APK-SIGNING.txt
