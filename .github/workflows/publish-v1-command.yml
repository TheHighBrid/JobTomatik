name: Publish JobTomatik v2 by authorized command

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: publish-jobtomatik-v2-command
  cancel-in-progress: false

env:
  AUTHORIZED_PR_NUMBER: "142"
  RELEASE_COMMAND: /publish-jobtomatik-v2.0.0
  APK_NAME: JobTomatik-v2.00.apk

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 142 &&
      github.event.comment.body == '/publish-jobtomatik-v2.0.0' &&
      (github.event.comment.user.login == 'TheHighBrid' ||
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-24.04
    steps:
      - name: Announce authorized publication
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.AUTHORIZED_PR_NUMBER),
              body: `🚀 Authorized JobTomatik v2.00 publication started.\n\nRun: ${runUrl}\nSource branch: main`,
            });

  build-and-publish:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out current main source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend and synchronize Capacitor
        run: npm run android:prepare

      - name: Select signing mode
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.JOBTOMATIK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JOBTOMATIK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JOBTOMATIK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JOBTOMATIK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/jobtomatik-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "JOBTOMATIK_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "JOBTOMATIK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "JOBTOMATIK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "JOBTOMATIK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "APK_VARIANT=release" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
          else
            echo "APK_VARIANT=debug" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=development" >> "$GITHUB_ENV"
          fi

      - name: Lint and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon lintDebug
          if [ "$APK_VARIANT" = "release" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Package and verify JobTomatik v2.00
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APK_VARIANT" = "release" ]; then
            SOURCE_APK="android/app/build/outputs/apk/release/app-release.apk"
          else
            SOURCE_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          fi

          test -s "$SOURCE_APK"
          mkdir -p release
          cp "$SOURCE_APK" "release/$APK_NAME"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "release/$APK_NAME" | tee release/APK-BADGING.txt
          grep -q "package: name='ca.jobtomatik.app'" release/APK-BADGING.txt
          grep -q "versionCode='200'" release/APK-BADGING.txt
          grep -q "versionName='2.0.0'" release/APK-BADGING.txt

          sha256sum "release/$APK_NAME" > release/JobTomatik-v2.00.sha256

          cat > release/BUILD-INFO.txt <<EOF
          JobTomatik v2.00
          Technical version: 2.0.0
          Android application ID: ca.jobtomatik.app
          Android version code: 200
          Signing mode: $SIGNING_MODE
          Source commit: $GITHUB_SHA
          Built by: GitHub Actions authorized-command publisher
          EOF

          cat > release/RELEASE_NOTES.md <<EOF
          # JobTomatik v2.00

          JobTomatik v2.00 packages the current JobTomatik application and updated visual system into a new Android build.

          - Android version: 2.0.0
          - Android version code: 200
          - Application ID: ca.jobtomatik.app
          - Signing mode: $SIGNING_MODE
          - Source commit: $GITHUB_SHA

          The APK was compiled, linted, identity-checked, version-checked, and supplied with a SHA-256 checksum by GitHub Actions.
          EOF

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: JobTomatik-v2.00-command-release-bundle
          path: frontend/release/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.0.0
          target_commitish: main
          name: JobTomatik v2.00
          body_path: frontend/release/RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            frontend/release/JobTomatik-v2.00.apk
            frontend/release/JobTomatik-v2.00.sha256
            frontend/release/BUILD-INFO.txt
            frontend/release/APK-BADGING.txt

  report-release-status:
    needs:
      - authorize
      - build-and-publish
    if: always() && needs.authorize.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Report publication result
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const build = '${{ needs.build-and-publish.result }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.AUTHORIZED_PR_NUMBER),
              body: `JobTomatik v2.00 publication finished.\n\n- Build and release: **${build}**\n- Run: ${runUrl}`,
            });
