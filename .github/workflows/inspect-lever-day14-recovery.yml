name: Inspect Lever Day 14 recovery

on:
  push:
    branches:
      - checkpoint/lever-phase-a-day14-dry-run
    paths:
      - .github/workflows/inspect-lever-day14-recovery.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Read recovery run metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          token = os.environ['GH_TOKEN']
          workflow = 'recover-lever-day14-import.yml'
          branch = 'checkpoint/lever-phase-a-day14-dry-run'

          def get(url):
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'JobTomatik-Day14-Recovery-Diagnostic',
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          query = urllib.parse.urlencode({
              'branch': branch,
              'event': 'push',
              'per_page': 10,
          })
          payload = get(
              f'{api}/repos/{repo}/actions/workflows/{workflow}/runs?{query}'
          )
          runs = list(payload.get('workflow_runs') or [])
          result = {
              'schema_version': '1.0',
              'workflow': workflow,
              'branch': branch,
              'run_found': bool(runs),
          }
          if runs:
              run = runs[0]
              jobs_payload = get(run['jobs_url'] + '?per_page=100')
              result['run'] = {
                  'id': run.get('id'),
                  'head_sha': run.get('head_sha'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
              }
              result['jobs'] = [
                  {
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'failed_steps': [
                          {
                              'number': step.get('number'),
                              'name': step.get('name'),
                              'conclusion': step.get('conclusion'),
                          }
                          for step in job.get('steps') or []
                          if step.get('conclusion') not in (None, 'success', 'skipped')
                      ],
                  }
                  for job in jobs_payload.get('jobs') or []
              ]
          path = Path('backend/evidence/lever-phase-a-day14-recovery-status.json')
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Commit status and remove inspector
        run: |
          rm -f .github/workflows/inspect-lever-day14-recovery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Record final checkpoint recovery status"
          git push origin HEAD:checkpoint/lever-phase-a-day14-dry-run
