name: Zero-cost OneHost stability gate

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "backend/app/services/onehost_startup_recovery.py"
      - "backend/tests/test_onehost_startup_recovery.py"
      - "backend/tests/test_onehost_production_cutover.py"
      - "backend/tests/test_operator_diagnostics.py"
      - "frontend/src/api/client.js"
      - "frontend/src/api/connection.js"
      - "frontend/test/api-connection.test.js"
      - "docker-compose.onehost-production.yml"
      - "scripts/verify.sh"
      - ".github/workflows/zero-cost-onehost-stability.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "backend/app/services/onehost_startup_recovery.py"
      - "backend/tests/test_onehost_startup_recovery.py"
      - "backend/tests/test_onehost_production_cutover.py"
      - "backend/tests/test_operator_diagnostics.py"
      - "frontend/src/api/client.js"
      - "frontend/src/api/connection.js"
      - "frontend/test/api-connection.test.js"
      - "docker-compose.onehost-production.yml"
      - "scripts/verify.sh"
      - ".github/workflows/zero-cost-onehost-stability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-cost-onehost-stability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  DATABASE_URL: sqlite:///./zero-cost-stability.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: zero-cost-ci-only-secret-placeholder
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  ALLOW_REAL_FOLLOWUP_SEND: "false"
  AUTOPILOT_ENABLED: "false"
  GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
  LEVER_SUPERVISED_PILOT_ENABLED: "false"
  RESTART_CYCLES: "3"

jobs:
  zero-cost-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate ephemeral OneHost secrets
        shell: bash
        run: |
          echo "POSTGRES_PASSWORD=$(python -c 'import secrets; print(secrets.token_hex(24))')" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "ANSWER_VAULT_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "JOBTOMATIK_RUNTIME_REVISION=$SOURCE_COMMIT" >> "$GITHUB_ENV"

      - name: Install focused test dependencies
        run: |
          python -m pip install -q --disable-pip-version-check -r backend/requirements.txt
          npm ci --prefix frontend

      - name: Run repeated recovery and thin-client regressions
        run: |
          python -m pytest -q --tb=short -ra \
            backend/tests/test_onehost_startup_recovery.py \
            backend/tests/test_onehost_production_cutover.py \
            backend/tests/test_operator_diagnostics.py \
            --junitxml="$RUNNER_TEMP/zero-cost-backend-junit.xml"
          node --test frontend/test/api-connection.test.js

      - name: Verify canonical fail-closed safety
        run: bash scripts/verify.sh safety

      - name: Validate production Compose
        run: docker compose -f docker-compose.onehost-production.yml config > /dev/null

      - name: Boot ephemeral OneHost topology
        run: docker compose -f docker-compose.onehost-production.yml up -d --build

      - name: Prove repeated worker restart recovery
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f docker-compose.onehost-production.yml)

          wait_api() {
            for attempt in {1..60}; do
              if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          wait_worker() {
            for attempt in {1..60}; do
              worker_id="$("${compose[@]}" ps -q celery_worker)"
              if [[ -n "$worker_id" ]]; then
                status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$worker_id")"
                if [[ "$status" == "healthy" ]]; then
                  return 0
                fi
              fi
              sleep 2
            done
            return 1
          }

          wait_api
          wait_worker

          : > "$RUNNER_TEMP/zero-cost-restart-cycles.txt"
          for cycle in $(seq 1 "$RESTART_CYCLES"); do
            echo "cycle=$cycle restart=begin" | tee -a "$RUNNER_TEMP/zero-cost-restart-cycles.txt"
            "${compose[@]}" restart celery_worker
            wait_api
            wait_worker

            worker_id="$("${compose[@]}" ps -q celery_worker)"
            test -n "$worker_id"
            docker exec "$worker_id" celery -A app.celery_app inspect ping --timeout 5 | grep -q pong
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null
            echo "cycle=$cycle api=healthy worker=healthy celery=pong" | tee -a "$RUNNER_TEMP/zero-cost-restart-cycles.txt"
          done

      - name: Record zero-cost stability evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "zero-cost-stability.json"
          cycles_path = Path(os.environ["RUNNER_TEMP"]) / "zero-cost-restart-cycles.txt"
          cycle_text = cycles_path.read_text(encoding="utf-8") if cycles_path.exists() else ""
          completed = cycle_text.count("api=healthy worker=healthy celery=pong")
          expected = int(os.environ["RESTART_CYCLES"])

          payload = {
              "schema_version": "1.0",
              "source_commit": os.environ["SOURCE_COMMIT"],
              "validation_scope": "synthetic/ephemeral zero-cost OneHost stability",
              "paid_infrastructure_used": False,
              "external_cloud_host_required": False,
              "real_application_submit_enabled": False,
              "real_followup_send_enabled": False,
              "autopilot_enabled": False,
              "greenhouse_supervised_pilot_enabled": False,
              "lever_supervised_pilot_enabled": False,
              "restart_cycles_expected": expected,
              "restart_cycles_completed": completed,
              "restart_cycles_passed": completed == expected,
              "grants_submit": False,
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Capture OneHost logs
        if: always()
        shell: bash
        run: |
          docker compose -f docker-compose.onehost-production.yml ps > "$RUNNER_TEMP/zero-cost-onehost-ps.txt" 2>&1 || true
          docker compose -f docker-compose.onehost-production.yml logs --no-color > "$RUNNER_TEMP/zero-cost-onehost.log" 2>&1 || true

      - name: Tear down ephemeral topology
        if: always()
        run: docker compose -f docker-compose.onehost-production.yml down -v --remove-orphans || true

      - name: Assert zero-cost stability proof completed
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "zero-cost-stability.json").read_text(encoding="utf-8")
          )
          assert payload["source_commit"] == os.environ["SOURCE_COMMIT"]
          assert payload["paid_infrastructure_used"] is False
          assert payload["external_cloud_host_required"] is False
          assert payload["restart_cycles_passed"] is True
          assert payload["real_application_submit_enabled"] is False
          assert payload["real_followup_send_enabled"] is False
          assert payload["autopilot_enabled"] is False
          assert payload["grants_submit"] is False
          PY

      - name: Retain zero-cost stability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zero-cost-onehost-stability-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/zero-cost-stability.json
            ${{ runner.temp }}/zero-cost-restart-cycles.txt
            ${{ runner.temp }}/zero-cost-backend-junit.xml
            ${{ runner.temp }}/zero-cost-onehost-ps.txt
            ${{ runner.temp }}/zero-cost-onehost.log
          if-no-files-found: warn
          retention-days: 30
