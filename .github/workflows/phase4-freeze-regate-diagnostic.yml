name: Phase 4 freeze regate diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/phase4-freeze-regate-diagnostic.yml'
      - 'backend/tests/test_ats_maturity.py'
      - 'backend/tests/test_autonomy_release_contract.py'
      - 'backend/tests/test_greenhouse*.py'
      - 'backend/tests/test_lever*.py'
      - 'backend/tests/test_ashby*.py'
      - 'backend/tests/test_smartrecruiters*.py'
      - 'backend/tests/test_workday*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-digests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Recompute and cross-check Phase 4 fixture digests
        shell: bash
        run: |
          set -euo pipefail
          FREEZE_COMMIT="$(python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('backend/evidence/day28-phase4-version-freeze.json').read_text())
          print(value['freeze_source_commit'])
          PY
          )"
          git fetch --no-tags origin "$FREEZE_COMMIT" --depth=1
          python - "$FREEZE_COMMIT" <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          freeze_commit = sys.argv[1]
          freeze = json.loads(
              (root / 'backend/evidence/day28-phase4-version-freeze.json').read_text(encoding='utf-8')
          )
          adapters = ('greenhouse', 'lever', 'ashby', 'smartrecruiters', 'workday')
          common = (
              'backend/tests/test_ats_maturity.py',
              'backend/tests/test_autonomy_release_contract.py',
          )

          def digest_entries(entries):
              digest = hashlib.sha256()
              for relative, content in sorted(entries, key=lambda item: item[0]):
                  digest.update(relative.encode('utf-8'))
                  digest.update(b'\0')
                  digest.update(content)
                  digest.update(b'\0')
              return digest.hexdigest()

          current_names = [
              p.relative_to(root).as_posix()
              for p in (root / 'backend/tests').glob('test_*.py')
          ]
          freeze_names = subprocess.check_output(
              ['git', 'ls-tree', '-r', '--name-only', freeze_commit, 'backend/tests'],
              text=True,
          ).splitlines()

          result = {}
          failures = []
          for adapter in adapters:
              pattern = re.compile(rf'^backend/tests/test_{re.escape(adapter)}.*\.py$')
              current_scoped_names = sorted(name for name in current_names if pattern.match(name))
              freeze_scoped_names = sorted(name for name in freeze_names if pattern.match(name))
              if not current_scoped_names or not freeze_scoped_names:
                  failures.append(f'{adapter}:adapter_fixture_set_missing')
                  continue

              current_scoped = digest_entries(
                  [(name, (root / name).read_bytes()) for name in current_scoped_names]
              )
              freeze_scoped = digest_entries(
                  [
                      (name, subprocess.check_output(['git', 'show', f'{freeze_commit}:{name}']))
                      for name in freeze_scoped_names
                  ]
              )

              current_legacy_names = [*current_scoped_names, *common]
              freeze_legacy_names = [*freeze_scoped_names, *common]
              current_legacy = digest_entries(
                  [(name, (root / name).read_bytes()) for name in current_legacy_names]
              )
              freeze_legacy = digest_entries(
                  [
                      (name, subprocess.check_output(['git', 'show', f'{freeze_commit}:{name}']))
                      for name in freeze_legacy_names
                  ]
              )
              retained_legacy = freeze['adapters'][adapter]['digests']['fixture_regression_sha256']

              checks = {
                  'retained_legacy_matches_freeze_commit': freeze_legacy == retained_legacy,
                  'adapter_scoped_unchanged_since_freeze': current_scoped == freeze_scoped,
                  'legacy_full_digest_changed': current_legacy != freeze_legacy,
              }
              if not checks['retained_legacy_matches_freeze_commit']:
                  failures.append(f'{adapter}:retained_legacy_digest_mismatch')
              if not checks['adapter_scoped_unchanged_since_freeze']:
                  failures.append(f'{adapter}:adapter_scoped_fixture_drift')

              result[adapter] = {
                  'freeze_legacy_sha256': freeze_legacy,
                  'retained_legacy_sha256': retained_legacy,
                  'current_legacy_sha256': current_legacy,
                  'freeze_adapter_scoped_sha256': freeze_scoped,
                  'current_adapter_scoped_sha256': current_scoped,
                  'checks': checks,
              }

          payload = {
              'freeze_commit': freeze_commit,
              'current_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'adapters': result,
              'failures': failures,
              'passed': not failures,
          }
          Path('phase4-freeze-regate-diagnostic.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('PHASE4_FREEZE_REGATE=' + json.dumps(payload, sort_keys=True))
          if failures:
              raise SystemExit(1)
          PY
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase4-freeze-regate-diagnostic
          path: phase4-freeze-regate-diagnostic.json
          if-no-files-found: error
          retention-days: 30
