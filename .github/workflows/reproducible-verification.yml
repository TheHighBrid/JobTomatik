name: Reproducible verification

on:
  pull_request:
    paths:
      - ".jobtomatik-toolchain.env"
      - "scripts/verify.sh"
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".env.example"
      - "README.md"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/reproducible-verification.yml"
  push:
    branches:
      - main
    paths:
      - ".jobtomatik-toolchain.env"
      - "scripts/verify.sh"
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".env.example"
      - "README.md"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/reproducible-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: sqlite:///./jobtomatik-verification.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: jobtomatik-development-secret
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  AUTOPILOT_ENABLED: "false"
  ENABLE_RESUMABLE_HANDOFFS: "false"

jobs:
  fast-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run fast verification gate
        run: bash scripts/verify.sh fast

  backend-browser-migration:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node for toolchain contract
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r backend/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run full backend and browser tests
        run: bash scripts/verify.sh backend-tests

      - name: Upload backend verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproducible-verification-backend
          path: backend/verification-pytest-output.txt
          if-no-files-found: error
          retention-days: 14

      - name: Run migration smoke test
        run: bash scripts/verify.sh migration

      - name: Verify safety and adapter maturity
        run: bash scripts/verify.sh safety

  frontend-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python for toolchain contract
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend verification gate
        run: bash scripts/verify.sh frontend

  deployment-config:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python for toolchain contract
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node for toolchain contract
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"

      - name: Run deployment verification gate
        run: bash scripts/verify.sh deployment

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python for toolchain contract
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Android verification gate
        run: bash scripts/verify.sh android

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproducible-verification-android
          path: |
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
            frontend/android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

  release-gate:
    if: always()
    needs:
      - fast-gate
      - backend-browser-migration
      - frontend-build
      - deployment-config
      - android
    runs-on: ubuntu-22.04
    steps:
      - name: Assert every reproducibility gate passed
        env:
          FAST_RESULT: ${{ needs.fast-gate.result }}
          BACKEND_RESULT: ${{ needs.backend-browser-migration.result }}
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-config.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$FAST_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$DEPLOYMENT_RESULT" = "success"
          test "$ANDROID_RESULT" = "success"
          echo "Reproducible verification gate passed"
