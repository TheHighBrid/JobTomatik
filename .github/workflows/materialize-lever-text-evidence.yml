name: Materialize Lever text evidence

on:
  push:
    branches:
      - fix/lever-text-control-evidence
    paths:
      - backend/scripts/materialize_text_control_evidence.py
      - .github/workflows/materialize-lever-text-evidence.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/lever-text-control-evidence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply audited patch
        run: python backend/scripts/materialize_text_control_evidence.py

      - name: Verify syntax and diff
        run: |
          python -m py_compile \
            backend/app/services/form_filler_v3.py \
            backend/tests/test_text_control_evidence.py
          git diff --check
          git diff --exit-code -- \
            backend/scripts/materialize_text_control_evidence.py \
            .github/workflows/materialize-lever-text-evidence.yml

      - name: Commit materialized source
        run: |
          git rm backend/scripts/materialize_text_control_evidence.py
          git rm .github/workflows/materialize-lever-text-evidence.yml
          git add backend/app/services/form_filler_v3.py \
            backend/tests/test_text_control_evidence.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Record verified text control evidence"
          git push origin HEAD:fix/lever-text-control-evidence
