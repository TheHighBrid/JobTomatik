name: Codacy current PR metadata probe

on:
  push:
    branches:
      - codex/codacy-pr-issues-slim
    paths:
      - .github/workflows/codacy-pr-issues-slim.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Print current PR metadata and new issues
        shell: bash
        run: |
          set -euo pipefail
          base='https://api.codacy.com/api/v3/analysis/organizations/gh/TheHighBrid/repositories/JobTomatik/pull-requests/516'
          curl --fail-with-body -sS -H 'Accept: application/json' "$base" > /tmp/meta.json
          curl --fail-with-body -sS -H 'Accept: application/json' "$base/issues?status=new&limit=100" > /tmp/new.json
          python - <<'PY'
          import json
          from pathlib import Path
          meta=json.loads(Path("/tmp/meta.json").read_text())
          new=json.loads(Path("/tmp/new.json").read_text())
          print("META",json.dumps({
              "head":(meta.get("pullRequest") or {}).get("headCommitSha"),
              "isUpToStandards":meta.get("isUpToStandards"),
              "fixedIssues":meta.get("fixedIssues"),
              "newIssues":meta.get("newIssues"),
              "newComplexity":meta.get("newComplexity"),
          },sort_keys=True))
          print("NEW_ANALYZED",new.get("analyzed"))
          for x in new.get("data") or []:
              ci=x.get("commitIssue") or x
              print("NEW",json.dumps({
                  "filePath":ci.get("filePath"),
                  "lineNumber":ci.get("lineNumber"),
                  "lineText":ci.get("lineText"),
                  "message":ci.get("message"),
                  "pattern":(ci.get("patternInfo") or {}).get("id"),
                  "category":(ci.get("patternInfo") or {}).get("category"),
                  "level":(ci.get("patternInfo") or {}).get("level"),
                  "tool":(ci.get("toolInfo") or {}).get("name"),
              },sort_keys=True))
          PY
