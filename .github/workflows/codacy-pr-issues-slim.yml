name: Codacy PR issue probe slim

on:
  push:
    branches:
      - codex/codacy-pr-issues-slim
    paths:
      - .github/workflows/codacy-pr-issues-slim.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Fetch exact PR analysis and deltas
        shell: bash
        run: |
          set -euo pipefail
          base='https://api.codacy.com/api/v3/analysis/organizations/gh/TheHighBrid/repositories/JobTomatik/pull-requests/516'
          curl --fail-with-body -sS -H 'Accept: application/json' "$base" > /tmp/pr.json
          curl --fail-with-body -sS -H 'Accept: application/json' "$base/issues?status=all&limit=100" > /tmp/issues-all.json
          curl --fail-with-body -sS -H 'Accept: application/json' "$base/issues?status=new&limit=100" > /tmp/issues-new.json
          python - <<'PY'
          import json
          from pathlib import Path
          pr=json.loads(Path("/tmp/pr.json").read_text())
          print("PR_META", json.dumps(pr, sort_keys=True))
          for label,name in [("ALL","/tmp/issues-all.json"),("NEW","/tmp/issues-new.json")]:
              p=json.loads(Path(name).read_text())
              print(label+"_ANALYZED", p.get("analyzed"))
              print(label+"_COUNT", len(p.get("data") or []))
              print(label+"_PAGINATION", json.dumps(p.get("pagination"), sort_keys=True))
              for x in p.get("data") or []:
                  ci=x.get("commitIssue") or {}
                  pi=ci.get("patternInfo") or {}
                  ti=ci.get("toolInfo") or {}
                  row={
                      "deltaType":x.get("deltaType"),
                      "filePath":ci.get("filePath"),
                      "lineNumber":ci.get("lineNumber"),
                      "pattern":pi.get("id"),
                      "category":pi.get("category"),
                      "level":pi.get("level") or pi.get("severityLevel"),
                      "tool":ti.get("name"),
                      "message":ci.get("message"),
                  }
                  print(label+"_ISSUE", json.dumps(row, sort_keys=True))
          PY
