name: Codacy current fixed export

on:
  push:
    branches:
      - codex/codacy-pr-issues-slim
    paths:
      - .github/workflows/codacy-pr-issues-slim.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Export current fixed issues for PR 516
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/codacy-current
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          base='https://api.codacy.com/api/v3/analysis/organizations/gh/TheHighBrid/repositories/JobTomatik/pull-requests/516'
          def get(url):
              req=urllib.request.Request(url,headers={'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())

          meta=get(base)
          rows=[]
          cursor=None
          while True:
              q={'status':'fixed','limit':100}
              if cursor:
                  q['cursor']=cursor
              payload=get(base+'/issues?'+urllib.parse.urlencode(q))
              rows.extend(payload.get('data') or [])
              cursor=(payload.get('pagination') or {}).get('cursor')
              if not cursor:
                  break
          out={
              'head':(meta.get('pullRequest') or {}).get('headCommitSha'),
              'fixedIssues':meta.get('fixedIssues'),
              'newIssues':meta.get('newIssues'),
              'isUpToStandards':meta.get('isUpToStandards'),
              'count':len(rows),
              'data':rows,
          }
          Path('/tmp/codacy-current/fixed.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:out[k] for k in ('head','fixedIssues','newIssues','isUpToStandards','count')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: codacy-pr-516-current-fixed
          path: /tmp/codacy-current/fixed.json
          if-no-files-found: error
          retention-days: 1
