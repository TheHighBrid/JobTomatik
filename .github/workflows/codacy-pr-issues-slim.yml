name: Codacy current PR new issue probe

on:
  push:
    branches:
      - codex/codacy-pr-issues-slim
    paths:
      - .github/workflows/codacy-pr-issues-slim.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Print exact current PR new issues
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.codacy.com/api/v3/analysis/organizations/gh/TheHighBrid/repositories/JobTomatik/pull-requests/516/issues?status=new&limit=100'
          curl --fail-with-body -sS -H 'Accept: application/json' "$url" > /tmp/issues.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/issues.json").read_text())
          print("ANALYZED", p.get("analyzed"))
          print("COUNT", len(p.get("data") or []))
          for x in p.get("data") or []:
              ci=x.get("commitIssue") or x
              print(json.dumps({
                  "deltaType":x.get("deltaType"),
                  "issueId":ci.get("issueId"),
                  "filePath":ci.get("filePath"),
                  "lineNumber":ci.get("lineNumber"),
                  "lineText":ci.get("lineText"),
                  "message":ci.get("message"),
                  "pattern":(ci.get("patternInfo") or {}).get("id"),
                  "category":(ci.get("patternInfo") or {}).get("category"),
                  "level":(ci.get("patternInfo") or {}).get("level"),
                  "tool":(ci.get("toolInfo") or {}).get("name"),
              },sort_keys=True))
          PY
