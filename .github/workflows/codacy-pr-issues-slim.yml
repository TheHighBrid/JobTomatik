name: Codacy PR delta export slim

on:
  push:
    branches:
      - codex/codacy-pr-issues-slim
    paths:
      - .github/workflows/codacy-pr-issues-slim.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Export complete PR deltas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/codacy-pr-delta
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          BASE='https://api.codacy.com/api/v3/analysis/organizations/gh/TheHighBrid/repositories/JobTomatik/pull-requests/516'

          def get(url):
              req=urllib.request.Request(url,headers={'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())

          meta=get(BASE)
          Path('/tmp/codacy-pr-delta/meta.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')

          for status in ('fixed','new','all'):
              rows=[]
              cursor=None
              while True:
                  q={'status':status,'limit':100}
                  if cursor:
                      q['cursor']=cursor
                  p=get(BASE+'/issues?'+urllib.parse.urlencode(q))
                  rows.extend(p.get('data') or [])
                  cursor=(p.get('pagination') or {}).get('cursor')
                  if not cursor:
                      analyzed=p.get('analyzed')
                      break
              Path(f'/tmp/codacy-pr-delta/{status}.json').write_text(
                  json.dumps({'analyzed':analyzed,'data':rows,'count':len(rows)},indent=2,sort_keys=True)+'\n'
              )
              print(status.upper(),len(rows))
          print('HEAD',meta.get('pullRequest',{}).get('headCommitSha'))
          print('UP_TO_STANDARDS',meta.get('isUpToStandards'))
          print('FIXED',meta.get('fixedIssues'),'NEW',meta.get('newIssues'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: codacy-pr-516-delta
          path: /tmp/codacy-pr-delta/
          if-no-files-found: error
          retention-days: 1
