name: Import retained Lever D8-003 evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/import-d8-003-evidence.yml"

permissions:
  contents: write
  actions: read

jobs:
  import-retained-evidence:
    if: github.head_ref == 'evidence/import-lever-d8-003'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      RETENTION_WORKFLOW_RUN_ID: "30862050704"
      RETENTION_ARTIFACT_ID: "8874697978"
      RETENTION_ARTIFACT_DIGEST: "83c8f3787aa13f935af1d507d07fce3221f220c2c981f755095e5c18232ee387"

    steps:
      - name: Check out import branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Download official retained artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RETENTION_ARTIFACT_ID}"
          curl --retry 3 -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            > /tmp/d8-003-artifact-metadata.json
          curl --retry 3 -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/zip" \
            -o /tmp/d8-003-artifact.zip
          echo "${RETENTION_ARTIFACT_DIGEST}  /tmp/d8-003-artifact.zip" | sha256sum -c -

      - name: Finalize retained candidate and source receipt
        run: |
          python scripts/finalize_lever_phase_a_ready.py \
            --review-id D8-003 \
            --report evidence/lever-phase-a-artifacts/D8-003/lever-phase-a-report.json \
            --artifact-metadata /tmp/d8-003-artifact-metadata.json \
            --artifact-zip /tmp/d8-003-artifact.zip \
            --workflow-run-id "$RETENTION_WORKFLOW_RUN_ID" \
            --artifact-id "$RETENTION_ARTIFACT_ID" \
            --artifact-digest "$RETENTION_ARTIFACT_DIGEST" \
            --operator TheHighBrid

      - name: Import exactly one candidate and one source row
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          from app.services.lever_pilot_ingestion import load_phase_a_baseline

          baseline = Path('evidence/lever-phase-a-baseline.csv')
          candidate = Path('evidence/lever-phase-a-candidate-D8-003.csv')
          sources = Path('evidence/lever-phase-a-sources.csv')
          receipt = Path('evidence/lever-phase-a-source-D8-003.csv')

          def read_rows(path: Path):
              with path.open(encoding='utf-8', newline='') as handle:
                  reader = csv.DictReader(handle)
                  return list(reader.fieldnames or []), [dict(row) for row in reader]

          def append_one(target: Path, incoming: Path, unique_fields: tuple[str, ...]):
              target_fields, existing = read_rows(target)
              incoming_fields, rows = read_rows(incoming)
              assert target_fields == incoming_fields, (target_fields, incoming_fields)
              assert len(rows) == 1, len(rows)
              row = rows[0]
              for old in existing:
                  assert not all(old.get(key) == row.get(key) for key in unique_fields), (
                      'duplicate import', unique_fields, row
                  )
              with target.open('a', encoding='utf-8', newline='') as handle:
                  csv.DictWriter(handle, fieldnames=target_fields).writerow(row)
              return row

          candidate_row = append_one(
              baseline,
              candidate,
              ('run_id',),
          )
          source_row = append_one(
              sources,
              receipt,
              ('workflow_run_id', 'artifact_id'),
          )

          records = load_phase_a_baseline(baseline)
          imported = [
              record for record in records
              if record.get('run_id') == candidate_row['run_id']
          ]
          assert len(records) == 3, len(records)
          assert len(imported) == 1
          assert imported[0]['qualifies_for_dry_run_matrix'] is True
          assert imported[0]['final_submit_clicked'] is False
          assert candidate_row['source_reference'].endswith(
              '/' + source_row['workflow_run_id']
          )
          assert source_row == {
              'workflow_run_id': '30862050704',
              'artifact_id': '8874697978',
              'artifact_digest': '83c8f3787aa13f935af1d507d07fce3221f220c2c981f755095e5c18232ee387',
              'retained_record_count': '1',
          }
          print('Imported run:', candidate_row['run_id'])
          PY

      - name: Regenerate readiness and campaign checkpoints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from app.services.lever_pilot_ingestion import render_readiness_markdown
          from app.services.lever_pilot_ledger_boundary import read_lever_pilot_readiness

          readiness = read_lever_pilot_readiness(
              baseline_path=Path('evidence/lever-phase-a-baseline.csv'),
              ledger_path=Path('evidence/.missing-phase-b-runtime.jsonl'),
          )
          Path('evidence/lever-pilot-readiness.json').write_text(
              json.dumps(readiness, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('evidence/lever-pilot-readiness.md').write_text(
              render_readiness_markdown(readiness),
              encoding='utf-8',
          )
          summary = readiness['summary']
          assert readiness['baseline_record_count'] == 3
          assert summary['record_count'] == 3
          assert summary['qualifying_dry_run_count'] == 1
          assert summary['nonqualifying_dry_run_count'] == 2
          assert summary['manual_challenge_boundary_count'] == 2
          assert summary['canonical_maturity'] == 'dry_run'
          assert summary['promotion_ready'] is False
          assert summary['gates']['thirty_qualifying_dry_runs'] is False
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

          python scripts/evaluate_campaign_days_12_22.py \
            --lever evidence/lever-pilot-readiness.json \
            --output evidence/campaign-days-12-22.json

      - name: Certify regenerated evidence boundary
        run: |
          python scripts/certify_lever_pilot_readiness.py \
            --baseline evidence/lever-phase-a-baseline.csv \
            --ledger evidence/.missing-phase-b-runtime.jsonl \
            --json-output /tmp/lever-pilot-certification.json \
            --markdown-output /tmp/lever-pilot-certification.md

          pytest -q --tb=short -ra \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_readiness_hardening.py \
            tests/test_lever_pilot_certification.py

          git diff --check

      - name: Commit canonical import and remove one-shot workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f "$GITHUB_WORKSPACE/.github/workflows/import-d8-003-evidence.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Import retained Lever Phase A D8-003 evidence"
          git push origin "HEAD:${HEAD_BRANCH}"
