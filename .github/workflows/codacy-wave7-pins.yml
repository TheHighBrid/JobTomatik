name: Codacy Wave 7 npm exact pins

on:
  push:
    branches:
      - codex/codacy-wave7-npm-exact-pins
    paths:
      - .github/workflows/codacy-wave7-pins.yml

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/codacy-wave7-npm-exact-pins
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin manifest to current lockfile versions
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path("package.json")
          lock_path = Path("package-lock.json")
          package = json.loads(package_path.read_text())
          lock = json.loads(lock_path.read_text())
          packages = lock["packages"]

          changed = {}
          for section in ("dependencies", "devDependencies"):
              for name, old in list(package.get(section, {}).items()):
                  entry = packages.get(f"node_modules/{name}")
                  if not isinstance(entry, dict) or not entry.get("version"):
                      raise SystemExit(f"Missing resolved lockfile version for {section}:{name}")
                  version = str(entry["version"])
                  if old != version:
                      changed[f"{section}:{name}"] = {"from": old, "to": version}
                  package[section][name] = version

          package_path.write_text(json.dumps(package, indent=2) + "\n")
          print(json.dumps(changed, indent=2, sort_keys=True))
          PY

          npm install --package-lock-only --ignore-scripts

          python - <<'PY'
          import json, re
          from pathlib import Path
          package=json.loads(Path("package.json").read_text())
          lock=json.loads(Path("package-lock.json").read_text())
          root=lock["packages"][""]
          for section in ("dependencies","devDependencies"):
              for name,spec in package.get(section,{}).items():
                  if spec != root[section][name]:
                      raise SystemExit(f"root lock metadata mismatch: {section}:{name}")
                  resolved=lock["packages"][f"node_modules/{name}"]["version"]
                  if spec != resolved:
                      raise SystemExit(f"manifest differs from resolved version: {name}: {spec} != {resolved}")
                  if re.search(r"^[~^*]|[<>=| ]", spec):
                      raise SystemExit(f"non-exact top-level version remains: {name}={spec}")
          PY

          cp package-lock.json /tmp/package-lock.before-audit-fix.json
          npm audit fix --package-lock-only --ignore-scripts

          python - <<'PY'
          import json
          from pathlib import Path

          before=json.loads(Path("/tmp/package-lock.before-audit-fix.json").read_text())
          after=json.loads(Path("package-lock.json").read_text())
          before_packages=before["packages"]
          after_packages=after["packages"]
          changed_versions=[]
          for path in sorted(set(before_packages) | set(after_packages)):
              old=(before_packages.get(path) or {}).get("version")
              new=(after_packages.get(path) or {}).get("version")
              if old != new:
                  changed_versions.append((path, old, new))
                  if not (path == "node_modules/brace-expansion" or path.endswith("/node_modules/brace-expansion")):
                      raise SystemExit(
                          f"npm audit fix attempted unrelated package version change: {path}: {old} -> {new}"
                      )
          if not changed_versions:
              raise SystemExit("npm audit fix did not patch the vulnerable brace-expansion tree")
          print("AUDIT_VERSION_CHANGES", changed_versions)
          PY

          npm ci
          npm test
          npm run build
          npm audit --audit-level=high
          git diff --check

      - name: Commit validated exact pins
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/codacy-wave7-pins.yml
          git diff --check
          git config user.name "TheHighBrid"
          git config user.email "120822557+TheHighBrid@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json .github/workflows/codacy-wave7-pins.yml
          git commit -m "fix: pin frontend dependencies to locked versions"
          git push origin HEAD:codex/codacy-wave7-npm-exact-pins
