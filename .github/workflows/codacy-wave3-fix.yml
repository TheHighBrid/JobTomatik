name: Codacy wave 3 remediation

on:
  push:
    branches:
      - codex/codacy-wave3-staging
    paths:
      - .github/workflows/codacy-wave3-fix.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/codacy-wave3-staging
          fetch-depth: 0

      - name: Apply exact Security Error remediations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          HARD_TOKEN = "Semgrep_codacy.yaml.security.hard-coded-tokens"
          SUBPROCESS_AUDIT = "Semgrep_python.lang.security.audit.dangerous-subprocess-use-audit.dangerous-subprocess-use-audit"
          SUBPROCESS_TAINT = "Semgrep_python.lang.security.audit.dangerous-subprocess-use-tainted-env-args.dangerous-subprocess-use-tainted-env-args"
          SQL_FORMATTED = "Semgrep_python.lang.security.audit.formatted-sql-query.formatted-sql-query"
          SQL_RAW = "Semgrep_python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query"
          SQL_EXPR = "Semgrep_python_sql_rule-hardcoded-sql-expression"
          SSRF = "Semgrep_rules_lgpl_javascript_ssrf_rule-node-ssrf"
          MD5 = "Semgrep_python_crypto_rule-hash-md5"

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), found {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          # Prospector/dodgy: this is intentionally an invalid development placeholder.
          # Settings.validate_runtime_security already rejects it for sensitive runtime modes.
          replace_exact(
              "backend/app/config.py",
              'DEFAULT_SECRET_KEY = "supersecretkey-change-in-production"\n',
              '# Deliberately invalid development placeholder; sensitive modes reject it.\n'
              'DEFAULT_SECRET_KEY = "supersecretkey-change-in-production"  # noqa\n',
          )

          # Opengrep hard-coded-token rule false positives: these are type/schema names or
          # runtime-supplied/generated values, never credential literals.
          replacements = {
              "backend/app/schemas/application.py": [
                  (
                      "    resume_token: Optional[str]\n",
                      f"    resume_token: Optional[str]  # nosemgrep: {HARD_TOKEN}\n",
                  ),
              ],
              "backend/app/schemas/handoff.py": [
                  (
                      "    resume_token: str\n",
                      f"    resume_token: str  # nosemgrep: {HARD_TOKEN}\n",
                  ),
                  (
                      "    lease_token: str\n",
                      f"    lease_token: str  # nosemgrep: {HARD_TOKEN}\n",
                  ),
              ],
              "backend/app/schemas/user.py": [
                  (
                      "    access_token: str\n",
                      f"    access_token: str  # nosemgrep: {HARD_TOKEN}\n",
                  ),
              ],
              "backend/app/services/ats_greenhouse.py": [
                  (
                      "    board_token: str,\n",
                      f"    board_token: str,  # nosemgrep: {HARD_TOKEN}\n",
                  ),
              ],
              "backend/app/services/ats_smartrecruiters.py": [
                  (
                      "    smart_token: str,\n",
                      f"    smart_token: str,  # nosemgrep: {HARD_TOKEN}\n",
                  ),
              ],
              "backend/app/services/handoff_session.py": [
                  (
                      "    resume_token: str\n",
                      f"    resume_token: str  # nosemgrep: {HARD_TOKEN}\n",
                  ),
                  (
                      "    lease_token: str\n",
                      f"    lease_token: str  # nosemgrep: {HARD_TOKEN}\n",
                  ),
                  (
                      "    resume_token: str,\n",
                      f"    resume_token: str,  # nosemgrep: {HARD_TOKEN}\n",
                  ),
                  (
                      "    user_id: int,\n"
                      "    lease_token: str,\n"
                      "    allowed_statuses: tuple[str, ...] = (HandoffSessionStatus.claimed.value,),\n",
                      "    user_id: int,\n"
                      f"    lease_token: str,  # nosemgrep: {HARD_TOKEN}\n"
                      "    allowed_statuses: tuple[str, ...] = (HandoffSessionStatus.claimed.value,),\n",
                  ),
              ],
              "backend/app/services/lever_phase_a_provenance.py": [
                  (
                      "def fetch_verified_retention_artifact(\n"
                      "    *,\n"
                      "    github_token: str,\n",
                      "def fetch_verified_retention_artifact(\n"
                      "    *,\n"
                      f"    github_token: str,  # nosemgrep: {HARD_TOKEN}\n",
                  ),
              ],
              "backend/app/services/supervised_runtime_mode.py": [
                  (
                      "def create_owner_bound_marker(\n"
                      "    owner_pid: int,\n"
                      "    *,\n"
                      "    launch_token: str,\n",
                      "def create_owner_bound_marker(\n"
                      "    owner_pid: int,\n"
                      "    *,\n"
                      f"    launch_token: str,  # nosemgrep: {HARD_TOKEN}\n",
                  ),
              ],
              "backend/scripts/lever_supervised_pilot_runtime.py": [
                  (
                      "def create_marker(\n"
                      "    owner_pid: int,\n"
                      "    launch_token: str,\n",
                      "def create_marker(\n"
                      "    owner_pid: int,\n"
                      f"    launch_token: str,  # nosemgrep: {HARD_TOKEN}\n",
                  ),
              ],
          }
          for path, pairs in replacements.items():
              for old, new in pairs:
                  replace_exact(path, old, new)

          # Genuine XXE risk: parse retained JUnit with defusedxml.
          replace_exact(
              "backend/app/services/ashby_readiness.py",
              "import xml.etree.ElementTree as ET\n",
              "from defusedxml import ElementTree as ET\n",
          )
          requirements = Path("backend/requirements.txt")
          req_text = requirements.read_text(encoding="utf-8")
          if "defusedxml==" not in req_text:
              marker = "lxml==6.1.2\n"
              if req_text.count(marker) != 1:
                  raise SystemExit("backend/requirements.txt: lxml insertion point changed")
              req_text = req_text.replace(marker, marker + "defusedxml==0.7.1\n", 1)
              requirements.write_text(req_text, encoding="utf-8")
          elif "defusedxml==0.7.1" not in req_text:
              raise SystemExit("backend/requirements.txt: unexpected defusedxml version already pinned")

          # MD5 is a compatibility identifier, not a security digest. Preserve stable IDs and
          # tell hashlib/FIPS-aware runtimes the operation is explicitly non-security.
          replace_exact(
              "backend/app/services/job_scraper.py",
              "    return hashlib.md5(raw.encode()).hexdigest()[:16]\n",
              f"    return hashlib.md5(raw.encode(), usedforsecurity=False).hexdigest()[:16]  # nosemgrep: {MD5}\n",
          )

          # Shell-free argv and operator-controlled executable path. No shell interpolation.
          replace_exact(
              "backend/app/services/browser_runtime_base.py",
              "    process = subprocess.Popen(\n",
              f"    process = subprocess.Popen(  # nosemgrep: {SUBPROCESS_AUDIT}, {SUBPROCESS_TAINT}\n",
          )

          # SQLite identifiers are discovered from sqlite_master and quoted before interpolation.
          replace_exact(
              "backend/app/services/day41_database_restore.py",
              "        result[name] = int(connection.execute(f'SELECT COUNT(*) FROM \"{escaped}\"').fetchone()[0])\n",
              "        result[name] = int(\n"
              f"            connection.execute(  # nosemgrep: {SQL_FORMATTED}, {SQL_RAW}, {SQL_EXPR}\n"
              "                f'SELECT COUNT(*) FROM \"{escaped}\"'\n"
              "            ).fetchone()[0]\n"
              "        )\n",
          )

          # Protected table names come from a repository constant, never request/user input.
          replace_exact(
              "backend/scripts/repair_final_submit_review.py",
              '        require(db.execute(f"SELECT COUNT(*) FROM {table} WHERE application_id=?", (app_id,)).fetchone()[0] == 0,\n',
              f'        require(db.execute(  # nosemgrep: {SQL_RAW}, {SQL_EXPR}\n'
              '            f"SELECT COUNT(*) FROM {table} WHERE application_id=?", (app_id,)\n'
              '        ).fetchone()[0] == 0,\n',
          )

          # Compatibility probes execute an exact Python executable via shell=False list argv.
          replace_exact(
              "backend/scripts/run_day41_previous_release_compatibility.py",
              "    completed = subprocess.run(\n",
              f"    completed = subprocess.run(  # nosemgrep: {SUBPROCESS_AUDIT}, {SUBPROCESS_TAINT}\n",
          )
          replace_exact(
              "backend/scripts/run_day41_previous_release_compatibility.py",
              "            for row in connection.execute(f'PRAGMA table_info(\"{escaped}\")').fetchall()\n",
              f"            for row in connection.execute(  # nosemgrep: {SQL_FORMATTED}, {SQL_RAW}\n"
              "                f'PRAGMA table_info(\"{escaped}\")'\n"
              "            ).fetchall()\n",
          )

          # Browser-side operator URL is normalized first: only HTTP(S), no embedded credentials,
          # no query/fragment, and non-local HTTP is rejected. This is not a server-side SSRF sink.
          replace_exact(
              "frontend/src/api/client.js",
              "  const response = await axios.get(`${normalized}/health`, { timeout: 8000 })\n",
              f"  const response = await axios.get(`" + "${normalized}" + f"/health`, {{ timeout: 8000 }}) // nosemgrep: {SSRF}\n",
          )
          replace_exact(
              "frontend/src/api/client.js",
              "const api = axios.create({\n",
              f"const api = axios.create({{ // nosemgrep: {SSRF}\n",
          )
          PY

          python -m py_compile             backend/app/config.py             backend/app/schemas/application.py             backend/app/schemas/handoff.py             backend/app/schemas/user.py             backend/app/services/ashby_readiness.py             backend/app/services/ats_greenhouse.py             backend/app/services/ats_smartrecruiters.py             backend/app/services/browser_runtime_base.py             backend/app/services/day41_database_restore.py             backend/app/services/handoff_session.py             backend/app/services/job_scraper.py             backend/app/services/lever_phase_a_provenance.py             backend/app/services/supervised_runtime_mode.py             backend/scripts/lever_supervised_pilot_runtime.py             backend/scripts/repair_final_submit_review.py             backend/scripts/run_day41_previous_release_compatibility.py
          node --check frontend/src/api/client.js
          git diff --check

      - name: Validate targeted behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q defusedxml==0.7.1
          PYTHONPATH=backend python - <<'PY'
          from pathlib import Path
          from defusedxml.common import EntitiesForbidden
          from app.services.ashby_readiness import _junit_summary

          valid = Path("/tmp/jobtomatik-valid-junit.xml")
          valid.write_text(
              '<testsuite tests="1" failures="0" errors="0" skipped="0">'
              '<testcase name="ok"/></testsuite>',
              encoding="utf-8",
          )
          summary = _junit_summary(valid)
          if summary != {
              "tests": 1,
              "failures": 0,
              "errors": 0,
              "skipped": 0,
              "passed": True,
          }:
              raise SystemExit(f"unexpected JUnit summary: {summary!r}")

          malicious = Path("/tmp/jobtomatik-xxe.xml")
          malicious.write_text(
              '<!DOCTYPE x [<!ENTITY xxe SYSTEM "file:///etc/passwd">]>'
              '<testsuite tests="1"><testcase name="x">&xxe;</testcase></testsuite>',
              encoding="utf-8",
          )
          try:
              _junit_summary(malicious)
          except EntitiesForbidden:
              pass
          else:
              raise SystemExit("defusedxml regression: external entity payload was not rejected")
          PY

      - name: Commit clean wave and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f             .github/workflows/codacy-wave3-probe.yml             .github/workflows/codacy-wave3-fix.yml
          git diff --check
          git config user.name "TheHighBrid"
          git config user.email "120822557+TheHighBrid@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve Codacy Security Error findings wave 3"
          git push origin HEAD:codex/codacy-wave3-staging
