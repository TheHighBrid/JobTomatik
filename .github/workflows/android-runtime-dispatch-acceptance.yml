name: Android runtime dispatch acceptance

on:
  pull_request:
    paths:
      - "backend/app/celery_app.py"
      - "backend/app/config.py"
      - "backend/app/tasks/runtime.py"
      - "backend/app/tasks/shadow_runs.py"
      - "backend/app/services/application_recovery.py"
      - "backend/app/services/operations_settings.py"
      - "backend/app/services/runtime_identity.py"
      - "backend/scripts/check_runtime_identity.py"
      - "backend/scripts/jobtomatik_termux_wrapper.sh"
      - "backend/scripts/manage_android_stack.sh"
      - "backend/scripts/prepare_android_runtime.py"
      - "backend/scripts/retire_legacy_android_celery.py"
      - "backend/scripts/refresh_android_jobtomatik_tabs.py"
      - "scripts/jobtomatik-runtime.sh"
      - "frontend/src/api/client.js"
      - "frontend/src/applicationTaskRuntime.js"
      - "frontend/src/pages/ApplicationDetail.jsx"
      - "backend/tests/test_application_recovery.py"
      - "backend/tests/test_android_runtime_canary.py"
      - "backend/tests/test_android_runtime_scripts.py"
      - "backend/tests/test_android_runtime_supervisor_regressions.py"
      - "backend/tests/test_android_task_runtime_liveness.py"
      - "backend/tests/test_operations_policy.py"
      - "backend/tests/test_prepare_android_runtime.py"
      - "backend/tests/test_runtime_configuration_contract.py"
      - "backend/tests/test_runtime_identity.py"
      - ".github/workflows/android-runtime-dispatch-acceptance.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/celery_app.py"
      - "backend/app/config.py"
      - "backend/app/tasks/runtime.py"
      - "backend/app/tasks/shadow_runs.py"
      - "backend/app/services/application_recovery.py"
      - "backend/app/services/operations_settings.py"
      - "backend/app/services/runtime_identity.py"
      - "backend/scripts/check_runtime_identity.py"
      - "backend/scripts/jobtomatik_termux_wrapper.sh"
      - "backend/scripts/manage_android_stack.sh"
      - "backend/scripts/prepare_android_runtime.py"
      - "backend/scripts/retire_legacy_android_celery.py"
      - "backend/scripts/refresh_android_jobtomatik_tabs.py"
      - "scripts/jobtomatik-runtime.sh"
      - "frontend/src/api/client.js"
      - "frontend/src/applicationTaskRuntime.js"
      - "frontend/src/pages/ApplicationDetail.jsx"
      - "backend/tests/test_application_recovery.py"
      - "backend/tests/test_android_runtime_canary.py"
      - "backend/tests/test_android_runtime_scripts.py"
      - "backend/tests/test_android_runtime_supervisor_regressions.py"
      - "backend/tests/test_android_task_runtime_liveness.py"
      - "backend/tests/test_operations_policy.py"
      - "backend/tests/test_prepare_android_runtime.py"
      - "backend/tests/test_runtime_configuration_contract.py"
      - "backend/tests/test_runtime_identity.py"
      - ".github/workflows/android-runtime-dispatch-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-dispatch-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: sqlite:///./android-runtime-dispatch.db
  REDIS_URL: redis://localhost:6379/1
  SECRET_KEY: android-runtime-dispatch-acceptance-secret-2026
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  AUTOPILOT_ENABLED: "false"
  AUTOMATION_GLOBAL_KILL_SWITCH: "false"
  ENABLE_RESUMABLE_HANDOFFS: "false"
  JOBTOMATIK_EXPECTED_REVISION: ${{ github.sha }}
  JOBTOMATIK_RUNTIME_ROLE: worker

jobs:
  applications-queue-round-trip:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Record checked-out runtime revision
        run: |
          revision="$(git -C .. rev-parse HEAD)"
          echo "JOBTOMATIK_RUNTIME_REVISION=$revision" >> "$GITHUB_ENV"
          echo "JOBTOMATIK_RUNTIME_REVISION_SHORT=${revision:0:12}" >> "$GITHUB_ENV"

      - name: Prove Android worker revision is deployment-attested
        run: python scripts/check_runtime_identity.py --require-attested

      - name: Prove managed DB1 cleanup retires leaked default worker
        run: |
          celery -A app.celery_app worker \
            --hostname="celery@%h" \
            --loglevel=info \
            --pool=solo \
            --concurrency=1 \
            --without-gossip \
            --without-mingle \
            -Q celery \
            > android-runtime-leaked-celery.log 2>&1 &
          rogue_pid=$!
          echo "$rogue_pid" > android-runtime-leaked-celery.pid

          python - <<'PY'
          import time
          from app.celery_app import celery_app

          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              pings = celery_app.control.inspect(timeout=1.0).ping() or {}
              leaked = [name for name in pings if str(name).lower().startswith("celery@")]
              if leaked:
                  print(f"ANDROID_LEAKED_DB1_WORKER_OBSERVED names={sorted(leaked)}")
                  raise SystemExit(0)
              time.sleep(0.5)
          raise SystemExit("Default Celery worker did not become visible on managed DB1")
          PY

          cleanup_output="$(python scripts/retire_legacy_android_celery.py \
            --broker redis://localhost:6379/1 \
            --mode managed \
            --timeout 2.0)"
          printf '%s\n' "$cleanup_output"
          grep -q 'ANDROID_STALE_MANAGED_CELERY_RETIRE_REQUESTED' <<<"$cleanup_output"
          grep -q 'Managed-broker worker: celery@' <<<"$cleanup_output"

          python - <<'PY'
          import time
          from app.celery_app import celery_app

          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              pings = celery_app.control.inspect(timeout=1.0).ping() or {}
              leaked = [name for name in pings if str(name).lower().startswith("celery@")]
              if not leaked:
                  print("ANDROID_LEAKED_DB1_WORKER_RETIRED")
                  raise SystemExit(0)
              time.sleep(0.5)
          raise SystemExit(f"Default Celery worker still visible on managed DB1: {sorted(leaked)}")
          PY

          if kill -0 "$rogue_pid" 2>/dev/null; then
            kill -TERM "$rogue_pid" 2>/dev/null || true
            wait "$rogue_pid" || true
          fi

      - name: Start revisioned Android worker on Redis DB1
        run: |
          celery -A app.celery_app worker \
            --hostname="jobtomatik-android-${JOBTOMATIK_RUNTIME_REVISION_SHORT}@%h" \
            --loglevel=info \
            --pool=solo \
            --concurrency=1 \
            --without-gossip \
            --without-mingle \
            -Q applications,celery,followup,scraping \
            > android-runtime-celery.log 2>&1 &
          echo $! > android-runtime-celery.pid

          python - <<'PY'
          import os
          import time
          from app.celery_app import celery_app

          prefix = f"jobtomatik-android-{os.environ['JOBTOMATIK_RUNTIME_REVISION_SHORT']}@"
          required = {"applications", "celery", "followup", "scraping"}
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              inspector = celery_app.control.inspect(timeout=1.5)
              pings = inspector.ping() or {}
              queues = inspector.active_queues() or {}
              for node, pong in pings.items():
                  names = {str(item.get("name") or "") for item in queues.get(node, [])}
                  if node.startswith(prefix) and pong.get("ok") == "pong" and required.issubset(names):
                      print(f"ANDROID_WORKER_CONTROL_READY node={node}")
                      raise SystemExit(0)
              time.sleep(0.5)
          raise SystemExit("Revisioned Android worker did not become control-ready")
          PY

      - name: Prove producer to applications queue to worker to DB1 result round trip
        run: |
          python - <<'PY'
          import os
          from app.tasks.runtime import application_queue_canary

          expected = os.environ["JOBTOMATIK_RUNTIME_REVISION"]
          result = application_queue_canary.apply_async(
              kwargs={"expected_revision": expected},
              queue="applications",
          )
          payload = result.get(timeout=15, propagate=True)
          print(payload)
          assert payload["ok"] is True
          assert payload["revision"] == expected
          assert payload["expected_revision"] == expected
          assert payload["redis_db"] == 1
          assert isinstance(payload["worker_pid"], int)
          assert payload["runtime_expected_revision"] == expected
          assert payload["runtime_role"] == "worker"
          assert payload["deployment_attested"] is True
          assert isinstance(payload["runtime_identity_sha256"], str)
          assert len(payload["runtime_identity_sha256"]) == 64
          print("ANDROID_APPLICATION_QUEUE_ROUND_TRIP_READY")
          PY

      - name: Prove Android-managed Beat avoids dbm and boots with shadow recovery
        env:
          JOBTOMATIK_RUNTIME_ROLE: beat
          JOBTOMATIK_RUNTIME_MODE: android_managed
        run: |
          python scripts/check_runtime_identity.py --require-attested
          python - <<'PY'
          from app.celery_app import celery_app

          assert celery_app.conf.beat_scheduler == "celery.beat:Scheduler"
          entry = dict(celery_app.conf.beat_schedule or {}).get("recover-stalled-shadow-campaigns")
          assert isinstance(entry, dict)
          assert entry["task"] == "app.tasks.shadow_runs.recover_stalled_shadow_sessions"
          assert set(entry["schedule"].minute) == {11, 26, 41, 56}
          print("ANDROID_SHADOW_RECOVERY_SCHEDULE_READY")
          print("ANDROID_BEAT_SCHEDULER_NONPERSISTENT_READY")
          PY

          rm -f android-runtime-celerybeat-schedule*
          REDIS_URL=redis://localhost:6379/15 \
          JOBTOMATIK_RUNTIME_MODE=android_managed \
          celery -A app.celery_app beat \
            --loglevel=info \
            --schedule=android-runtime-celerybeat-schedule \
            > android-runtime-celery-beat.log 2>&1 &
          beat_pid=$!
          sleep 3
          kill -0 "$beat_pid"

          cat android-runtime-celery-beat.log
          if grep -Eiq 'PersistentScheduler|_dbm|cannot add item to database' android-runtime-celery-beat.log; then
            echo "Android-managed Beat used or failed through dbm-backed persistence." >&2
            kill -TERM "$beat_pid" 2>/dev/null || true
            wait "$beat_pid" || true
            exit 1
          fi
          if compgen -G 'android-runtime-celerybeat-schedule*' >/dev/null; then
            echo "Android-managed Beat unexpectedly created a persistent schedule database." >&2
            ls -la android-runtime-celerybeat-schedule* >&2 || true
            kill -TERM "$beat_pid" 2>/dev/null || true
            wait "$beat_pid" || true
            exit 1
          fi

          kill -TERM "$beat_pid"
          wait "$beat_pid" || true
          echo "ANDROID_CELERY_BEAT_BOOT_READY"

      - name: Run Android runtime regression contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_application_recovery.py \
            tests/test_android_runtime_canary.py \
            tests/test_android_runtime_scripts.py \
            tests/test_android_runtime_supervisor_regressions.py \
            tests/test_android_task_runtime_liveness.py \
            tests/test_refresh_android_jobtomatik_tabs.py \
            tests/test_retire_legacy_android_celery.py \
            tests/test_operations_policy.py \
            tests/test_prepare_android_runtime.py \
            tests/test_runtime_configuration_contract.py \
            tests/test_runtime_identity.py

      - name: Upload managed runtime logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-runtime-dispatch-worker-log
          path: |
            backend/android-runtime-leaked-celery.log
            backend/android-runtime-celery.log
            backend/android-runtime-celery-beat.log
          if-no-files-found: error
          retention-days: 14
