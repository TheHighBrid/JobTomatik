name: Codacy production cleanup wave

on:
  push:
    branches:
      - codex/codacy-quality-baseline
    paths:
      - .github/workflows/codacy-fix-wave.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/codacy-quality-baseline
          fetch-depth: 0

      - name: Make static dependencies explicit and remove verified F401 imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "backend/scripts/android_runtime_acceptance.py",
              "from scripts import android_runtime_acceptance_base as _base  # noqa: E402\n\nfor _name in dir(_base):",
              "from scripts import android_runtime_acceptance_base as _base  # noqa: E402\n\n# Explicit aliases keep the facade's runtime seam visible to static analyzers.\nget_settings = _base.get_settings\ncurrent_revision = _base.current_revision\nruntime_acceptance_path = _base.runtime_acceptance_path\nwrite_receipt = _base.write_receipt\n\nfor _name in dir(_base):",
          )
          replace_once(
              "backend/scripts/run_shadow_qualification_canary.py",
              "from scripts import run_shadow_qualification_canary_base as _base  # noqa: E402\n\nfor _name in dir(_base):",
              "from scripts import run_shadow_qualification_canary_base as _base  # noqa: E402\n\n# Explicit aliases preserve the facade contract while making dynamic base seams\n# visible to static analyzers and type-aware review.\nApplicationAutomationState = _base.ApplicationAutomationState\nApplicationEvent = _base.ApplicationEvent\nBROWSER_ACTIONS = _base.BROWSER_ACTIONS\nManualReviewTask = _base.ManualReviewTask\nShadowRunSession = _base.ShadowRunSession\n\nfor _name in dir(_base):",
          )
          PY

          python -m pip install --disable-pip-version-check --quiet ruff
          ruff check --select F401 --fix \
            backend/app/api/applications.py \
            backend/app/api/certification.py \
            backend/app/services/ats_base.py \
            backend/app/services/day33_recovery_chaos.py \
            backend/app/services/day36_shadow_endurance.py \
            backend/app/services/day41_database_restore.py \
            backend/app/services/lever_certification.py \
            backend/app/services/operational_observability.py \
            backend/app/services/retained_browser_operator.py \
            backend/app/services/submission_integrity.py

          git diff --check
          git diff -- \
            backend/app/api/applications.py \
            backend/app/api/certification.py \
            backend/app/services/ats_base.py \
            backend/app/services/day33_recovery_chaos.py \
            backend/app/services/day36_shadow_endurance.py \
            backend/app/services/day41_database_restore.py \
            backend/app/services/lever_certification.py \
            backend/app/services/operational_observability.py \
            backend/app/services/retained_browser_operator.py \
            backend/app/services/submission_integrity.py \
            backend/scripts/android_runtime_acceptance.py \
            backend/scripts/run_shadow_qualification_canary.py

      - name: Commit exact cleanup wave
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHighBrid"
          git config user.email "120822557+TheHighBrid@users.noreply.github.com"
          git add \
            backend/app/api/applications.py \
            backend/app/api/certification.py \
            backend/app/services/ats_base.py \
            backend/app/services/day33_recovery_chaos.py \
            backend/app/services/day36_shadow_endurance.py \
            backend/app/services/day41_database_restore.py \
            backend/app/services/lever_certification.py \
            backend/app/services/operational_observability.py \
            backend/app/services/retained_browser_operator.py \
            backend/app/services/submission_integrity.py \
            backend/scripts/android_runtime_acceptance.py \
            backend/scripts/run_shadow_qualification_canary.py
          git commit -m "fix: clear first Codacy production error-prone wave"
          git push origin HEAD:codex/codacy-quality-baseline
