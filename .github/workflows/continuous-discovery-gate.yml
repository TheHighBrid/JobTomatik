name: Continuous discovery gate

on:
  pull_request:
    paths:
      - "backend/app/celery_app.py"
      - "backend/app/tasks/discovery.py"
      - "backend/app/services/discovery_scheduler.py"
      - "backend/app/services/discovery_freshness_integration.py"
      - "backend/app/services/discovery_dedup.py"
      - "backend/app/services/job_identity.py"
      - "backend/scripts/build_continuous_discovery_gate.py"
      - "backend/tests/test_continuous_discovery.py"
      - "backend/tests/test_discovery_stable_dedup.py"
      - "backend/tests/test_scheduler_policy.py"
      - ".github/workflows/continuous-discovery-gate.yml"
      - "backend/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: sqlite:///./continuous-discovery-gate.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: continuous-discovery-ci-only-secret-key-000000000000
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  ALLOW_REAL_FOLLOWUP_SEND: "false"
  AUTOPILOT_ENABLED: "false"
  AUTOMATION_GLOBAL_KILL_SWITCH: "false"
  ENABLE_RESUMABLE_HANDOFFS: "false"
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  day29-continuous-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r backend/requirements.txt

      - name: Run continuous discovery regression matrix
        working-directory: backend
        run: |
          pytest -q --tb=short -ra \
            tests/test_continuous_discovery.py \
            tests/test_discovery_stable_dedup.py \
            tests/test_scheduler_policy.py \
            --junitxml=continuous-discovery-junit.xml

      - name: Verify canonical safety
        run: bash scripts/verify.sh safety

      - name: Export exact-head Day 29 evidence
        working-directory: backend
        run: |
          PYTHONPATH=. python scripts/build_continuous_discovery_gate.py \
            --verification-commit "$SOURCE_COMMIT" \
            --output continuous-discovery-gate.json

      - name: Assert discovery is independent from application autopilot
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          import os

          gate = json.load(open('continuous-discovery-gate.json', encoding='utf-8'))
          assert gate['verification_commit'] == os.environ['SOURCE_COMMIT']
          assert gate['gate_passed'] is True
          assert gate['scheduler']['autopilot_required_for_discovery'] is False
          assert gate['scheduler']['global_kill_switch_preserved'] is True
          assert gate['source_backoff']['max_seconds'] == 21600
          assert gate['freshness']['ttl_hours'] == 72
          assert gate['freshness']['stale_discovered_candidates_fail_closed'] is True
          assert gate['dedup']['proof_based_cross_source_employer_apply_url'] is True
          assert gate['dedup']['fuzzy_title_only_matching'] is False
          assert gate['runtime']['autopilot_enabled'] is False
          assert gate['runtime']['real_submission_enabled'] is False
          PY

      - name: Upload Day 29 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: continuous-discovery-gate
          path: |
            backend/continuous-discovery-gate.json
            backend/continuous-discovery-junit.xml
          if-no-files-found: error
          retention-days: 30
