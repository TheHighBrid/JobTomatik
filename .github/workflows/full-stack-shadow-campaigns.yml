      - "backend/app/config.py"
      - "backend/app/models/certification.py"
      - "backend/app/models/__init__.py"
      - "backend/app/schemas/shadow_runs.py"
      - "backend/app/services/discovery_search.py"
      - "backend/app/services/full_stack_shadow.py"
      - "backend/app/services/operations_policy.py"
      - "backend/app/services/operations_settings.py"
      - "backend/app/services/runtime_acceptance.py"
      - "backend/app/services/runtime_identity.py"
      - "backend/app/services/scheduler_policy.py"
      - "backend/app/services/shadow_qualification.py"
      - "backend/app/services/unattended_policy.py"
      - "backend/app/tasks/shadow_runs.py"
      - "backend/app/tasks/scraping.py"
      - "backend/app/tasks/unattended.py"
      - "backend/app/celery_app.py"
      - "backend/app/main.py"
      - "backend/scripts/check_runtime_identity.py"
      - "backend/scripts/jobtomatik_termux_wrapper.sh"
      - "backend/scripts/run_shadow_qualification_canary.py"
      - "backend/tests/test_android_authenticated_qualification.py"
      - "backend/tests/test_android_qualification_runtime_context.py"
      - "backend/tests/test_android_shadow_launch_admission.py"
      - "backend/tests/test_android_shadow_preflight_truth.py"
      - "backend/tests/test_discovery_search.py"
      - "backend/tests/test_full_stack_shadow.py"
      - "backend/tests/test_full_stack_shadow_recovery.py"
      - "backend/tests/test_operations_policy.py"
      - "backend/tests/test_runtime_identity.py"
      - "backend/tests/test_runtime_identity_shadow_gate.py"
      - "backend/tests/test_scheduler_policy.py"
      - "backend/tests/test_shadow_qualification_contract.py"
      - "backend/tests/test_shadow_worker_exception.py"
      - "backend/tests/test_shadow_worker_cap_exclusion.py"
      - "docker-compose.yml"
      - "frontend/src/api/shadowCampaigns.js"
      - "frontend/src/pages/ShadowCampaignCenter.jsx"
      - "frontend/src/App.jsx"
      - "frontend/src/components/Layout.jsx"
      - "frontend/test/shadow-campaign-center.test.js"
      - "docs/PHASE11_FULL_STACK_SHADOW_CAMPAIGNS.md"
      - ".github/workflows/full-stack-shadow-campaigns.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/api/shadow_runs.py"
      - "backend/app/config.py"
      - "backend/app/models/certification.py"
      - "backend/app/models/__init__.py"
      - "backend/app/schemas/shadow_runs.py"
      - "backend/app/services/discovery_search.py"
      - "backend/app/services/full_stack_shadow.py"
      - "backend/app/services/operations_policy.py"
      - "backend/app/services/operations_settings.py"
      - "backend/app/services/runtime_acceptance.py"
      - "backend/app/services/runtime_identity.py"
      - "backend/app/services/scheduler_policy.py"
      - "backend/app/services/shadow_qualification.py"
      - "backend/app/services/unattended_policy.py"
      - "backend/app/tasks/shadow_runs.py"
      - "backend/app/tasks/scraping.py"
      - "backend/app/tasks/unattended.py"
      - "backend/app/celery_app.py"
      - "backend/app/main.py"
      - "backend/scripts/check_runtime_identity.py"
      - "backend/scripts/jobtomatik_termux_wrapper.sh"
      - "backend/scripts/run_shadow_qualification_canary.py"
      - "backend/tests/test_android_authenticated_qualification.py"
      - "backend/tests/test_android_qualification_runtime_context.py"
      - "backend/tests/test_android_shadow_launch_admission.py"
      - "backend/tests/test_android_shadow_preflight_truth.py"
      - "backend/tests/test_discovery_search.py"
      - "backend/tests/test_full_stack_shadow.py"
      - "backend/tests/test_full_stack_shadow_recovery.py"
      - "backend/tests/test_operations_policy.py"
      - "backend/tests/test_runtime_identity.py"
      - "backend/tests/test_runtime_identity_shadow_gate.py"
      - "backend/tests/test_scheduler_policy.py"
      - "backend/tests/test_shadow_qualification_contract.py"
      - "backend/tests/test_shadow_worker_exception.py"
      - "backend/tests/test_shadow_worker_cap_exclusion.py"
      - "docker-compose.yml"
      - "frontend/src/api/shadowCampaigns.js"
      - "frontend/src/pages/ShadowCampaignCenter.jsx"
      - "frontend/src/App.jsx"
      - "frontend/src/components/Layout.jsx"
      - "frontend/test/shadow-campaign-center.test.js"
      - "docs/PHASE11_FULL_STACK_SHADOW_CAMPAIGNS.md"
      - ".github/workflows/full-stack-shadow-campaigns.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-stack-shadow-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: sqlite:///./full-stack-shadow.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: phase11-full-stack-shadow-secret-key-2026
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  ALLOW_REAL_FOLLOWUP_SEND: "false"
  AUTOPILOT_ENABLED: "true"
  AUTOMATION_GLOBAL_KILL_SWITCH: "false"
  JOBTOMATIK_RUNTIME_REVISION: ${{ github.sha }}
  JOBTOMATIK_EXPECTED_REVISION: ${{ github.sha }}
  JOBTOMATIK_RUNTIME_ROLE: ci

jobs:
  phase11-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Compile Phase 11 backend surfaces
        working-directory: backend
        run: |
          bash -n scripts/jobtomatik_termux_wrapper.sh
          python -m compileall -q \
            app/api/shadow_runs.py \
            app/config.py \
            app/models/certification.py \
            app/services/discovery_search.py \
            app/services/full_stack_shadow.py \
            app/services/operations_policy.py \
            app/services/operations_settings.py \
            app/services/runtime_acceptance.py \
            app/services/runtime_identity.py \
            app/services/scheduler_policy.py \
            app/services/shadow_qualification.py \
            app/services/unattended_policy.py \
            app/tasks/shadow_runs.py \
            app/tasks/scraping.py \
            app/tasks/unattended.py \
            scripts/check_runtime_identity.py \
            scripts/run_shadow_qualification_canary.py \
            tests/test_android_authenticated_qualification.py \
            tests/test_android_qualification_runtime_context.py \
            tests/test_android_shadow_launch_admission.py \
            tests/test_android_shadow_preflight_truth.py \
            tests/test_discovery_search.py \
            tests/test_operations_policy.py \
            tests/test_runtime_identity_shadow_gate.py \
            tests/test_scheduler_policy.py \
            tests/test_shadow_qualification_contract.py \
            tests/test_shadow_worker_exception.py \
            tests/test_shadow_worker_cap_exclusion.py

      - name: Run Phase 11 backend safety matrix
        working-directory: backend
        run: |
          python -m pytest -q --tb=short -ra \
            tests/test_android_authenticated_qualification.py \
            tests/test_android_qualification_runtime_context.py \
            tests/test_android_shadow_launch_admission.py \
            tests/test_android_shadow_preflight_truth.py \
            tests/test_discovery_search.py \
            tests/test_full_stack_shadow.py \
            tests/test_full_stack_shadow_recovery.py \
            tests/test_operations_policy.py \
            tests/test_runtime_identity.py \
            tests/test_runtime_identity_shadow_gate.py \
            tests/test_scheduler_policy.py \
            tests/test_shadow_qualification_contract.py \
            tests/test_shadow_worker_exception.py \
            tests/test_shadow_worker_cap_exclusion.py

      - name: Prove consequential runtime controls remain off
        working-directory: backend
        run: |
          python - <<'PY'
          from app.config import get_settings
          from app.services.operations_policy import operations_readiness_manifest
          from app.services.runtime_identity import runtime_identity_manifest

          settings = get_settings()
          operations = operations_readiness_manifest()
          identity = runtime_identity_manifest()
          assert settings.allow_real_application_submit is False
          assert settings.allow_real_followup_send is False
          assert operations["autopilot_enabled"] is True
          assert operations["global_kill_switch"] is False
          assert identity["deployment_attested"] is True
          assert identity["revision"] == identity["expected_revision"]
          assert identity["role"] == "ci"
          PY

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run Phase 11 frontend contract
        working-directory: frontend
        run: node --test test/shadow-campaign-center.test.js

      - name: Build frontend
        working-directory: frontend
        run: npm run build
