name: Android APK

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/tests/test_v1_release_contract.py"
      - "backend/tests/test_v2_release_provenance.py"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/tests/test_v1_release_contract.py"
      - "backend/tests/test_v2_release_provenance.py"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      VITE_JOBTOMATIK_RUNTIME_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and synchronize Capacitor
        run: npm run android:prepare

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          chmod +x android/gradlew
          grep -q 'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.1-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'validateDistributionUrl=true' android/gradle/wrapper/gradle-wrapper.properties
          ! grep -q '/tmp/gradle' android/gradle/wrapper/gradle-wrapper.properties
          cd android
          ./gradlew --no-daemon --version

      - name: Lint and assemble development APK
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cd android
          ./gradlew --no-daemon lintDebug assembleDebug | tee android-build-output.txt

      - name: Verify APK identity, version, signing, and source revision
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee android-apk-badging.txt
          grep -q "package: name='ca.jobtomatik.app'" android-apk-badging.txt
          grep -q "versionCode='200'" android-apk-badging.txt
          grep -q "versionName='2.0.0'" android-apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee android-apk-signing.txt

          mkdir -p release
          cp "$APK" release/JobTomatik-v2.00-development.apk
          sha256sum release/JobTomatik-v2.00-development.apk > release/JobTomatik-v2.00-development.sha256
          printf '%s\n' "$SOURCE_REVISION" > release/SOURCE-COMMIT.txt
          grep -Fxq "$SOURCE_REVISION" release/SOURCE-COMMIT.txt
          cp android-apk-signing.txt release/APK-SIGNING.txt

          cat > release/BUILD-INFO.txt <<EOF
          JobTomatik v2.00 candidate artifact
          Technical version: 2.0.0
          Android application ID: ca.jobtomatik.app
          Android version code: 200
          Signing mode: development
          Source commit: $SOURCE_REVISION
          Publication authorized: false
          Built and verified by: GitHub Actions
          EOF

      - name: Upload APK candidate and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jobtomatik-v2-android-apk-${{ env.SOURCE_REVISION }}
          path: |
            frontend/release/*
            frontend/android/android-build-output.txt
            frontend/android-apk-badging.txt
            frontend/android-apk-signing.txt
            frontend/android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30
