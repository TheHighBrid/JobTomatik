name: Android APK

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/tests/test_v1_release_contract.py"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/tests/test_v1_release_contract.py"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      VITE_JOBTOMATIK_RUNTIME_REVISION: ${{ github.sha }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and synchronize Capacitor
        run: npm run android:prepare

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          chmod +x android/gradlew
          grep -q 'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.1-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'validateDistributionUrl=true' android/gradle/wrapper/gradle-wrapper.properties
          ! grep -q '/tmp/gradle' android/gradle/wrapper/gradle-wrapper.properties
          cd android
          ./gradlew --no-daemon --version

      - name: Lint and assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew --no-daemon lintDebug assembleDebug | tee android-build-output.txt

      - name: Verify APK identity, version, and source revision
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee android-apk-badging.txt
          grep -q "package: name='ca.jobtomatik.app'" android-apk-badging.txt
          grep -q "versionCode='200'" android-apk-badging.txt
          grep -q "versionName='2.0.0'" android-apk-badging.txt
          mkdir -p release
          cp "$APK" release/JobTomatik-v2.00-debug.apk
          sha256sum release/JobTomatik-v2.00-debug.apk > release/JobTomatik-v2.00-debug.sha256
          printf '%s\n' "$GITHUB_SHA" > release/SOURCE-COMMIT.txt
          grep -Fxq "$GITHUB_SHA" release/SOURCE-COMMIT.txt

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jobtomatik-v2-android-apk
          path: |
            frontend/release/*
            frontend/android/android-build-output.txt
            frontend/android-apk-badging.txt
            frontend/android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30

  publish-v2-release:
    needs: build-apk
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'release/publish-v2.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-jobtomatik-v2.0.0
      cancel-in-progress: false
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v8
        with:
          name: jobtomatik-v2-android-apk
          path: downloaded

      - name: Prepare JobTomatik v2.00 release files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="$(find downloaded -type f -name 'JobTomatik-v2.00-debug.apk' -print -quit)"
          test -n "$SOURCE_APK"
          test -s "$SOURCE_APK"

          SOURCE_COMMIT_FILE="$(find downloaded -type f -name 'SOURCE-COMMIT.txt' -print -quit)"
          test -n "$SOURCE_COMMIT_FILE"
          test -s "$SOURCE_COMMIT_FILE"
          SOURCE_COMMIT="$(tr -d '\r\n' < "$SOURCE_COMMIT_FILE")"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]

          mkdir -p release
          cp "$SOURCE_APK" release/JobTomatik-v2.00.apk
          cp "$SOURCE_COMMIT_FILE" release/SOURCE-COMMIT.txt
          sha256sum release/JobTomatik-v2.00.apk > release/JobTomatik-v2.00.sha256

          BADGING="$(find downloaded -type f -name 'android-apk-badging.txt' -print -quit)"
          if [ -n "$BADGING" ]; then
            cp "$BADGING" release/APK-BADGING.txt
          else
            printf '%s\n' "Verified during Android APK build job." > release/APK-BADGING.txt
          fi

          cat > release/BUILD-INFO.txt <<EOF
          JobTomatik v2.00
          Technical version: 2.0.0
          Android application ID: ca.jobtomatik.app
          Android version code: 200
          Signing mode: development
          Source commit: $SOURCE_COMMIT
          Built and verified by: GitHub Actions
          EOF

          cat > release/RELEASE_NOTES.md <<EOF
          # JobTomatik v2.00

          JobTomatik v2.00 packages the current application and updated visual system into a new Android APK.

          - Android version: 2.0.0
          - Android version code: 200
          - Application ID: ca.jobtomatik.app
          - Signing mode: development
          - Source commit: $SOURCE_COMMIT

          The APK was compiled, linted, identity-checked, version-checked, and supplied with a SHA-256 checksum by GitHub Actions.
          EOF

      - name: Refuse to overwrite an existing tag or release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: v2.0.0
        with:
          script: |
            const releaseTag = process.env.RELEASE_TAG;
            let tagExists = false;
            let releaseExists = false;

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${releaseTag}`,
              });
              tagExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: releaseTag,
              });
              releaseExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (tagExists || releaseExists) {
              core.setFailed(
                `Refusing to overwrite immutable release identity ${releaseTag}: ` +
                `tag_exists=${tagExists}, release_exists=${releaseExists}`,
              );
            }

      - name: Publish JobTomatik v2.00 GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.0.0
          target_commitish: main
          name: JobTomatik v2.00
          body_path: release/RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            release/JobTomatik-v2.00.apk
            release/JobTomatik-v2.00.sha256
            release/SOURCE-COMMIT.txt
            release/BUILD-INFO.txt
            release/APK-BADGING.txt

      - name: Report release publication
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ JobTomatik v2.00 was compiled and published as GitHub Release \`v2.0.0\`.\n\nRun: ${runUrl}`,
            });
