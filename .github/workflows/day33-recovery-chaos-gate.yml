name: Day 33 recovery chaos gate

on:
  pull_request:
    paths:
      - "backend/app/services/day33_recovery_chaos.py"
      - "backend/app/services/application_recovery.py"
      - "backend/app/services/dead_letter.py"
      - "backend/app/services/dead_letter_drill.py"
      - "backend/app/services/agent_execution.py"
      - "backend/app/tasks/agent_execution.py"
      - "backend/scripts/prepare_android_runtime.py"
      - "backend/scripts/build_day33_recovery_gate.py"
      - "backend/tests/test_day33_recovery_chaos.py"
      - "backend/tests/test_application_recovery.py"
      - "backend/tests/test_dead_letter_recovery.py"
      - "backend/tests/test_dead_letter_drill.py"
      - ".github/workflows/day33-recovery-chaos-gate.yml"
      - "backend/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: sqlite:///./day33-recovery-chaos.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: day33-recovery-chaos-ci-only-secret-000000000000
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  ALLOW_REAL_FOLLOWUP_SEND: "false"
  AUTOPILOT_ENABLED: "false"
  AUTOMATION_GLOBAL_KILL_SWITCH: "false"
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  day33-recovery-chaos:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r backend/requirements.txt

      - name: Run Day 33 recovery regressions
        working-directory: backend
        run: |
          pytest -q --tb=short -ra \
            tests/test_day33_recovery_chaos.py \
            tests/test_application_recovery.py \
            tests/test_dead_letter_recovery.py \
            tests/test_dead_letter_drill.py \
            --junitxml=day33-recovery-chaos-junit.xml

      - name: Verify canonical safety
        run: bash scripts/verify.sh safety

      - name: Export exact-head Day 33 evidence
        working-directory: backend
        run: |
          PYTHONPATH=. python scripts/build_day33_recovery_gate.py \
            --verification-commit "$SOURCE_COMMIT" \
            --output day33-recovery-chaos-gate.json

      - name: Assert Day 33 remains fail closed
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          import os

          gate = json.load(open('day33-recovery-chaos-gate.json', encoding='utf-8'))
          assert gate['verification_commit'] == os.environ['SOURCE_COMMIT']
          assert gate['gate_passed'] is True
          assert gate['runtime_safety']['autopilot_enabled'] is False
          assert gate['runtime_safety']['real_submission_enabled'] is False
          contract = gate['contract']
          for key in (
              'process_crash_exercised',
              'worker_restart_exercised',
              'redis_interruption_exercised',
              'database_lock_exercised',
              'browser_death_exercised',
              'device_reboot_exercised',
              'verified_checkpoint_required_for_resume',
              'irrecoverable_tasks_dead_lettered',
              'no_duplicate_submission',
              'no_status_corruption',
              'consequential_authority_remains_false',
              'android_reboot_recovery_path_bound',
              'automatic_dead_letter_retry_disabled',
          ):
              assert contract[key] is True
          chaos = gate['chaos_report']
          assert chaos['passed'] is True
          assert chaos['safety']['final_submit_clicked'] is False
          assert chaos['safety']['network_contacted'] is False
          assert chaos['safety']['celery_dispatched'] is False
          PY

      - name: Upload Day 33 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day33-recovery-chaos-gate
          path: |
            backend/day33-recovery-chaos-gate.json
            backend/day33-recovery-chaos-junit.xml
          if-no-files-found: error
          retention-days: 30
