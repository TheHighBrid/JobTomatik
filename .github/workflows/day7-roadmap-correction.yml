name: Day 7 roadmap correction

on:
  push:
    branches:
      - agent/day-07-phase-1-release-gate
    paths:
      - "scripts/apply_day7_roadmap_correction.py"
      - ".github/workflows/day7-roadmap-correction.yml"

permissions:
  contents: write

concurrency:
  group: day7-roadmap-correction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correct-and-remove:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact roadmap corrections and remove temporary tooling
        run: python scripts/apply_day7_roadmap_correction.py

      - name: Commit corrected roadmap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Correct Phase 2 Lever baseline and daily targets"
          git push origin HEAD:${{ github.ref_name }}
