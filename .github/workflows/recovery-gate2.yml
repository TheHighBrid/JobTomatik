name: Recovery Gate 2 synthetic verification

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/recovery-gate2.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/services/recovery_gate2.py"
      - "backend/scripts/run_recovery_gate2.py"
      - "backend/tests/test_recovery_gate2.py"
      - ".github/workflows/recovery-gate2.yml"
  # Path-independent producer for the exact-head `synthetic-controls` receipt on
  # any later main SHA (Gate 2 proof-v2 W2). Dispatch with `--ref main`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./gate2-tests.db
      SECRET_KEY: gate2-synthetic-tests-only-secret
      AI_PROVIDER: template
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      AUTOPILOT_ENABLED: "false"
      GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
      LEVER_SUPERVISED_PILOT_ENABLED: "false"
      REQUIRE_BROWSER_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -q -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run real Chromium synthetic negative controls on exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > gate2-head.txt
          python -m pytest -q --tb=short -ra tests/test_recovery_gate2.py \
            --basetemp=gate2-synthetic-artifacts | tee gate2-tests.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recovery-gate2-synthetic-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            backend/gate2-head.txt
            backend/gate2-tests.txt
            backend/gate2-synthetic-artifacts
          if-no-files-found: error
          retention-days: 30
