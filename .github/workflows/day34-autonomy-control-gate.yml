name: Day 34 autonomy control gate

on:
  pull_request:
    paths:
      - "backend/app/api/autonomy_control.py"
      - "backend/app/api/scheduler.py"
      - "backend/app/main.py"
      - "backend/app/celery_app.py"
      - "backend/app/services/autonomy_control_center.py"
      - "backend/app/services/operator_autonomy_control.py"
      - "backend/app/services/operator_autonomy_control_integration.py"
      - "backend/scripts/build_day34_autonomy_control_gate.py"
      - "backend/tests/test_day34_autonomy_control.py"
      - "frontend/src/api/autonomy.js"
      - "frontend/src/pages/AutonomyCenter.jsx"
      - "frontend/src/App.jsx"
      - "frontend/src/components/MobileNav.jsx"
      - "frontend/test/autonomy-center.test.js"
      - ".github/workflows/day34-autonomy-control-gate.yml"
      - "backend/requirements.txt"
      - "frontend/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: sqlite:///./day34-autonomy-control.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: day34-autonomy-control-ci-only-secret-000000000000
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  ALLOW_REAL_FOLLOWUP_SEND: "false"
  AUTOPILOT_ENABLED: "false"
  AUTOMATION_GLOBAL_KILL_SWITCH: "false"
  ENABLE_RESUMABLE_HANDOFFS: "false"
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  VITE_JOBTOMATIK_RUNTIME_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  day34-autonomy-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        working-directory: frontend
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: |
          python -m pip install -q --disable-pip-version-check -r backend/requirements.txt
          cd frontend && npm ci

      - name: Run Day 34 backend regressions
        working-directory: backend
        run: |
          pytest -q --tb=short -ra \
            tests/test_day34_autonomy_control.py \
            tests/test_scheduler_policy.py \
            tests/test_scheduler_unattended_activation.py \
            tests/test_day30_policy_runtime.py \
            tests/test_application_recovery.py \
            tests/test_handoff_sessions.py \
            --junitxml=day34-autonomy-control-junit.xml

      - name: Run frontend runtime and accessibility regressions
        working-directory: frontend
        run: |
          node --test test/autonomy-center.test.js test/scheduler-center.test.js
          npm run build

      - name: Synchronize Android exact head
        working-directory: frontend
        run: npx cap sync android

      - name: Android lint and assemble
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug assembleDebug

      - name: Verify Android APK exact-head revision
        working-directory: frontend
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          printf '%s\n' "$SOURCE_COMMIT" > day34-android-source-commit.txt
          grep -Fxq "$SOURCE_COMMIT" day34-android-source-commit.txt
          sha256sum "$APK" > day34-android-apk.sha256

      - name: Verify canonical safety
        run: bash scripts/verify.sh safety

      - name: Export exact-head Day 34 evidence
        working-directory: backend
        run: |
          PYTHONPATH=. python scripts/build_day34_autonomy_control_gate.py \
            --verification-commit "$SOURCE_COMMIT" \
            --output day34-autonomy-control-gate.json

      - name: Assert control centre cannot bypass submission gates
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          import os

          gate = json.load(open('day34-autonomy-control-gate.json', encoding='utf-8'))
          assert gate['verification_commit'] == os.environ['SOURCE_COMMIT']
          assert gate['gate_passed'] is True
          assert gate['runtime_safety']['autopilot_enabled'] is False
          assert gate['runtime_safety']['real_submission_enabled'] is False
          assert gate['runtime_safety']['control_submission_authorized'] is False
          contract = gate['contract']
          for key in (
              'running_allows_scheduler_admission',
              'pause_blocks_scheduler_admission',
              'pause_blocks_prebrowser_worker',
              'drain_blocks_new_scheduler_admission',
              'drain_allows_existing_prebrowser_work',
              'invalid_state_fails_closed',
              'control_api_has_no_submit_route',
              'ui_has_no_direct_live_submit_control',
              'ui_exposes_pause_drain_resume_reject',
              'ui_exposes_required_domains',
              'offline_reconnect_bound',
              'android_one_tap_control_route',
              'worker_runtime_installs_operator_gate',
              'android_lint_and_assemble_required',
              'android_platform_35_required',
          ):
              assert contract[key] is True
          PY

      - name: Upload Day 34 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day34-autonomy-control-gate
          path: |
            backend/day34-autonomy-control-gate.json
            backend/day34-autonomy-control-junit.xml
            frontend/day34-android-source-commit.txt
            frontend/day34-android-apk.sha256
            frontend/android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30
