name: Retain final Lever Phase A dry-run checkpoint

on:
  push:
    branches:
      - checkpoint/lever-phase-a-day14-dry-run
    paths:
      - .github/workflows/lever-day14-final-dry-run.yml
      - backend/evidence/lever-phase-a-day14-request.json

permissions:
  contents: write
  actions: read

concurrency:
  group: lever-phase-a-day14-final-dry-run
  cancel-in-progress: false

env:
  PYTHONPATH: .
  DATABASE_URL: sqlite:///./lever-day14.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: lever-day14-dry-run-secret
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
  LEVER_SUPERVISED_PILOT_ENABLED: "false"
  AUTOPILOT_ENABLED: "false"
  ENABLE_RESUMABLE_HANDOFFS: "false"

jobs:
  certify-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -q --disable-pip-version-check -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify frozen instrumentation and safety
        env:
          REQUIRE_BROWSER_TESTS: "1"
        run: |
          python -m compileall -q app scripts tests
          pytest -q --tb=short -ra \
            tests/test_text_control_evidence.py \
            tests/test_lever_control_evidence_integrity.py \
            tests/test_lever_synthetic_certification.py \
            tests/test_lever_phase_a_title_compat.py \
            tests/test_lever_phase_a_ready_provenance.py \
            tests/test_form_filler_anonymous_controls.py
          python - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(
              Path('evidence/lever-phase-a-day14-request.json').read_text()
          )
          assert len(request['requested_review_ids']) == 10
          assert request['requested_checkpoint'] == 30
          assert request['safety']['final_submit_clicked'] is False
          assert request['safety']['captcha_bypass_allowed'] is False
          assert request['safety']['synthetic_profiles_only'] is True
          PY

  exercise-and-retain:
    needs: certify-instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        review_id:
          - D8-004
          - D8-009
          - D8-010
          - D8-016
          - D8-018
          - D8-020
          - D8-030
          - D8-034
          - D8-036
          - D8-040
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -q --disable-pip-version-check -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Resolve exact frozen target
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from app.services.lever_phase_a_operator import load_locked_target

          review_id = os.environ['REVIEW_ID']
          target = load_locked_target(
              review_id, Path('evidence/lever-phase-a-target-corpus')
          )
          Path('day14-target.json').write_text(
              json.dumps(target, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('day14-url.txt').write_text(
              str(target['canonical_application_url']), encoding='utf-8'
          )
          print(review_id, target['employer'], target['canonical_application_url'])
          PY

      - name: Exercise exact target without submission
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          set +e
          destination="evidence/lever-phase-a-artifacts/${REVIEW_ID}"
          mkdir -p "$destination"
          python -u scripts/certify_lever_live.py \
            --urls "$(cat day14-url.txt)" \
            --exercise \
            --synthetic-resume-path "$destination/lever-phase-a-synthetic-resume.pdf" \
            --report "$destination/lever-phase-a-report.json" \
            > "day14-${REVIEW_ID}.log" 2>&1
          cat "day14-${REVIEW_ID}.log"
          exit 0

      - name: Assert immutable no-submit boundary
        if: always()
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          review_id = os.environ['REVIEW_ID']
          path = Path(
              f'evidence/lever-phase-a-artifacts/{review_id}/'
              'lever-phase-a-report.json'
          )
          assert path.is_file(), path
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['final_submit_clicked'] is False
          assert not any(
              item.get('final_submit_clicked') is True
              for item in report.get('reports') or []
          )
          exercise = next(
              item for item in report['reports'] if item.get('mode') == 'exercise'
          )
          assert exercise.get('control_evidence_schema_version') == '1.0'
          assert exercise.get('control_evidence_count') == len(
              exercise.get('control_evidence') or []
          )
          PY

      - name: Validate frozen qualification contract
        id: qualify
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          set +e
          python scripts/finalize_lever_phase_a_ready_compatible.py \
            --validate-only \
            --review-id "$REVIEW_ID" \
            --report "evidence/lever-phase-a-artifacts/${REVIEW_ID}/lever-phase-a-report.json" \
            > "day14-${REVIEW_ID}-validation.log" 2>&1
          status=$?
          cat "day14-${REVIEW_ID}-validation.log"
          if [[ "$status" -eq 0 ]]; then
            echo "qualifying=true" >> "$GITHUB_OUTPUT"
          else
            echo "qualifying=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload complete attempt evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-day14-attempt-${{ matrix.review_id }}-${{ github.sha }}
          path: |
            backend/evidence/lever-phase-a-artifacts/${{ matrix.review_id }}/**
            backend/day14-target.json
            backend/day14-${{ matrix.review_id }}.log
            backend/day14-${{ matrix.review_id }}-validation.log
          if-no-files-found: error
          retention-days: 30

      - name: Build one-record retention manifest
        if: steps.qualify.outputs.qualifying == 'true'
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          review_id = os.environ['REVIEW_ID']
          report = Path(
              f'evidence/lever-phase-a-artifacts/{review_id}/'
              'lever-phase-a-report.json'
          )
          manifest = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'commit_sha': os.environ['GITHUB_SHA'],
              'retained_record_count': 1,
              'report': {
                  'review_id': review_id,
                  'path': report.as_posix(),
                  'sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
              },
          }
          Path('lever-phase-a-ready-retention-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload independently retained ready evidence
        if: steps.qualify.outputs.qualifying == 'true'
        id: retained
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-ready-${{ matrix.review_id }}-${{ github.sha }}
          path: |
            backend/evidence/lever-phase-a-artifacts/${{ matrix.review_id }}/**
            backend/lever-phase-a-ready-retention-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Download and finalize official retained artifact
        if: steps.qualify.outputs.qualifying == 'true'
        env:
          REVIEW_ID: ${{ matrix.review_id }}
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
          ARTIFACT_DIGEST_OUTPUT: ${{ steps.retained.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest="${ARTIFACT_DIGEST_OUTPUT#sha256:}"
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" > "/tmp/${REVIEW_ID}-metadata.json" && break
            sleep $((attempt * 2))
          done
          for attempt in 1 2 3 4 5 6; do
            curl -fL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/zip" -o "/tmp/${REVIEW_ID}-artifact.zip" && break
            sleep $((attempt * 2))
          done
          [[ -s "/tmp/${REVIEW_ID}-metadata.json" ]]
          [[ -s "/tmp/${REVIEW_ID}-artifact.zip" ]]
          echo "${digest}  /tmp/${REVIEW_ID}-artifact.zip" | sha256sum -c -
          python scripts/finalize_lever_phase_a_ready_compatible.py \
            --review-id "$REVIEW_ID" \
            --report "evidence/lever-phase-a-artifacts/${REVIEW_ID}/lever-phase-a-report.json" \
            --artifact-metadata "/tmp/${REVIEW_ID}-metadata.json" \
            --artifact-zip "/tmp/${REVIEW_ID}-artifact.zip" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$digest" \
            --operator github-actions

      - name: Stage independently finalized package
        if: steps.qualify.outputs.qualifying == 'true'
        env:
          REVIEW_ID: ${{ matrix.review_id }}
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
          ARTIFACT_DIGEST_OUTPUT: ${{ steps.retained.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          digest="${ARTIFACT_DIGEST_OUTPUT#sha256:}"
          stage="day14-package/evidence"
          rm -rf day14-package
          mkdir -p \
            "$stage/lever-phase-a-artifacts/${REVIEW_ID}" \
            "$stage/lever-phase-a-external-archives/${REVIEW_ID}"
          cp -a \
            "evidence/lever-phase-a-artifacts/${REVIEW_ID}/." \
            "$stage/lever-phase-a-artifacts/${REVIEW_ID}/"
          cp "evidence/lever-phase-a-candidate-${REVIEW_ID}.csv" "$stage/"
          cp "evidence/lever-phase-a-source-${REVIEW_ID}.csv" "$stage/"
          cp \
            "evidence/lever-phase-a-external-archives/${REVIEW_ID}/artifact-${ARTIFACT_ID}-${digest}.zip" \
            "$stage/lever-phase-a-external-archives/${REVIEW_ID}/"

      - name: Upload finalized Day 14 package
        if: steps.qualify.outputs.qualifying == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-day14-package-${{ matrix.review_id }}-${{ github.sha }}
          path: backend/day14-package
          if-no-files-found: error
          retention-days: 30

  import-checkpoint:
    needs: exercise-and-retain
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Refuse stale checkpoint import
        run: |
          remote_sha="$(git ls-remote origin refs/heads/checkpoint/lever-phase-a-day14-dry-run | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA" || {
            echo "Branch advanced from $GITHUB_SHA to $remote_sha; refusing stale import." >&2
            exit 1
          }

      - name: Download all finalized packages
        uses: actions/download-artifact@v8
        with:
          pattern: lever-phase-a-day14-package-*-${{ github.sha }}
          path: /tmp/day14-packages
          merge-multiple: true

      - name: Replace eight bindings and add two distinct sites
        run: |
          python scripts/import_lever_day14_packages.py \
            --package-root /tmp/day14-packages \
            --evidence-root evidence \
            --request evidence/lever-phase-a-day14-request.json

      - name: Regenerate and verify the final campaign checkpoint
        run: |
          python scripts/evaluate_campaign_days_12_22.py \
            --lever evidence/lever-pilot-readiness.json \
            --output evidence/campaign-days-12-22.json
          python scripts/verify_lever_phase_a_checkpoint.py \
            --evidence-root evidence \
            --output-root evidence-ci
          python scripts/certify_lever_pilot_readiness.py \
            --baseline evidence/lever-phase-a-baseline.csv \
            --ledger evidence/.missing-phase-b-runtime.jsonl \
            --json-output /tmp/lever-day14-certification.json \
            --markdown-output /tmp/lever-day14-certification.md
          python - <<'PY'
          import json
          from pathlib import Path

          readiness = json.loads(
              Path('evidence/lever-pilot-readiness.json').read_text()
          )
          checkpoint = json.loads(
              Path('evidence/campaign-days-12-22.json').read_text()
          )
          verification = json.loads(
              Path('evidence-ci/lever-phase-a-checkpoint-verification.json').read_text()
          )
          summary = readiness['summary']
          day14 = next(
              item for item in checkpoint['checkpoints'] if item['day'] == 14
          )
          assert summary['qualifying_dry_run_count'] == 30
          assert summary['distinct_site_count'] == 30
          assert summary['record_count'] == 31
          assert summary['manual_challenge_boundary_count'] == 1
          assert summary['phase_a_external_archive_failure_count'] == 0
          assert summary['phase_a_inspection_failure_count'] == 0
          assert summary['duplicate_submission_count'] == 0
          assert summary['false_submitted_count'] == 0
          assert summary['canonical_maturity'] == 'dry_run'
          assert summary['promotion_ready'] is False
          assert summary['gates']['thirty_qualifying_dry_runs'] is True
          assert summary['gates']['thirty_distinct_lever_sites'] is True
          assert summary['gates']['explicit_separate_promotion_approval'] is False
          assert day14['passed'] is True
          assert verification['phase_a_target_reached'] is True
          assert verification['day14_supersession']['replacement_count'] == 8
          assert verification['day14_supersession']['addition_count'] == 2
          assert verification['safety']['final_submit_clicked'] is False
          assert checkpoint['safety']['final_submit_clicked'] is False
          assert checkpoint['safety']['maturity_promoted'] is False
          PY

      - name: Run final evidence and freeze regressions
        env:
          REQUIRE_BROWSER_TESTS: "1"
        run: |
          python -m compileall -q app scripts tests
          pytest -q --tb=short -ra \
            tests/test_text_control_evidence.py \
            tests/test_lever_control_evidence_integrity.py \
            tests/test_lever_synthetic_certification.py \
            tests/test_lever_phase_a_title_compat.py \
            tests/test_lever_phase_a_ready_provenance.py \
            tests/test_lever_phase_a_multi_archive.py \
            tests/test_lever_phase_a_ready_archive.py \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_phase_a_checkpoint_progression.py \
            tests/test_lever_readiness_hardening.py \
            tests/test_lever_pilot_certification.py \
            tests/test_campaign_day_gates.py \
            tests/test_certification_regressions.py
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('..').resolve()
          freeze = json.loads(
              (root / 'docs/operations/lever-phase-2-measurement-freeze.json').read_text()
          )
          assert freeze['contract_version'] == '2026-08-04.day14.1'
          for path, expected in freeze['locked_input_blobs'].items():
              actual = subprocess.check_output(
                  ['git', 'hash-object', path], cwd=root, text=True
              ).strip()
              assert actual == expected, (path, expected, actual)
          print('FINAL LOCKED BLOBS VERIFIED')
          PY
          git diff --check

      - name: Commit final dry-run checkpoint
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/checkpoint/lever-phase-a-day14-dry-run | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA" || {
            echo "Branch advanced before checkpoint commit; refusing stale push." >&2
            exit 1
          }
          rm -f \
            "$GITHUB_WORKSPACE/.github/workflows/lever-day14-final-dry-run.yml" \
            "$GITHUB_WORKSPACE/backend/scripts/import_lever_day14_packages.py"
          rm -rf evidence-ci .lever-day14-staged-evidence
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Retain final Lever Phase A dry-run checkpoint"
          remote_sha="$(git ls-remote origin refs/heads/checkpoint/lever-phase-a-day14-dry-run | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA" || {
            echo "Branch advanced before push; refusing stale commit." >&2
            exit 1
          }
          git push origin HEAD:checkpoint/lever-phase-a-day14-dry-run
