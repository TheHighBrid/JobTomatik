name: Temporary P1 regression patch

on:
  pull_request:
    paths:
      - ".github/workflows/day-06-operational-safety.yml"
      - "scripts/apply_p1_regression_patch.py"
      - "scripts/complete_p1_regression_patch.py"

permissions:
  contents: write

jobs:
  apply-p1-regression-fixes:
    if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply fail-closed P1 patch
        shell: bash
        run: |
          set +e
          output=$(python scripts/apply_p1_regression_patch.py 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && [[ "$output" != *"backend/app/services/lever_pilot_ledger_boundary.py"* ]]; then
            exit "$status"
          fi
          python scripts/complete_p1_regression_patch.py

      - name: Compile patched modules
        run: |
          python -m compileall -q \
            backend/app/services/operational_safety.py \
            backend/app/services/form_filler.py \
            backend/app/services/browser_handoff.py \
            backend/app/services/handoff_safety_integration.py \
            backend/app/services/application_target_handoff.py \
            backend/app/services/lever_readiness_hardening.py \
            backend/app/services/lever_pilot_ingestion.py \
            backend/app/services/lever_pilot_ledger_boundary.py \
            backend/tests/test_day06_operational_safety.py \
            backend/tests/test_lever_readiness_hardening.py \
            backend/tests/test_lever_pilot_ingestion.py

      - name: Commit code and regression tests
        run: |
          git config user.name "jobtomatik-safety-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            backend/app/services/operational_safety.py \
            backend/app/services/form_filler.py \
            backend/app/services/browser_handoff.py \
            backend/app/services/handoff_safety_integration.py \
            backend/app/services/application_target_handoff.py \
            backend/app/services/lever_readiness_hardening.py \
            backend/app/services/lever_pilot_ingestion.py \
            backend/app/services/lever_pilot_ledger_boundary.py \
            backend/tests/test_day06_operational_safety.py \
            backend/tests/test_lever_readiness_hardening.py \
            backend/tests/test_lever_pilot_ingestion.py
          git commit -m "Fix kill switch target binding and readiness P1 regressions"
          git push origin HEAD:${{ github.head_ref }}
