name: Temporary retained-session compatibility patch

on:
  pull_request:
    paths:
      - ".github/workflows/day-06-operational-safety.yml"

permissions:
  contents: write

jobs:
  patch-legacy-session-boundary:
    if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    env:
      DATABASE_URL: sqlite:///./legacy-session-patch.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: legacy-session-patch-only
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      AUTOMATION_GLOBAL_KILL_SWITCH: "false"
      AUTOPILOT_DISABLED_PLATFORMS: ""
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Preserve kill switch for legacy unbound sessions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/browser_handoff.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '        await page.wait_for_timeout(settle_ms)\n'
              '        try:\n'
              '            require_bound_handoff_url(session, page.url)\n'
              '        except OperationalSafetyViolation as exc:\n'
              '            raise BrowserHandoffError(f"[{exc.code}] {exc}") from exc\n\n'
              '        confirmation = await _submission_confirmation_state(page)\n'
          )
          new = (
              '        await page.wait_for_timeout(settle_ms)\n'
              '        binding = dict((session.handoff_metadata or {}).get("target_binding") or {})\n'
              '        try:\n'
              '            if binding:\n'
              '                require_bound_handoff_url(session, page.url)\n'
              '            else:\n'
              '                require_browser_entry_allowed(page.url)\n'
              '        except OperationalSafetyViolation as exc:\n'
              '            raise BrowserHandoffError(f"[{exc.code}] {exc}") from exc\n\n'
              '        confirmation = await _submission_confirmation_state(page)\n'
          )
          if old not in text:
              raise SystemExit('Expected retained-session action boundary was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Run focused retained-session regressions
        working-directory: backend
        run: |
          python -m py_compile app/services/browser_handoff.py
          pytest -q --tb=short -ra \
            tests/test_handoff_code_recovery.py \
            tests/test_day06_operational_safety.py

      - name: Commit compatibility fix
        run: |
          git config user.name "jobtomatik-safety-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/services/browser_handoff.py
          git commit -m "Preserve kill switch for legacy retained sessions"
          git push origin HEAD:${{ github.head_ref }}
