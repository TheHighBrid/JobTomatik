name: Day 6 operational safety certification

on:
  pull_request:
    paths:
      - ".env.example"
      - "backend/app/services/operations_*.py"
      - "backend/app/services/operational_safety.py"
      - "backend/app/services/handoff_*.py"
      - "backend/app/services/application_target_handoff.py"
      - "backend/app/services/browser_handoff.py"
      - "backend/app/services/form_filler.py"
      - "backend/app/services/lever_pilot_ingestion.py"
      - "backend/app/services/lever_pilot_ledger_boundary.py"
      - "backend/app/services/lever_readiness_hardening.py"
      - "backend/app/tasks/handoffs.py"
      - "backend/tests/test_day06_operational_safety.py"
      - "backend/tests/test_operations_policy.py"
      - "backend/tests/test_handoff_*.py"
      - "backend/tests/test_lever_pilot_ingestion.py"
      - "backend/tests/test_lever_readiness_hardening.py"
      - ".github/workflows/day-06-operational-safety.yml"
  push:
    branches:
      - main
    paths:
      - ".env.example"
      - "backend/app/services/operations_*.py"
      - "backend/app/services/operational_safety.py"
      - "backend/app/services/handoff_*.py"
      - "backend/app/services/application_target_handoff.py"
      - "backend/app/services/browser_handoff.py"
      - "backend/app/services/form_filler.py"
      - "backend/app/services/lever_pilot_ingestion.py"
      - "backend/app/services/lever_pilot_ledger_boundary.py"
      - "backend/app/services/lever_readiness_hardening.py"
      - "backend/app/tasks/handoffs.py"
      - "backend/tests/test_day06_operational_safety.py"
      - "backend/tests/test_operations_policy.py"
      - "backend/tests/test_handoff_*.py"
      - "backend/tests/test_lever_pilot_ingestion.py"
      - "backend/tests/test_lever_readiness_hardening.py"
      - ".github/workflows/day-06-operational-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-drill:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DATABASE_URL: sqlite:///./day06-operational-safety.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: day06-operational-safety-certification-only
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      AUTOMATION_GLOBAL_KILL_SWITCH: "false"
      AUTOPILOT_ENABLED: "false"
      AUTOPILOT_DISABLED_PLATFORMS: ""
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      ENABLE_RESUMABLE_HANDOFFS: "false"
      GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
      LEVER_SUPERVISED_PILOT_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Compile safety handoff and readiness modules
        run: |
          python -m compileall -q \
            app/services/operations_settings.py \
            app/services/operations_policy.py \
            app/services/operational_safety.py \
            app/services/handoff_safety_integration.py \
            app/services/handoff_integration.py \
            app/services/application_target_handoff.py \
            app/services/browser_handoff.py \
            app/services/form_filler.py \
            app/services/lever_pilot_ingestion.py \
            app/services/lever_pilot_ledger_boundary.py \
            app/services/lever_readiness_hardening.py \
            app/tasks/handoffs.py

      - name: Run kill switch handoff breaker and readiness matrix
        shell: bash
        run: |
          set +e
          pytest -q --tb=short -ra \
            tests/test_day06_operational_safety.py \
            tests/test_operations_policy.py \
            tests/test_handoff_sessions.py \
            tests/test_handoff_api.py \
            tests/test_lever_pilot_ingestion.py \
            tests/test_lever_readiness_hardening.py \
            > day06-operational-safety.txt 2>&1
          status=$?
          cat day06-operational-safety.txt
          exit $status

      - name: Assert fail-safe defaults and reason matrix
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.services.operational_safety import operational_safety_manifest
          from app.services.operations_policy import operations_readiness_manifest

          env_text = Path('../.env.example').read_text(encoding='utf-8')
          for required in (
              'AUTOMATION_GLOBAL_KILL_SWITCH=false',
              'AUTOPILOT_ENABLED=false',
              'ALLOW_REAL_APPLICATION_SUBMIT=false',
              'ENABLE_RESUMABLE_HANDOFFS=false',
          ):
              assert required in env_text, required

          operations = operations_readiness_manifest()
          safety = operational_safety_manifest()
          assert operations['global_kill_switch'] is False
          assert operations['autopilot_enabled'] is False
          assert operations['real_submission_enabled'] is False
          assert operations['resumable_handoffs_enabled'] is False
          assert safety['invariants']['wrong_application_or_posting_resume_is_blocked'] is True
          assert safety['invariants']['uncertain_confirmation_requires_evidence_review'] is True
          PY

      - name: Upload Day 6 certification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day06-operational-safety-report
          path: backend/day06-operational-safety.txt
          if-no-files-found: error
          retention-days: 30
