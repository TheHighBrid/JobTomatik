  apply-p1-regression-fixes:
    if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply fail-closed P1 patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected patch anchor missing in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path, marker, addition):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if marker not in text:
                  target.write_text(text.rstrip() + "\n\n" + addition.strip() + "\n", encoding="utf-8")

