name: Codacy public API probe

on:
  push:
    branches:
      - codex/codacy-quality-baseline
    paths:
      - .github/workflows/codacy-public-api-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture Codacy settings and ignored baseline
        shell: bash
        run: |
          set -u
          mkdir -p codacy-probe
          base='https://app.codacy.com/api/v3'
          analysis="$base/analysis/organizations/gh/TheHighBrid/repositories/JobTomatik"
          repo="$base/organizations/gh/TheHighBrid/repositories/JobTomatik"
          security="$base/organizations/gh/TheHighBrid/security"

          get_json() {
            name="$1"; url="$2"
            code=$(curl -sS -L -o "codacy-probe/${name}.json" -w '%{http_code}' "$url" || true)
            printf '%s %s\n' "$name" "$code"
          }
          post_json() {
            name="$1"; url="$2"; body="$3"
            code=$(curl -sS -L -o "codacy-probe/${name}.json" -w '%{http_code}' \
              -X POST "$url" -H 'Content-Type: application/json' --data "$body" || true)
            printf '%s %s\n' "$name" "$code"
          }

          get_json tools "$analysis/tools"
          post_json overview "$analysis/issues/overview" '{}'
          get_json ignored-files "$repo/ignored-files?branch=main&limit=100"
          post_json ignored-issues "$analysis/ignoredIssues/search?limit=1000" '{}'
          get_json security-dashboard "$security/dashboard"
          post_json security-items "$security/items/search?limit=1000" '{"repositories":["JobTomatik"]}'

          for f in codacy-probe/*.json; do
            echo "===== $f ====="
            head -c 6000 "$f" || true
            echo
          done

      - name: Upload settings probe
        uses: actions/upload-artifact@v4
        with:
          name: codacy-settings-probe
          path: codacy-probe/
          if-no-files-found: error
          retention-days: 1
