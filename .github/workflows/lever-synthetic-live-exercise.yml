name: Lever synthetic live exercise

on:
  pull_request:
    paths:
      - "backend/app/services/ats_*.py"
      - "backend/app/services/form_filler*.py"
      - "backend/app/services/upload_handler.py"
      - "backend/app/services/lever_certification.py"
      - "backend/app/services/lever_pilot_ingestion.py"
      - "backend/scripts/certify_lever_live.py"
      - "backend/scripts/export_lever_phase_a_record.py"
      - "backend/tests/test_lever_phase_a_export.py"
      - ".github/workflows/lever-synthetic-live-exercise.yml"
  schedule:
    - cron: "41 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-full-form-dry-run:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./lever-synthetic-live.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: lever-synthetic-live-secret
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      LEVER_SUPERVISED_PILOT_ENABLED: "false"
      AUTOPILOT_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Exercise locked targets until one qualifying run is retained
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          corpus_dir = Path('evidence/lever-phase-a-target-corpus')
          baseline_path = Path('evidence/lever-phase-a-baseline.csv')
          attempts_dir = Path('lever-phase-a-attempts')
          attempts_dir.mkdir(parents=True, exist_ok=True)

          baseline_identities = set()
          with baseline_path.open(encoding='utf-8', newline='') as handle:
              for row in csv.DictReader(handle):
                  baseline_identities.add((row['site'].lower(), row['posting_id']))

          candidates = []
          for part in sorted(corpus_dir.glob('part-*.csv')):
              with part.open(encoding='utf-8', newline='') as handle:
                  for row in csv.DictReader(handle):
                      identity = (row['site'].lower(), row['posting_id'])
                      if row.get('viable') != 'True' or identity in baseline_identities:
                          continue
                      candidates.append(row)

          preferred_review_ids = [
              'D8-003',
              'D8-004',
              'D8-008',
              'D8-009',
              'D8-010',
              'D8-011',
              'D8-012',
              'D8-013',
              'D8-001',
              'D8-002',
          ]
          preference = {review_id: index for index, review_id in enumerate(preferred_review_ids)}
          candidates.sort(
              key=lambda row: (
                  preference.get(row['review_id'], len(preference)),
                  row['review_id'],
              )
          )

          attempts = []
          winner = None
          for row in candidates[:12]:
              review_id = row['review_id']
              report_path = attempts_dir / f'{review_id}.json'
              log_path = attempts_dir / f'{review_id}.log'
              profile_dir = attempts_dir / f'{review_id}-profile'
              handoff_dir = attempts_dir / f'{review_id}-handoffs'
              attempt_env = os.environ.copy()
              attempt_env.update({
                  'APPLICATION_BROWSER_PROFILE_DIR': str(profile_dir),
                  'HANDOFF_STORAGE_DIR': str(handoff_dir),
                  'ENABLE_RESUMABLE_HANDOFFS': 'false',
              })
              command = [
                  sys.executable,
                  '-u',
                  'scripts/certify_lever_live.py',
                  '--urls',
                  row['canonical_application_url'],
                  '--exercise',
                  '--synthetic-resume-path',
                  'lever-synthetic-resume.pdf',
                  '--report',
                  str(report_path),
              ]
              with log_path.open('w', encoding='utf-8') as log_handle:
                  completed = subprocess.run(
                      command,
                      stdout=log_handle,
                      stderr=subprocess.STDOUT,
                      check=False,
                      env=attempt_env,
                  )

              report = None
              if report_path.exists():
                  report = json.loads(report_path.read_text(encoding='utf-8'))
              inspections = [
                  item for item in (report or {}).get('reports') or []
                  if item.get('mode') == 'inspect'
              ]
              exercises = [
                  item for item in (report or {}).get('reports') or []
                  if item.get('mode') == 'exercise'
              ]
              qualifies = bool(
                  completed.returncode == 0
                  and report
                  and report.get('passed') is True
                  and report.get('final_submit_clicked') is False
                  and len(inspections) == 1
                  and inspections[0].get('passed') is True
                  and inspections[0].get('final_submit_clicked') is False
                  and len(exercises) == 1
                  and exercises[0].get('passed') is True
                  and exercises[0].get('certification_outcome') == 'ready_to_submit'
                  and exercises[0].get('adapter') == 'lever'
                  and exercises[0].get('final_submit_clicked') is False
              )
              attempts.append({
                  'review_id': review_id,
                  'employer': row['employer'],
                  'role': row['role'],
                  'site': row['site'],
                  'posting_id': row['posting_id'],
                  'region': row['region'],
                  'application_url': row['canonical_application_url'],
                  'return_code': completed.returncode,
                  'qualifies': qualifies,
                  'certification_outcome': (
                      exercises[0].get('certification_outcome')
                      if len(exercises) == 1
                      else None
                  ),
                  'final_submit_clicked': (report or {}).get('final_submit_clicked'),
                  'browser_profile_isolated': True,
              })

              subprocess.run(
                  ['pkill', '-f', f'--user-data-dir={profile_dir}'],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              shutil.rmtree(profile_dir, ignore_errors=True)

              if qualifies:
                  winner = row
                  shutil.copyfile(report_path, 'lever-synthetic-live.json')
                  Path('lever-synthetic-url.txt').write_text(
                      row['canonical_application_url'], encoding='utf-8'
                  )
                  Path('lever-synthetic-employer.txt').write_text(
                      row['employer'], encoding='utf-8'
                  )
                  Path('lever-synthetic-role.txt').write_text(
                      row['role'], encoding='utf-8'
                  )
                  break

          Path('lever-synthetic-run-metadata.json').write_text(
              json.dumps(
                  {
                      'selected': winner,
                      'attempts': attempts,
                      'locked_corpus_only': True,
                      'isolated_browser_profiles': True,
                      'final_submit_clicked': False,
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          if winner is None:
              raise SystemExit('No locked target produced a qualifying ready_to_submit dry run.')
          print(json.dumps({'selected': winner, 'attempts': attempts}, indent=2))
          PY

      - name: Assert qualifying full-form readiness without submission
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from app.config import get_settings

          report = json.load(open('lever-synthetic-live.json'))
          settings = get_settings()
          assert settings.allow_real_application_submit is False
          assert settings.lever_supervised_pilot_enabled is False
          assert os.environ.get('AUTOPILOT_ENABLED', '').lower() == 'false'
          assert report['final_submit_clicked'] is False
          assert report['passed'] is True
          inspections = [item for item in report['reports'] if item.get('mode') == 'inspect']
          exercises = [item for item in report['reports'] if item.get('mode') == 'exercise']
          assert len(inspections) == 1
          assert len(exercises) == 1
          assert inspections[0]['passed'] is True
          assert inspections[0]['adapter'] == 'lever'
          assert inspections[0]['final_submit_clicked'] is False
          assert exercises[0]['passed'] is True
          assert exercises[0]['adapter'] == 'lever'
          assert exercises[0]['certification_outcome'] == 'ready_to_submit'
          assert exercises[0]['final_submit_clicked'] is False
          assert exercises[0]['fields_filled'] > 0
          assert any(
              item.get('verification') == 'passed'
              for item in exercises[0].get('upload_evidence') or []
          )
          PY

      - name: Export reviewable Phase A candidate row
        shell: bash
        run: |
          python scripts/export_lever_phase_a_record.py \
            --report lever-synthetic-live.json \
            --output lever-phase-a-record.csv \
            --run-id "github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --operator "github-actions" \
            --source-reference "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --employer "$(cat lever-synthetic-employer.txt)" \
            --role "$(cat lever-synthetic-role.txt)"

      - name: Upload synthetic live certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lever-synthetic-live-report
          path: |
            backend/lever-synthetic-live.json
            backend/lever-synthetic-run-metadata.json
            backend/lever-phase-a-attempts/**
            backend/lever-synthetic-url.txt
            backend/lever-synthetic-employer.txt
            backend/lever-synthetic-role.txt
            backend/lever-synthetic-resume.pdf
            backend/lever-phase-a-record.csv
          if-no-files-found: warn
          retention-days: 30
