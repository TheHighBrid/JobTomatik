name: Finalize Lever Phase A corpus resweep

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/lever-phase-a-resweep-finalize.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: lever-phase-a-resweep-finalize
  cancel-in-progress: false

env:
  PYTHONPATH: .
  ORIGINAL_RUN_ID: "30871406281"
  ORIGINAL_HEAD_SHA: "ce5ed31448ffbf8a1e5a44ee1c4bd905186f808c"

jobs:
  recover-missing:
    if: github.head_ref == 'evidence/lever-phase-a-resweep-visible-challenge'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        review_id: [D8-011, D8-022]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out resweep branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Download original shard evidence
        uses: actions/download-artifact@v8
        with:
          pattern: lever-phase-a-resweep-shard-*-${{ env.ORIGINAL_HEAD_SHA }}
          path: /tmp/original-shards
          merge-multiple: false
          repository: ${{ github.repository }}
          run-id: ${{ env.ORIGINAL_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Stage and validate missing report
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          set -euo pipefail
          report="$(find /tmp/original-shards -type f -path "*/evidence/lever-phase-a-artifacts/${REVIEW_ID}/lever-phase-a-report.json" -print -quit)"
          resume="$(find /tmp/original-shards -type f -path "*/evidence/lever-phase-a-artifacts/${REVIEW_ID}/lever-phase-a-synthetic-resume.pdf" -print -quit)"
          [[ -n "$report" && -f "$report" ]]
          [[ -n "$resume" && -f "$resume" ]]

          destination="evidence/lever-phase-a-artifacts/${REVIEW_ID}"
          mkdir -p "$destination"
          cp "$report" "$destination/lever-phase-a-report.json"
          cp "$resume" "$destination/lever-phase-a-synthetic-resume.pdf"

          python scripts/finalize_lever_phase_a_ready.py \
            --validate-only \
            --review-id "$REVIEW_ID" \
            --report "$destination/lever-phase-a-report.json"

      - name: Build one-record retention manifest
        env:
          REVIEW_ID: ${{ matrix.review_id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          review_id = os.environ['REVIEW_ID']
          report = Path(
              f'evidence/lever-phase-a-artifacts/{review_id}/lever-phase-a-report.json'
          )
          manifest = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'commit_sha': os.environ['GITHUB_SHA'],
              'retained_record_count': 1,
              'report': {
                  'review_id': review_id,
                  'path': report.as_posix(),
                  'sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
              },
          }
          Path('lever-phase-a-ready-retention-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload independently retained ready evidence
        id: retained
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-ready-${{ matrix.review_id }}-${{ github.sha }}
          path: |
            backend/evidence/lever-phase-a-artifacts/${{ matrix.review_id }}/**
            backend/lever-phase-a-ready-retention-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Download and finalize official retained artifact
        env:
          REVIEW_ID: ${{ matrix.review_id }}
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
          ARTIFACT_DIGEST_OUTPUT: ${{ steps.retained.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest="${ARTIFACT_DIGEST_OUTPUT#sha256:}"
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"

          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" \
              > "/tmp/${REVIEW_ID}-metadata.json"; then
              break
            fi
            sleep $((attempt * 2))
          done

          for attempt in 1 2 3 4 5 6; do
            if curl -fL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/zip" \
              -o "/tmp/${REVIEW_ID}-artifact.zip"; then
              break
            fi
            sleep $((attempt * 2))
          done

          [[ -s "/tmp/${REVIEW_ID}-metadata.json" ]]
          [[ -s "/tmp/${REVIEW_ID}-artifact.zip" ]]
          echo "${digest}  /tmp/${REVIEW_ID}-artifact.zip" | sha256sum -c -

          python scripts/finalize_lever_phase_a_ready.py \
            --review-id "$REVIEW_ID" \
            --report "evidence/lever-phase-a-artifacts/${REVIEW_ID}/lever-phase-a-report.json" \
            --artifact-metadata "/tmp/${REVIEW_ID}-metadata.json" \
            --artifact-zip "/tmp/${REVIEW_ID}-artifact.zip" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$digest" \
            --operator github-actions

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          review_id = os.environ['REVIEW_ID']
          digest = os.environ['ARTIFACT_DIGEST_OUTPUT'].removeprefix('sha256:')
          report = Path(
              f'evidence/lever-phase-a-artifacts/{review_id}/lever-phase-a-report.json'
          )
          value = {
              'review_id': review_id,
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'artifact_id': os.environ['ARTIFACT_ID'],
              'artifact_digest': digest,
              'report_sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
              'final_submit_clicked': False,
          }
          Path(f'evidence/lever-phase-a-finalization-{review_id}.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Stage recovered finalized package
        env:
          REVIEW_ID: ${{ matrix.review_id }}
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
          ARTIFACT_DIGEST_OUTPUT: ${{ steps.retained.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          digest="${ARTIFACT_DIGEST_OUTPUT#sha256:}"
          stage="recovered-package/evidence"
          rm -rf recovered-package
          mkdir -p \
            "$stage/lever-phase-a-artifacts/${REVIEW_ID}" \
            "$stage/lever-phase-a-external-archives/${REVIEW_ID}"

          cp -a \
            "evidence/lever-phase-a-artifacts/${REVIEW_ID}/." \
            "$stage/lever-phase-a-artifacts/${REVIEW_ID}/"
          cp "evidence/lever-phase-a-candidate-${REVIEW_ID}.csv" "$stage/"
          cp "evidence/lever-phase-a-source-${REVIEW_ID}.csv" "$stage/"
          cp "evidence/lever-phase-a-finalization-${REVIEW_ID}.json" "$stage/"
          cp \
            "evidence/lever-phase-a-external-archives/${REVIEW_ID}/artifact-${ARTIFACT_ID}-${digest}.zip" \
            "$stage/lever-phase-a-external-archives/${REVIEW_ID}/"

      - name: Upload recovered finalized package
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-recovery-package-${{ matrix.review_id }}-${{ github.sha }}
          path: backend/recovered-package
          if-no-files-found: error
          retention-days: 30

  import-checkpoint:
    needs: recover-missing
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out resweep branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Download original resweep catalog
        uses: actions/download-artifact@v8
        with:
          name: lever-phase-a-resweep-catalog-${{ env.ORIGINAL_HEAD_SHA }}
          path: /tmp/original-catalog
          repository: ${{ github.repository }}
          run-id: ${{ env.ORIGINAL_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download original 17 finalized packages
        uses: actions/download-artifact@v8
        with:
          pattern: lever-phase-a-finalized-*-${{ env.ORIGINAL_HEAD_SHA }}
          path: /tmp/original-finalized
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.ORIGINAL_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download recovered finalized packages
        uses: actions/download-artifact@v8
        with:
          pattern: lever-phase-a-recovery-package-*-${{ github.sha }}
          path: /tmp/recovered-finalized
          merge-multiple: true

      - name: Import all 19 verified candidates and receipts
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          from app.services.lever_phase_a_operator import load_locked_target
          from app.services.lever_pilot_ingestion import load_phase_a_baseline
          from scripts.finalize_lever_phase_a_ready import validate_ready_report

          evidence = Path('evidence')
          corpus = evidence / 'lever-phase-a-target-corpus'
          baseline_path = evidence / 'lever-phase-a-baseline.csv'
          sources_path = evidence / 'lever-phase-a-sources.csv'

          catalog = json.loads(
              next(Path('/tmp/original-catalog').rglob('*.json')).read_text(
                  encoding='utf-8'
              )
          )
          review_ids = sorted(catalog.get('qualifying_review_ids') or [])
          assert len(review_ids) == 19, review_ids

          original = Path('/tmp/original-finalized/evidence')
          recovered = Path('/tmp/recovered-finalized/evidence')
          assert original.is_dir(), original
          assert recovered.is_dir(), recovered

          original_ids = {
              path.stem.removeprefix('lever-phase-a-finalization-')
              for path in original.glob('lever-phase-a-finalization-*.json')
          }
          recovered_ids = {
              path.stem.removeprefix('lever-phase-a-finalization-')
              for path in recovered.glob('lever-phase-a-finalization-*.json')
          }
          assert len(original_ids) == 17, sorted(original_ids)
          assert recovered_ids == {'D8-011', 'D8-022'}, recovered_ids
          assert original_ids | recovered_ids == set(review_ids)

          shutil.copytree(original, evidence, dirs_exist_ok=True)
          shutil.copytree(recovered, evidence, dirs_exist_ok=True)

          def read_rows(path: Path):
              with path.open(encoding='utf-8', newline='') as handle:
                  reader = csv.DictReader(handle)
                  return list(reader.fieldnames or []), [dict(row) for row in reader]

          def append_one(target: Path, incoming: Path, unique_fields: tuple[str, ...]):
              fields, existing = read_rows(target)
              incoming_fields, rows = read_rows(incoming)
              assert fields == incoming_fields, (target, fields, incoming_fields)
              assert len(rows) == 1, (incoming, len(rows))
              row = rows[0]
              for old in existing:
                  assert not all(
                      old.get(key) == row.get(key) for key in unique_fields
                  ), ('duplicate import', target, unique_fields, row)
              with target.open('a', encoding='utf-8', newline='') as handle:
                  csv.DictWriter(
                      handle,
                      fieldnames=fields,
                      lineterminator='\n',
                  ).writerow(row)
              return row

          before = load_phase_a_baseline(baseline_path)
          assert len(before) == 3
          assert sum(
              1 for row in before
              if row.get('qualifies_for_dry_run_matrix') is True
          ) == 1

          provenance = []
          imported_rows = []
          for review_id in review_ids:
              candidate_path = evidence / f'lever-phase-a-candidate-{review_id}.csv'
              source_path = evidence / f'lever-phase-a-source-{review_id}.csv'
              finalization_path = evidence / f'lever-phase-a-finalization-{review_id}.json'
              assert candidate_path.is_file(), candidate_path
              assert source_path.is_file(), source_path
              assert finalization_path.is_file(), finalization_path

              candidate = append_one(baseline_path, candidate_path, ('run_id',))
              source = append_one(
                  sources_path,
                  source_path,
                  ('workflow_run_id', 'artifact_id'),
              )
              finalization = json.loads(
                  finalization_path.read_text(encoding='utf-8')
              )

              assert finalization['review_id'] == review_id
              assert finalization['workflow_run_id'] == source['workflow_run_id']
              assert finalization['artifact_id'] == source['artifact_id']
              assert finalization['artifact_digest'] == source['artifact_digest']
              assert finalization['report_sha256'] == candidate['artifact_sha256']
              assert finalization['final_submit_clicked'] is False
              assert candidate['pre_submit_state'] == 'ready_to_submit'
              assert candidate['final_status'] == 'dry_run_passed'
              assert candidate['source_reference'].endswith(
                  '/' + source['workflow_run_id']
              )

              report_path = evidence / candidate['artifact_path']
              assert report_path.is_file(), report_path
              assert hashlib.sha256(report_path.read_bytes()).hexdigest() == (
                  candidate['artifact_sha256']
              )
              report = json.loads(report_path.read_text(encoding='utf-8'))
              target = load_locked_target(review_id, corpus)
              validate_ready_report(report, target)

              archive = (
                  evidence
                  / 'lever-phase-a-external-archives'
                  / review_id
                  / (
                      'artifact-'
                      + source['artifact_id']
                      + '-'
                      + source['artifact_digest']
                      + '.zip'
                  )
              )
              assert archive.is_file(), archive
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == (
                  source['artifact_digest']
              )

              provenance.append(finalization)
              imported_rows.append(candidate)

          after = load_phase_a_baseline(baseline_path)
          qualifying = [
              row for row in after
              if row.get('qualifies_for_dry_run_matrix') is True
          ]
          assert len(after) == 22, len(after)
          assert len(qualifying) == 20, len(qualifying)
          assert len({row['site'] for row in qualifying}) == 20
          assert not any(row.get('final_submit_clicked') for row in after)
          assert len({row['run_id'] for row in after}) == len(after)

          _, source_rows = read_rows(sources_path)
          assert len(source_rows) == 22
          assert len({
              (row['workflow_run_id'], row['artifact_id'])
              for row in source_rows
          }) == len(source_rows)

          summary = {
              'schema_version': '1.0',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'head_sha': os.environ['GITHUB_SHA'],
              'source_resweep_run_id': os.environ['ORIGINAL_RUN_ID'],
              'attempted_target_count': catalog['attempted_target_count'],
              'outcome_counts': catalog['outcome_counts'],
              'qualifying_count_before': 1,
              'qualifying_count_added': 19,
              'qualifying_count_after': 20,
              'retained_review_ids': review_ids,
              'retained_provenance': provenance,
              'safety': catalog['safety'],
              'results': catalog['results'],
          }
          (evidence / 'lever-phase-a-corpus-resweep-2026-08-04.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          for path in evidence.glob('lever-phase-a-finalization-*.json'):
              path.unlink()

          print(json.dumps({
              'baseline_record_count': len(after),
              'qualifying_dry_run_count': len(qualifying),
              'distinct_site_count': len({row['site'] for row in qualifying}),
              'imported_review_ids': review_ids,
              'final_submit_clicked': False,
          }, indent=2, sort_keys=True))
          PY

      - name: Regenerate readiness and campaign checkpoints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from app.services.lever_pilot_ingestion import render_readiness_markdown
          from app.services.lever_pilot_ledger_boundary import read_lever_pilot_readiness

          readiness = read_lever_pilot_readiness(
              baseline_path=Path('evidence/lever-phase-a-baseline.csv'),
              ledger_path=Path('evidence/.missing-phase-b-runtime.jsonl'),
          )
          Path('evidence/lever-pilot-readiness.json').write_text(
              json.dumps(readiness, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('evidence/lever-pilot-readiness.md').write_text(
              render_readiness_markdown(readiness),
              encoding='utf-8',
          )

          summary = readiness['summary']
          assert readiness['baseline_record_count'] == 22
          assert summary['record_count'] == 22
          assert summary['qualifying_dry_run_count'] == 20
          assert summary['distinct_site_count'] == 20
          assert set(summary['regions_covered']) == {'eu', 'global'}
          assert summary['manual_challenge_boundary_count'] == 2
          assert summary['nonqualifying_dry_run_count'] == 2
          assert summary['canonical_maturity'] == 'dry_run'
          assert summary['promotion_ready'] is False
          assert summary['duplicate_submission_count'] == 0
          assert summary['false_submitted_count'] == 0
          assert summary['phase_a_external_archive_failure_count'] == 0
          assert summary['phase_a_inspection_failure_count'] == 0
          assert summary['gates'][
              'all_qualifying_phase_a_records_have_durable_external_archives'
          ] is True
          assert summary['gates']['global_and_eu_hosts_covered'] is True
          assert summary['gates']['thirty_qualifying_dry_runs'] is False
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

          python scripts/evaluate_campaign_days_12_22.py \
            --lever evidence/lever-pilot-readiness.json \
            --output evidence/campaign-days-12-22.json

          python - <<'PY'
          import json
          from pathlib import Path

          checkpoint = json.loads(
              Path('evidence/campaign-days-12-22.json').read_text(encoding='utf-8')
          )
          day12 = next(
              item for item in checkpoint['checkpoints']
              if item['day'] == 12
          )
          assert day12['passed'] is True
          assert day12['facts']['qualifying_dry_runs'] == 20
          assert day12['facts']['distinct_sites'] == 20
          assert checkpoint['safety']['final_submit_clicked'] is False
          assert checkpoint['safety']['maturity_promoted'] is False
          print(json.dumps(day12, indent=2, sort_keys=True))
          PY

      - name: Certify regenerated evidence boundary
        run: |
          python scripts/certify_lever_pilot_readiness.py \
            --baseline evidence/lever-phase-a-baseline.csv \
            --ledger evidence/.missing-phase-b-runtime.jsonl \
            --json-output /tmp/lever-resweep-certification.json \
            --markdown-output /tmp/lever-resweep-certification.md

          pytest -q --tb=short -ra \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_readiness_hardening.py \
            tests/test_lever_pilot_certification.py \
            tests/test_lever_phase_a_ready_provenance.py

          git diff --check

      - name: Commit canonical 20-run checkpoint
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f "$GITHUB_WORKSPACE/.github/workflows/lever-phase-a-resweep-finalize.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Retain Lever Phase A 20-run checkpoint"
          git push origin "HEAD:${HEAD_BRANCH}"
