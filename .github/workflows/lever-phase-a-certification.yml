name: Lever Phase A evidence certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/services/lever_pilot_ingestion.py"
      - "backend/app/services/lever_pilot_ledger_boundary.py"
      - "backend/scripts/certify_lever_pilot_readiness.py"
      - "backend/scripts/export_lever_phase_a_record.py"
      - "backend/tests/test_lever_phase_a_export.py"
      - "backend/tests/test_lever_phase_a_readiness_validation.py"
      - "backend/tests/test_lever_pilot_certification.py"
      - "frontend/src/supervisedPlatforms.js"
      - "frontend/test/supervised-platforms.test.js"
      - ".github/workflows/lever-phase-a-certification.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/services/lever_pilot_ingestion.py"
      - "backend/app/services/lever_pilot_ledger_boundary.py"
      - "backend/scripts/certify_lever_pilot_readiness.py"
      - "backend/scripts/export_lever_phase_a_record.py"
      - "backend/tests/test_lever_phase_a_export.py"
      - "backend/tests/test_lever_phase_a_readiness_validation.py"
      - "backend/tests/test_lever_pilot_certification.py"
      - "frontend/src/supervisedPlatforms.js"
      - "frontend/test/supervised-platforms.test.js"
      - ".github/workflows/lever-phase-a-certification.yml"

permissions:
  contents: read

jobs:
  phase-a-evidence-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./lever-phase-a-certification.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: lever-phase-a-certification-secret
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      LEVER_SUPERVISED_PILOT_ENABLED: "false"
      AUTOPILOT_ENABLED: "false"
      ENABLE_RESUMABLE_HANDOFFS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Compile Phase A evidence tooling
        working-directory: backend
        run: |
          python -m py_compile \
            scripts/certify_lever_pilot_readiness.py \
            scripts/export_lever_phase_a_record.py \
            app/services/lever_pilot_ingestion.py \
            app/services/lever_pilot_ledger_boundary.py

      - name: Run Phase A evidence regression suite
        working-directory: backend
        run: |
          pytest -q --tb=short -ra \
            tests/test_lever_phase_a_export.py \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_pilot_certification.py \
            --junitxml=lever-phase-a-pytest.xml

      - name: Certify empty evidence remains zero and fail-safe
        working-directory: backend
        run: |
          mkdir -p evidence-ci
          python scripts/certify_lever_pilot_readiness.py \
            --baseline evidence-ci/missing-phase-a.csv \
            --ledger evidence-ci/missing-phase-b.jsonl \
            --json-output evidence-ci/lever-pilot-certification.json \
            --markdown-output evidence-ci/lever-pilot-certification.md

      - name: Assert Phase A cannot enable live execution or promote maturity
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          import os
          from app.config import get_settings

          settings = get_settings()
          report = json.load(open('evidence-ci/lever-pilot-certification.json'))
          summary = report['readiness']['summary']
          assert settings.allow_real_application_submit is False
          assert settings.lever_supervised_pilot_enabled is False
          assert os.environ.get('AUTOPILOT_ENABLED', '').lower() == 'false'
          assert settings.enable_resumable_handoffs is False
          assert report['passed'] is True
          assert report['safety']['browser_opened'] is False
          assert report['safety']['approval_issued'] is False
          assert report['safety']['submission_queued'] is False
          assert report['safety']['final_submit_clicked'] is False
          assert report['safety']['maturity_promoted'] is False
          assert summary['canonical_maturity'] == 'dry_run'
          assert summary['qualifying_dry_run_count'] == 0
          assert summary['supervised_confirmed_count'] == 0
          assert summary['promotion_ready'] is False
          PY

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test platform-neutral supervised UI contract
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Upload Phase A certification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-certification
          path: |
            backend/lever-phase-a-pytest.xml
            backend/evidence-ci/lever-pilot-certification.json
            backend/evidence-ci/lever-pilot-certification.md
          if-no-files-found: error
          retention-days: 30
