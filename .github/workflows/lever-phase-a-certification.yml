name: Lever Phase A evidence certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/services/campaign_day_gates.py"
      - "backend/app/services/lever_phase_a_evidence.py"
      - "backend/app/services/lever_pilot_ingestion.py"
      - "backend/app/services/lever_pilot_ledger_boundary.py"
      - "backend/app/services/lever_readiness_hardening.py"
      - "backend/scripts/certify_lever_pilot_readiness.py"
      - "backend/scripts/evaluate_campaign_days_12_22.py"
      - "backend/scripts/export_lever_phase_a_record.py"
      - "backend/evidence/campaign-days-12-22.json"
      - "backend/evidence/greenhouse-phase-a-readiness.json"
      - "backend/evidence/lever-phase-a-baseline.csv"
      - "backend/evidence/lever-phase-a-sources.csv"
      - "backend/evidence/lever-phase-a-supersessions.json"
      - "backend/evidence/lever-phase-a-artifacts/**"
      - "backend/evidence/lever-phase-a-corpus-sweep-*.json"
      - "backend/evidence/lever-phase-a-corpus-sweep-*.md"
      - "backend/evidence/lever-phase-b-launch.json"
      - "backend/evidence/lever-phase-b-dossiers/**"
      - "backend/evidence/lever-pilot-readiness.json"
      - "backend/evidence/lever-pilot-readiness.md"
      - "backend/tests/test_lever_phase_a_export.py"
      - "backend/tests/test_lever_phase_a_readiness_validation.py"
      - "backend/tests/test_lever_readiness_hardening.py"
      - "backend/tests/test_lever_pilot_certification.py"
      - "frontend/src/supervisedPlatforms.js"
      - "frontend/test/supervised-platforms.test.js"
      - "docs/operations/lever-controlled-pilot-evidence.md"
      - ".github/workflows/lever-phase-a-certification.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/services/campaign_day_gates.py"
      - "backend/app/services/lever_phase_a_evidence.py"
      - "backend/app/services/lever_pilot_ingestion.py"
      - "backend/app/services/lever_pilot_ledger_boundary.py"
      - "backend/app/services/lever_readiness_hardening.py"
      - "backend/scripts/certify_lever_pilot_readiness.py"
      - "backend/scripts/evaluate_campaign_days_12_22.py"
      - "backend/scripts/export_lever_phase_a_record.py"
      - "backend/evidence/campaign-days-12-22.json"
      - "backend/evidence/greenhouse-phase-a-readiness.json"
      - "backend/evidence/lever-phase-a-baseline.csv"
      - "backend/evidence/lever-phase-a-sources.csv"
      - "backend/evidence/lever-phase-a-supersessions.json"
      - "backend/evidence/lever-phase-a-artifacts/**"
      - "backend/evidence/lever-phase-a-corpus-sweep-*.json"
      - "backend/evidence/lever-phase-a-corpus-sweep-*.md"
      - "backend/evidence/lever-phase-b-launch.json"
      - "backend/evidence/lever-phase-b-dossiers/**"
      - "backend/evidence/lever-pilot-readiness.json"
      - "backend/evidence/lever-pilot-readiness.md"
      - "backend/tests/test_lever_phase_a_export.py"
      - "backend/tests/test_lever_phase_a_readiness_validation.py"
      - "backend/tests/test_lever_readiness_hardening.py"
      - "backend/tests/test_lever_pilot_certification.py"
      - "frontend/src/supervisedPlatforms.js"
      - "frontend/test/supervised-platforms.test.js"
      - "docs/operations/lever-controlled-pilot-evidence.md"
      - ".github/workflows/lever-phase-a-certification.yml"

permissions:
  contents: read

jobs:
  phase-a-evidence-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./lever-phase-a-certification.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: lever-phase-a-certification-secret
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      LEVER_SUPERVISED_PILOT_ENABLED: "false"
      AUTOPILOT_ENABLED: "false"
      ENABLE_RESUMABLE_HANDOFFS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Compile Phase A evidence tooling
        working-directory: backend
        run: |
          python -m py_compile \
            scripts/certify_lever_pilot_readiness.py \
            scripts/evaluate_campaign_days_12_22.py \
            scripts/export_lever_phase_a_record.py \
            app/services/campaign_day_gates.py \
            app/services/lever_pilot_ingestion.py \
            app/services/lever_pilot_ledger_boundary.py \
            app/services/lever_readiness_hardening.py

      - name: Run Phase A evidence regression suite
        working-directory: backend
        run: |
          pytest -q --tb=short -ra \
            tests/test_lever_phase_a_export.py \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_readiness_hardening.py \
            tests/test_lever_pilot_certification.py \
            --junitxml=lever-phase-a-pytest.xml

      - name: Verify committed Phase A evidence and provenance
        working-directory: backend
        run: |
          mkdir -p evidence-ci
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          from app.services.lever_phase_a_archive import verify_phase_a_external_archive
          from app.services.lever_pilot_ingestion import (
              load_phase_a_baseline,
              render_readiness_markdown,
          )
          from app.services.lever_pilot_ledger_boundary import read_lever_pilot_readiness

          baseline_path = Path('evidence/lever-phase-a-baseline.csv')
          sources_path = Path('evidence/lever-phase-a-sources.csv')
          supersessions_path = Path('evidence/lever-phase-a-supersessions.json')
          readiness_json_path = Path('evidence/lever-pilot-readiness.json')
          readiness_markdown_path = Path('evidence/lever-pilot-readiness.md')
          missing_runtime_ledger = Path('evidence-ci/missing-phase-b.jsonl')

          records = load_phase_a_baseline(baseline_path)
          assert records, 'At least one retained Lever Phase A record is required.'
          assert all(record['mode'] == 'dry_run' for record in records)
          assert all(record['final_submit_clicked'] is False for record in records)
          assert all(record['synthetic_profile'] is True for record in records)

          with sources_path.open(encoding='utf-8', newline='') as handle:
              sources = list(csv.DictReader(handle))
          assert sources, 'Lever Phase A provenance cannot be empty.'
          assert all(int(row['retained_record_count']) == 1 for row in sources)
          assert len({row['artifact_id'] for row in sources}) == len(sources)
          assert len(
              {(row['workflow_run_id'], row['artifact_id']) for row in sources}
          ) == len(sources)
          assert all(row['workflow_run_id'].isdigit() for row in sources)
          assert all(row['artifact_id'].isdigit() for row in sources)
          assert all(re.fullmatch(r'[0-9a-f]{64}', row['artifact_digest']) for row in sources)

          supersession = json.loads(supersessions_path.read_text(encoding='utf-8'))
          superseded = supersession.get('superseded')
          superseded_records = [superseded] if isinstance(superseded, dict) else []
          assert supersession['safety']['historical_boundary_preserved'] is True
          assert supersession['safety']['quota_credit_counted_once'] is True
          assert len(sources) == len(records) + len(superseded_records)

          source_run_ids = {row['workflow_run_id'] for row in sources}
          for record in [*records, *superseded_records]:
              match = re.fullmatch(
                  r'https://github\.com/TheHighBrid/JobTomatik/actions/runs/(\d+)',
                  record['source_reference'],
              )
              assert match, record['source_reference']
              assert match.group(1) in source_run_ids

          for record in records:
              archive = verify_phase_a_external_archive(
                  record,
                  baseline_path=baseline_path,
              )
              assert archive['verified'] is True, archive

          readiness = read_lever_pilot_readiness(
              baseline_path=baseline_path,
              ledger_path=missing_runtime_ledger,
          )
          committed_json = json.loads(readiness_json_path.read_text(encoding='utf-8'))
          committed_markdown = readiness_markdown_path.read_text(encoding='utf-8')
          assert readiness == committed_json
          assert render_readiness_markdown(readiness) == committed_markdown

          summary = readiness['summary']
          assert readiness['baseline_record_count'] == len(records)
          assert readiness['runtime_record_count'] == 0
          qualifying = sum(
              1 for record in records if record['qualifies_for_dry_run_matrix'] is True
          )
          assert summary['qualifying_dry_run_count'] == qualifying
          assert summary['manual_challenge_boundary_count'] == summary[
              'manual_challenge_encounter_count'
          ]
          assert summary['manual_challenge_violation_count'] == 0
          assert summary['gates']['all_manual_challenges_remain_needs_review'] is True
          assert summary['nonqualifying_dry_run_count'] == len(records) - qualifying
          assert summary['phase_a_inspection_failure_count'] == 0
          assert summary['supervised_confirmed_count'] == 0
          assert summary['canonical_maturity'] == 'dry_run'
          assert summary['supervised_pilot_evidence_complete'] is False
          assert summary['promotion_ready'] is False
          assert summary['gates']['thirty_qualifying_dry_runs'] is False
          assert summary['gates']['explicit_separate_promotion_approval'] is False

          Path('evidence-ci/lever-pilot-readiness.json').write_text(
              json.dumps(readiness, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('evidence-ci/lever-pilot-readiness.md').write_text(
              render_readiness_markdown(readiness),
              encoding='utf-8',
          )
          PY

      - name: Regenerate locked readiness and campaign checkpoint artifacts
        working-directory: backend
        run: |
          python scripts/evaluate_campaign_days_12_22.py \
            --lever evidence-ci/lever-pilot-readiness.json \
            --output evidence-ci/campaign-days-12-22.json
          cmp evidence/lever-pilot-readiness.json evidence-ci/lever-pilot-readiness.json
          cmp evidence/lever-pilot-readiness.md evidence-ci/lever-pilot-readiness.md
          cmp evidence/campaign-days-12-22.json evidence-ci/campaign-days-12-22.json

      - name: Certify retained evidence without threshold claims
        working-directory: backend
        run: |
          python scripts/certify_lever_pilot_readiness.py \
            --baseline evidence/lever-phase-a-baseline.csv \
            --ledger evidence-ci/missing-phase-b.jsonl \
            --json-output evidence-ci/lever-pilot-certification.json \
            --markdown-output evidence-ci/lever-pilot-certification.md

      - name: Assert evidence cannot enable live execution or promote maturity
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          import os
          from app.config import get_settings

          settings = get_settings()
          report = json.load(open('evidence-ci/lever-pilot-certification.json'))
          summary = report['readiness']['summary']
          assert settings.allow_real_application_submit is False
          assert settings.lever_supervised_pilot_enabled is False
          assert os.environ.get('AUTOPILOT_ENABLED', '').lower() == 'false'
          assert settings.enable_resumable_handoffs is False
          assert report['passed'] is True
          assert report['safety']['browser_opened'] is False
          assert report['safety']['network_contacted'] is False
          assert report['safety']['approval_issued'] is False
          assert report['safety']['submission_queued'] is False
          assert report['safety']['final_submit_clicked'] is False
          assert report['safety']['maturity_promoted'] is False
          assert summary['canonical_maturity'] == 'dry_run'
          assert summary['qualifying_dry_run_count'] >= 0
          assert summary['manual_challenge_boundary_count'] == summary[
              'manual_challenge_encounter_count'
          ]
          assert summary['manual_challenge_violation_count'] == 0
          assert summary['gates']['all_manual_challenges_remain_needs_review'] is True
          assert summary['phase_a_inspection_failure_count'] == 0
          assert summary['supervised_confirmed_count'] == 0
          assert summary['promotion_ready'] is False
          PY

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test platform-neutral supervised UI contract
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Upload Phase A certification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-a-certification
          path: |
            backend/lever-phase-a-pytest.xml
            backend/evidence-ci/lever-pilot-readiness.json
            backend/evidence-ci/lever-pilot-readiness.md
            backend/evidence-ci/campaign-days-12-22.json
            backend/evidence-ci/lever-pilot-certification.json
            backend/evidence-ci/lever-pilot-certification.md
            backend/evidence/lever-phase-a-corpus-sweep-2026-07-31.json
            backend/evidence/lever-phase-a-corpus-sweep-2026-07-31.md
          if-no-files-found: error
          retention-days: 30
