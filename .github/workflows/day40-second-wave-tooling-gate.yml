name: Day 40 second-wave tooling gate

on:
  pull_request:
    paths:
      - '.github/workflows/day40-second-wave-tooling-gate.yml'
      - 'backend/app/services/day40_second_wave.py'
      - 'backend/tests/test_day40_second_wave.py'
      - 'docs/operations/DAY_40_SECOND_WAVE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  second-wave-contract:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./day40-second-wave.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: day40-second-wave-ci-only-secret-key
      AI_PROVIDER: template
      DEV_MOCK_JOBS: 'false'
      ALLOW_REAL_APPLICATION_SUBMIT: 'false'
      ALLOW_REAL_FOLLOWUP_SEND: 'false'
      AUTOPILOT_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt
      - name: Compile Day 40 tooling
        run: python -m compileall -q app/services/day40_second_wave.py tests/test_day40_second_wave.py
      - name: Run Day 40 contract tests
        run: pytest -q --tb=short -ra tests/test_day40_second_wave.py
      - name: Prove CI cannot claim a real second wave
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              'tooling_ready': True,
              'real_second_wave_claimed': False,
              'day40_complete': False,
              'day41_entry_eligible': False,
              'maximum_attempt_cap': 2,
              'real_submission_enabled': False,
              'real_followup_send_enabled': False,
              'requires_real_day39_first_wave': True,
              'requires_separate_owner_second_wave_authorization': True,
              'requires_post_wave_zero_duplicates': True,
              'requires_post_wave_zero_false_submitted_status': True,
          }
          Path('day40-second-wave-tooling-readiness.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, sort_keys=True))
          assert payload['real_second_wave_claimed'] is False
          assert payload['day40_complete'] is False
          assert payload['day41_entry_eligible'] is False
          assert payload['real_submission_enabled'] is False
          PY
      - name: Upload tooling readiness
        uses: actions/upload-artifact@v7
        with:
          name: day40-second-wave-tooling-readiness
          path: backend/day40-second-wave-tooling-readiness.json
          if-no-files-found: error
          retention-days: 30
