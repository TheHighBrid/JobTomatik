name: Align v2 backend release identity once

on:
  push:
    branches:
      - codex/v2-release-docs-prep

permissions:
  contents: write

jobs:
  align-backend-release-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          ref: codex/v2-release-docs-prep
          fetch-depth: 1

      - name: Patch backend release identity with assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          release_version = (root / 'VERSION').read_text(encoding='utf-8').strip()
          if release_version != '2.0.0':
              raise SystemExit(f'unexpected release version: {release_version!r}')

          version_path = root / 'backend/app/version.py'
          version_path.write_text(
              '"""Backend product release identity.\n\n'
              'Keep this value aligned with the repository root VERSION file. CI enforces\n'
              'that contract so containerized backend builds do not need files outside the\n'
              'backend build context.\n'
              '"""\n\n'
              f'APP_VERSION = {release_version!r}\n',
              encoding='utf-8',
          )

          main_path = root / 'backend/app/main.py'
          main = main_path.read_text(encoding='utf-8')
          import_anchor = 'from app.config import get_settings\n'
          import_replacement = import_anchor + 'from app.version import APP_VERSION\n'
          if main.count(import_anchor) != 1:
              raise SystemExit('expected exactly one app.config import anchor')
          if 'from app.version import APP_VERSION' not in main:
              main = main.replace(import_anchor, import_replacement, 1)

          if main.count('version="1.0.0"') != 1:
              raise SystemExit('expected exactly one FastAPI 1.0.0 version literal')
          main = main.replace('version="1.0.0"', 'version=APP_VERSION', 1)

          response_literal = '"version": "1.0.0"'
          if main.count(response_literal) != 2:
              raise SystemExit(
                  f'expected exactly two health/readiness version literals, found {main.count(response_literal)}'
              )
          main = main.replace(response_literal, '"version": APP_VERSION')

          if 'version="1.0.0"' in main or response_literal in main:
              raise SystemExit('stale backend product version literal remains in app/main.py')
          main_path.write_text(main, encoding='utf-8')

          contract_path = root / 'backend/tests/test_runtime_maintenance_contract.py'
          contract = contract_path.read_text(encoding='utf-8')
          import_anchor = 'from app.auth import hash_password, verify_password\n'
          import_replacement = import_anchor + 'from app.version import APP_VERSION\n'
          if contract.count(import_anchor) != 1:
              raise SystemExit('expected release-maintenance import anchor once')
          if 'from app.version import APP_VERSION' not in contract:
              contract = contract.replace(import_anchor, import_replacement, 1)
          assert_anchor = '    assert web_version == "2.0.0"\n'
          if contract.count(assert_anchor) != 1:
              raise SystemExit('expected root VERSION assertion once')
          contract = contract.replace(
              assert_anchor,
              assert_anchor + '    assert APP_VERSION == web_version\n',
              1,
          )
          contract_path.write_text(contract, encoding='utf-8')

          termux_path = root / 'ANDROID_TERMUX_SETUP.md'
          termux = termux_path.read_text(encoding='utf-8')
          old_health = '{"status":"ok","service":"JobTomatik API","version":"1.0.0"}'
          new_health = f'{{"status":"ok","service":"JobTomatik API","version":"{release_version}"}}'
          if termux.count(old_health) != 1:
              raise SystemExit('expected one stale Termux health-version example')
          termux = termux.replace(old_health, new_health, 1)
          termux_path.write_text(termux, encoding='utf-8')

          print(f'BACKEND_RELEASE_IDENTITY_ALIGNED={release_version}')
          PY

      - name: Remove one-shot workflow and commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v2-align-backend-release-version-once.yml
          git add backend/app/version.py backend/app/main.py backend/tests/test_runtime_maintenance_contract.py ANDROID_TERMUX_SETUP.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align backend API identity with v2 candidate'
          git push origin HEAD:codex/v2-release-docs-prep
