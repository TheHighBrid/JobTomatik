name: Observe Lever Day 13 retention run

on:
  push:
    branches:
      - agent/day13-run-observer

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out observer branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Read Day 13 workflow runs and jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs_api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent%2Flever-day13-text-evidence&event=push&per_page=100"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$runs_api" > /tmp/runs.json

          mkdir -p backend/evidence/diagnostics
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen

          payload = json.loads(Path('/tmp/runs.json').read_text(encoding='utf-8'))
          matches = [
              run for run in payload.get('workflow_runs', [])
              if run.get('path') == '.github/workflows/lever-day13-retention.yml'
          ]
          token = os.environ['GH_TOKEN']
          for run in matches:
              request = Request(
                  run['jobs_url'],
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urlopen(request, timeout=30) as response:
                  jobs = json.load(response).get('jobs', [])
              run['jobs'] = [
                  {
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'steps': [
                          {
                              'name': step.get('name'),
                              'status': step.get('status'),
                              'conclusion': step.get('conclusion'),
                          }
                          for step in job.get('steps', [])
                      ],
                  }
                  for job in jobs
              ]

          output = {
              'schema_version': '1.0',
              'target_branch': 'agent/lever-day13-text-evidence',
              'workflow_path': '.github/workflows/lever-day13-retention.yml',
              'matching_run_count': len(matches),
              'runs': matches,
          }
          Path('backend/evidence/diagnostics/lever-day13-run-observation.json').write_text(
              json.dumps(output, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(output, indent=2, sort_keys=True))
          PY

      - name: Commit observation and remove observer workflow
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git rm .github/workflows/observe-lever-day13.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/evidence/diagnostics/lever-day13-run-observation.json
          git commit -m "Record Lever Day 13 workflow observation"
          git push origin "HEAD:${HEAD_BRANCH}"
