name: Codacy wave 4 issue probe

on:
  push:
    branches:
      - codex/codacy-wave4-probe
    paths:
      - .github/workflows/codacy-wave4-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enumerate remaining Security Error findings
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST             'https://app.codacy.com/api/v3/analysis/organizations/gh/TheHighBrid/repositories/JobTomatik/issues/search?limit=1000'             -H 'Accept: application/json'             -H 'Content-Type: application/json'             -d '{"levels":["Error"],"categories":["Security"]}' > /tmp/codacy.json

          python - <<'PY'
          import collections
          import json
          from pathlib import Path

          treated = {
              "backend/app/config.py",
              "backend/app/schemas/application.py",
              "backend/app/schemas/handoff.py",
              "backend/app/schemas/user.py",
              "backend/app/services/ashby_readiness.py",
              "backend/app/services/ats_greenhouse.py",
              "backend/app/services/ats_smartrecruiters.py",
              "backend/app/services/browser_runtime_base.py",
              "backend/app/services/day41_database_restore.py",
              "backend/app/services/handoff_session.py",
              "backend/app/services/job_scraper.py",
              "backend/app/services/lever_phase_a_provenance.py",
              "backend/app/services/supervised_runtime_mode.py",
              "backend/scripts/lever_supervised_pilot_runtime.py",
              "backend/scripts/repair_final_submit_review.py",
              "backend/scripts/run_day41_previous_release_compatibility.py",
              "frontend/src/api/client.js",
          }

          payload = json.loads(Path("/tmp/codacy.json").read_text())
          rows = []
          for issue in payload.get("data", []):
              path = issue.get("filePath")
              if path in treated:
                  continue
              rows.append({
                  "issueId": issue.get("issueId") or issue.get("id"),
                  "filePath": path,
                  "lineNumber": issue.get("lineNumber"),
                  "patternId": (issue.get("patternInfo") or {}).get("id"),
                  "tool": (issue.get("toolInfo") or {}).get("name"),
                  "message": issue.get("message"),
              })

          counts = collections.Counter(row["filePath"] for row in rows)
          print("TOTAL_SECURITY_ERROR", (payload.get("pagination") or {}).get("total"))
          print("REMAINING_ROWS", len(rows))
          print("PATH_COUNTS")
          for path, count in sorted(counts.items(), key=lambda item: (-item[1], item[0] or "")):
              print(count, path)
          print("ROWS")
          print(json.dumps(sorted(rows, key=lambda x: (x["filePath"] or "", x["lineNumber"] or -1, x["patternId"] or "")), indent=2))
          PY
