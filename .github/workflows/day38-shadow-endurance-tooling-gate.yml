name: Day 38 shadow endurance tooling gate

on:
  pull_request:
    paths:
      - "backend/app/services/day38_shadow_admission.py"
      - "backend/app/services/day38_runtime.py"
      - "backend/app/services/day38_shadow_endurance.py"
      - "backend/scripts/export_day38_shadow_endurance.py"
      - "backend/app/api/__init__.py"
      - "backend/app/api/shadow_runs.py"
      - "backend/app/models/certification.py"
      - "backend/app/celery_app.py"
      - "backend/app/services/full_stack_shadow.py"
      - "backend/app/services/day37_shadow_admission.py"
      - "backend/app/services/day37_shadow_endurance.py"
      - "backend/app/services/day36_shadow_endurance.py"
      - "backend/app/services/day36_endurance_runtime.py"
      - "backend/tests/test_day38_shadow_admission.py"
      - "backend/tests/test_day38_runtime.py"
      - "backend/tests/test_day38_shadow_endurance.py"
      - "backend/tests/test_day38_exporter_cli.py"
      - "backend/tests/test_android_shadow_preflight_truth.py"
      - "backend/tests/test_android_shadow_launch_admission.py"
      - "backend/tests/test_shadow_evidence_provenance.py"
      - "backend/tests/test_full_stack_shadow.py"
      - "backend/evidence/day35-unattended-pilot-configuration.json"
      - "docs/roadmaps/JOBTOMATIK_AUTONOMY_42_DAY_PLAN.md"
      - "docs/operations/DAY_38_TWENTY_FOUR_HOUR_SHADOW_ENDURANCE.md"
      - ".github/workflows/day38-shadow-endurance-tooling-gate.yml"
      - "backend/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: sqlite:///./day38-shadow-endurance-tooling.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: day38-shadow-endurance-ci-only-secret-000000000000
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  ALLOW_REAL_FOLLOWUP_SEND: "false"
  AUTOPILOT_ENABLED: "false"
  AUTOMATION_GLOBAL_KILL_SWITCH: "false"
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  day38-endurance-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"

      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r backend/requirements.txt

      - name: Compile Day 38 surfaces
        working-directory: backend
        run: |
          python -m compileall -q \
            app/services/day38_shadow_admission.py \
            app/services/day38_runtime.py \
            app/services/day38_shadow_endurance.py \
            app/services/day37_shadow_admission.py \
            app/services/day37_shadow_endurance.py \
            app/services/day36_shadow_endurance.py \
            app/services/day36_endurance_runtime.py \
            app/services/full_stack_shadow.py \
            app/models/certification.py \
            app/api/__init__.py \
            app/api/shadow_runs.py \
            app/celery_app.py \
            scripts/export_day38_shadow_endurance.py

      - name: Smoke-test standalone Day 38 exporter CLI
        working-directory: backend
        run: env -u PYTHONPATH python scripts/export_day38_shadow_endurance.py --help >/dev/null

      - name: Run Day 38 and inherited shadow regressions
        working-directory: backend
        run: |
          pytest -q --tb=short -ra \
            tests/test_day38_shadow_admission.py \
            tests/test_day38_runtime.py \
            tests/test_day38_shadow_endurance.py \
            tests/test_day38_exporter_cli.py \
            tests/test_day37_shadow_admission.py \
            tests/test_day37_shadow_preflight.py \
            tests/test_day37_shadow_endurance.py \
            tests/test_day36_shadow_endurance.py \
            tests/test_shadow_evidence_provenance.py \
            tests/test_full_stack_shadow.py \
            tests/test_android_shadow_launch_admission.py \
            tests/test_android_shadow_preflight_truth.py \
            --junitxml=day38-shadow-endurance-tooling-junit.xml

      - name: Verify canonical safety
        run: bash scripts/verify.sh safety

      - name: Record tooling readiness without claiming a twenty-four-hour run
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": "1.0",
              "verification_commit": os.environ["SOURCE_COMMIT"],
              "tooling_ready": True,
              "real_twenty_four_hour_run_claimed": False,
              "day38_complete": False,
              "day39_entry_eligible": False,
              "contract": {
                  "exact_duration_seconds": 86400,
                  "persisted_elapsed_time_required": True,
                  "continuous_cycle_coverage_required": True,
                  "stable_worker_process_identity_required": True,
                  "memory_telemetry_required": True,
                  "browser_cleanup_reconciliation_required": True,
                  "notification_quality_required": True,
                  "verified_day37_predecessor_required": True,
                  "strict_day37_revalidation_required": True,
                  "production_policy_diagnostic_required_every_completed_cycle": True,
                  "production_policy_diagnostic_must_be_non_authoritative": True,
                  "shadow_execution_profile_must_remain_shadow_test": True,
                  "quiet_hours_transition_required_when_configured": True,
                  "rolling_24h_window_rollover_required": True,
                  "rolling_24h_policy_observation_minimum_seconds": 82800,
                  "rolling_capacity_semantics": "rolling_previous_24_hours",
                  "cap_threshold_crossing_not_required": True,
                  "zero_duplicate_tasks_required": True,
                  "zero_false_status_required": True,
                  "zero_runaway_retry_required": True,
                  "zero_unexplained_records_required": True,
                  "zero_policy_escape_required": True,
                  "real_submission_must_remain_disabled": True,
                  "real_followup_send_must_remain_disabled": True,
                  "adapter_maturity_must_remain_dry_run": True,
                  "exporter_cannot_start_advance_repair_or_review_session": True,
              },
              "next_required_evidence": (
                  "A completed physical-runtime shadow_run_24h session with at least "
                  "86,400 persisted elapsed seconds, complete diagnostic production-policy "
                  "telemetry, observed quiet-hour transition and real rolling-24-hour "
                  "membership rollover, and all strict Day 38 checks exported by "
                  "scripts/export_day38_shadow_endurance.py"
              ),
          }
          Path("day38-shadow-endurance-tooling-gate.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Assert CI did not counterfeit Day 38 completion
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          import os

          gate = json.load(open("day38-shadow-endurance-tooling-gate.json", encoding="utf-8"))
          assert gate["verification_commit"] == os.environ["SOURCE_COMMIT"]
          assert gate["tooling_ready"] is True
          assert gate["real_twenty_four_hour_run_claimed"] is False
          assert gate["day38_complete"] is False
          assert gate["day39_entry_eligible"] is False
          contract = gate["contract"]
          assert contract["exact_duration_seconds"] == 86400
          assert contract["persisted_elapsed_time_required"] is True
          assert contract["continuous_cycle_coverage_required"] is True
          assert contract["stable_worker_process_identity_required"] is True
          assert contract["verified_day37_predecessor_required"] is True
          assert contract["strict_day37_revalidation_required"] is True
          assert contract["production_policy_diagnostic_required_every_completed_cycle"] is True
          assert contract["production_policy_diagnostic_must_be_non_authoritative"] is True
          assert contract["shadow_execution_profile_must_remain_shadow_test"] is True
          assert contract["quiet_hours_transition_required_when_configured"] is True
          assert contract["rolling_24h_window_rollover_required"] is True
          assert contract["rolling_24h_policy_observation_minimum_seconds"] == 82800
          assert contract["rolling_capacity_semantics"] == "rolling_previous_24_hours"
          assert contract["cap_threshold_crossing_not_required"] is True
          assert contract["real_submission_must_remain_disabled"] is True
          assert contract["real_followup_send_must_remain_disabled"] is True
          assert contract["adapter_maturity_must_remain_dry_run"] is True
          PY

      - name: Upload Day 38 tooling evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day38-shadow-endurance-tooling-gate
          path: |
            backend/day38-shadow-endurance-tooling-gate.json
            backend/day38-shadow-endurance-tooling-junit.xml
          if-no-files-found: error
          retention-days: 30
