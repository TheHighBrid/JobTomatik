name: Materialize recovery artifact name

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/materialize-recovery-artifact-name.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'evidence/lever-phase-a-resweep-visible-challenge'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Use canonical recovered artifact names
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/lever-phase-a-resweep-recovery.yml')
          source = path.read_text(encoding='utf-8')
          old = 'lever-phase-a-ready-recovered-'
          new = 'lever-phase-a-ready-'
          assert source.count(old) == 1
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check

      - name: Commit fix and remove materializer
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-recovery-artifact-name.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use canonical names for recovered Lever artifacts"
          git push origin "HEAD:${HEAD_BRANCH}"
