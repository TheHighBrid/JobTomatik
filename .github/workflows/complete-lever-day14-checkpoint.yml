name: Complete Lever Day 14 checkpoint

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .github/workflows/complete-lever-day14-checkpoint.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-lever-day14-checkpoint
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PYTHONPATH: .
  DATABASE_URL: sqlite:///./lever-day14-cleanup.db
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: lever-day14-cleanup-secret
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
  LEVER_SUPERVISED_PILOT_ENABLED: "false"
  AUTOPILOT_ENABLED: "false"
  ENABLE_RESUMABLE_HANDOFFS: "false"

jobs:
  complete-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out immutable cleanup commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and browser dependencies
        run: |
          python -m pip install -q --disable-pip-version-check \
            -r backend/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Refuse stale cleanup
        run: |
          remote_sha="$(git ls-remote origin refs/heads/fix/complete-lever-day14-checkpoint | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA" || {
            echo "Branch advanced from $SOURCE_SHA to $remote_sha; refusing stale cleanup." >&2
            exit 1
          }

      - name: Download and verify the ten finalized packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import shutil
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath

          repository = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          token = os.environ['GH_TOKEN']
          run_id = 30880573048
          source_sha = '1de9181e710ede2bc8700dbb667f4dfea50726ea'
          expected_ids = {
              'D8-004', 'D8-009', 'D8-010', 'D8-016', 'D8-018',
              'D8-020', 'D8-030', 'D8-034', 'D8-036', 'D8-040',
          }

          def request_bytes(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'JobTomatik-Day14-Cleanup',
                  },
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  return response.read()

          payload = json.loads(request_bytes(
              f'{api}/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100'
          ))
          suffix = f'-{source_sha}'
          artifacts = []
          for artifact in payload.get('artifacts') or []:
              name = str(artifact.get('name') or '')
              prefix = 'lever-phase-a-day14-package-'
              if not name.startswith(prefix) or not name.endswith(suffix):
                  continue
              review_id = name[len(prefix):-len(suffix)]
              if review_id in expected_ids:
                  artifacts.append((review_id, artifact))
          found_ids = {review_id for review_id, _ in artifacts}
          assert found_ids == expected_ids, (sorted(found_ids), sorted(expected_ids))
          assert len(artifacts) == 10, len(artifacts)

          output = Path('/tmp/day14-packages')
          shutil.rmtree(output, ignore_errors=True)
          (output / 'evidence').mkdir(parents=True)
          receipt = {
              'schema_version': '1.0',
              'source_run_id': run_id,
              'source_sha': source_sha,
              'artifacts': [],
          }

          for review_id, artifact in sorted(artifacts):
              artifact_id = int(artifact['id'])
              expected_digest = str(artifact.get('digest') or '')
              if expected_digest.startswith('sha256:'):
                  expected_digest = expected_digest.split(':', 1)[1]
              assert len(expected_digest) == 64, (review_id, expected_digest)
              archive = request_bytes(
                  f'{api}/repos/{repository}/actions/artifacts/{artifact_id}/zip'
              )
              actual_digest = hashlib.sha256(archive).hexdigest()
              assert actual_digest == expected_digest, (
                  review_id, expected_digest, actual_digest
              )

              extract_root = Path('/tmp/day14-artifact-extract') / review_id
              shutil.rmtree(extract_root, ignore_errors=True)
              extract_root.mkdir(parents=True)
              with zipfile.ZipFile(io.BytesIO(archive)) as package:
                  for info in package.infolist():
                      member = PurePosixPath(info.filename)
                      assert not member.is_absolute(), info.filename
                      assert '..' not in member.parts, info.filename
                  package.extractall(extract_root)

              candidates = [
                  extract_root / 'evidence',
                  extract_root / 'day14-package' / 'evidence',
                  extract_root / 'backend' / 'day14-package' / 'evidence',
              ]
              evidence_dir = next(
                  (path for path in candidates if path.is_dir()), None
              )
              if evidence_dir is None:
                  matches = list(extract_root.rglob('lever-phase-a-candidate-' + review_id + '.csv'))
                  assert len(matches) == 1, (review_id, matches)
                  evidence_dir = matches[0].parent
              shutil.copytree(
                  evidence_dir,
                  output / 'evidence',
                  dirs_exist_ok=True,
              )
              receipt['artifacts'].append({
                  'review_id': review_id,
                  'artifact_id': artifact_id,
                  'artifact_digest': expected_digest,
                  'name': artifact['name'],
              })

          candidate_ids = {
              path.stem.removeprefix('lever-phase-a-candidate-')
              for path in (output / 'evidence').glob(
                  'lever-phase-a-candidate-D8-*.csv'
              )
          }
          assert candidate_ids == expected_ids, sorted(candidate_ids)
          Path('/tmp/day14-package-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Apply the audited absolute-root correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/scripts/import_lever_day14_packages.py')
          text = path.read_text(encoding='utf-8')
          old = '''            "historical_archive": archive_path.relative_to(
                evidence_root
            ).as_posix(),
'''
          new = '''            "historical_archive": archive_path.relative_to(
                evidence_root.resolve()
            ).as_posix(),
'''
          count = text.count(old)
          assert count == 1, count
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile backend/scripts/import_lever_day14_packages.py
          git diff --check

      - name: Import the finalized packages without reopening applications
        working-directory: backend
        run: |
          python scripts/import_lever_day14_packages.py \
            --package-root /tmp/day14-packages \
            --evidence-root evidence \
            --request evidence/lever-phase-a-day14-request.json

      - name: Regenerate and verify the final campaign checkpoint
        working-directory: backend
        run: |
          python scripts/evaluate_campaign_days_12_22.py \
            --lever evidence/lever-pilot-readiness.json \
            --output evidence/campaign-days-12-22.json
          python scripts/verify_lever_phase_a_checkpoint.py \
            --evidence-root evidence \
            --output-root evidence-ci
          python scripts/certify_lever_pilot_readiness.py \
            --baseline evidence/lever-phase-a-baseline.csv \
            --ledger evidence/.missing-phase-b-runtime.jsonl \
            --json-output /tmp/lever-day14-certification.json \
            --markdown-output /tmp/lever-day14-certification.md
          python - <<'PY'
          import json
          from pathlib import Path

          readiness = json.loads(
              Path('evidence/lever-pilot-readiness.json').read_text()
          )
          checkpoint = json.loads(
              Path('evidence/campaign-days-12-22.json').read_text()
          )
          verification = json.loads(
              Path('evidence-ci/lever-phase-a-checkpoint-verification.json').read_text()
          )
          summary = readiness['summary']
          day14 = next(
              item for item in checkpoint['checkpoints'] if item['day'] == 14
          )
          assert summary['qualifying_dry_run_count'] == 30
          assert summary['distinct_site_count'] == 30
          assert summary['record_count'] == 31
          assert summary['manual_challenge_boundary_count'] == 1
          assert summary['phase_a_external_archive_failure_count'] == 0
          assert summary['phase_a_inspection_failure_count'] == 0
          assert summary['duplicate_submission_count'] == 0
          assert summary['false_submitted_count'] == 0
          assert summary['canonical_maturity'] == 'dry_run'
          assert summary['promotion_ready'] is False
          assert summary['gates']['thirty_qualifying_dry_runs'] is True
          assert summary['gates']['thirty_distinct_lever_sites'] is True
          assert summary['gates']['explicit_separate_promotion_approval'] is False
          assert day14['passed'] is True
          assert verification['phase_a_target_reached'] is True
          assert verification['day14_supersession']['replacement_count'] == 8
          assert verification['day14_supersession']['addition_count'] == 2
          assert verification['day14_supersession']['quota_credit_counted_once'] is True
          assert verification['safety']['final_submit_clicked'] is False
          assert checkpoint['safety']['final_submit_clicked'] is False
          assert checkpoint['safety']['maturity_promoted'] is False
          print('FINAL CHECKPOINT VERIFIED: 30 QUALIFIERS, 30 SITES')
          PY

      - name: Run focused archive, evidence, and freeze regressions
        working-directory: backend
        env:
          REQUIRE_BROWSER_TESTS: "1"
        run: |
          python -m compileall -q app scripts tests
          pytest -q --tb=short -ra \
            tests/test_text_control_evidence.py \
            tests/test_lever_control_evidence_integrity.py \
            tests/test_lever_synthetic_certification.py \
            tests/test_lever_phase_a_title_compat.py \
            tests/test_lever_phase_a_ready_provenance.py \
            tests/test_lever_phase_a_multi_archive.py \
            tests/test_lever_phase_a_ready_archive.py \
            tests/test_lever_phase_a_readiness_validation.py \
            tests/test_lever_phase_a_checkpoint_progression.py \
            tests/test_lever_readiness_hardening.py \
            tests/test_lever_pilot_certification.py \
            tests/test_campaign_day_gates.py \
            tests/test_certification_regressions.py \
            tests/test_form_filler_anonymous_controls.py
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('..').resolve()
          freeze = json.loads(
              (root / 'docs/operations/lever-phase-2-measurement-freeze.json').read_text()
          )
          assert freeze['contract_version'] == '2026-08-04.day14.1'
          for path, expected in freeze['locked_input_blobs'].items():
              actual = subprocess.check_output(
                  ['git', 'hash-object', path], cwd=root, text=True
              ).strip()
              assert actual == expected, (path, expected, actual)
          print('FINAL LOCKED BLOBS VERIFIED')
          PY
          git diff --check

      - name: Commit the clean final checkpoint
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/fix/complete-lever-day14-checkpoint | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA" || {
            echo "Branch advanced before commit; refusing stale push." >&2
            exit 1
          }
          rm -f \
            .github/workflows/lever-day14-final-dry-run.yml \
            .github/workflows/recover-lever-day14-import.yml \
            .github/workflows/complete-lever-day14-checkpoint.yml \
            backend/scripts/import_lever_day14_packages.py \
            backend/evidence/lever-phase-a-day14-run-status.json
          rm -rf backend/evidence-ci backend/.lever-day14-staged-evidence
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit -m "Complete Lever Phase A 30-run dry-run checkpoint"
          remote_sha="$(git ls-remote origin refs/heads/fix/complete-lever-day14-checkpoint | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA" || {
            echo "Branch advanced before push; refusing stale commit." >&2
            exit 1
          }
          git push origin HEAD:fix/complete-lever-day14-checkpoint
