name: Lever Phase B candidate review gate

on:
  pull_request:
    paths:
      - "backend/evidence/lever-phase-b-candidate-review-2026-08-28.json"
      - "backend/tests/test_lever_phase_b_candidate_review.py"
      - ".github/workflows/lever-phase-b-candidate-review-gate.yml"

permissions:
  contents: read

jobs:
  validate-review-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate candidate review queue
        run: python -m pytest -q tests/test_lever_phase_b_candidate_review.py
