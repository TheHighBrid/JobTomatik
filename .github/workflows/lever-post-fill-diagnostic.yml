name: Lever post-fill diagnostic

on:
  pull_request:
    paths:
      - "backend/tests/test_aaa_operator_completion_diagnostic.py"
      - ".github/workflows/lever-post-fill-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: sqlite:///./lever-post-fill-diagnostic.db
  REDIS_URL: redis://localhost:6379/1
  SECRET_KEY: lever-post-fill-diagnostic-secret-2026
  AI_PROVIDER: template
  DEV_MOCK_JOBS: "false"
  ALLOW_REAL_APPLICATION_SUBMIT: "false"
  ALLOW_REAL_FOLLOWUP_SEND: "false"
  AUTOPILOT_ENABLED: "false"
  ENABLE_RESUMABLE_HANDOFFS: "false"
  GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
  LEVER_SUPERVISED_PILOT_ENABLED: "false"
  REQUIRE_BROWSER_TESTS: "1"
  JOBTOMATIK_RUNTIME_ROLE: worker

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Print post-fill boundary diagnostic
        run: python -m pytest -q --tb=short -s tests/test_aaa_operator_completion_diagnostic.py
