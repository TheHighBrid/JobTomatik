name: Codacy Wave 6 RNG verification

on:
  push:
    branches:
      - codex/codacy-wave6-job-scraper-rng
    paths:
      - .github/workflows/codacy-wave6-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/codacy-wave6-job-scraper-rng
      - name: Validate secure mock RNG migration
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/app/services/job_scraper.py
          python -m pip install -q bandit
          bandit -q -t B311 backend/app/services/job_scraper.py
          if grep -nE '^import random$|\brandom\.(choice|randint|random|randrange)\b' backend/app/services/job_scraper.py; then
            echo 'weak stdlib random usage remains' >&2
            exit 1
          fi
          python - <<'PY'
          import secrets
          rng = secrets.SystemRandom()
          assert 55 <= rng.randint(55, 85) <= 85
          assert rng.choice(("a", "b")) in {"a", "b"}
          PY
