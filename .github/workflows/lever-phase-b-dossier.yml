name: Lever Phase B dossier certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/api/supervised_pilot_roster.py"
      - "backend/app/schemas/supervised_pilot_dossier.py"
      - "backend/app/services/supervised_pilot_dossier.py"
      - "backend/app/services/lever_pilot_ingestion.py"
      - "backend/app/services/lever_pilot_ledger_boundary.py"
      - "backend/tests/test_supervised_pilot_dossier.py"
      - "backend/tests/test_lever_supervised_pilot_dossier.py"
      - "frontend/src/components/SupervisedPilotDossierPanel.jsx"
      - "frontend/src/components/SupervisedSubmissionPanel.jsx"
      - "frontend/src/supervisedPlatforms.js"
      - ".github/workflows/lever-phase-b-dossier.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/api/supervised_pilot_roster.py"
      - "backend/app/schemas/supervised_pilot_dossier.py"
      - "backend/app/services/supervised_pilot_dossier.py"
      - "backend/app/services/lever_pilot_ingestion.py"
      - "backend/app/services/lever_pilot_ledger_boundary.py"
      - "backend/tests/test_supervised_pilot_dossier.py"
      - "backend/tests/test_lever_supervised_pilot_dossier.py"
      - "frontend/src/components/SupervisedPilotDossierPanel.jsx"
      - "frontend/src/components/SupervisedSubmissionPanel.jsx"
      - "frontend/src/supervisedPlatforms.js"
      - ".github/workflows/lever-phase-b-dossier.yml"

permissions:
  contents: read

jobs:
  phase-b-read-only-dossier:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./lever-phase-b-dossier.db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: lever-phase-b-dossier-secret
      AI_PROVIDER: template
      DEV_MOCK_JOBS: "false"
      ALLOW_REAL_APPLICATION_SUBMIT: "false"
      GREENHOUSE_SUPERVISED_PILOT_ENABLED: "false"
      LEVER_SUPERVISED_PILOT_ENABLED: "false"
      AUTOPILOT_ENABLED: "false"
      ENABLE_RESUMABLE_HANDOFFS: "false"
      LEVER_PILOT_BASELINE_PATH: evidence-ci/missing-lever-phase-a.csv
      LEVER_PILOT_LEDGER_PATH: evidence-ci/missing-lever-phase-b.jsonl
      LEVER_PILOT_READINESS_JSON_PATH: evidence-ci/lever-pilot-readiness.json
      LEVER_PILOT_READINESS_MARKDOWN_PATH: evidence-ci/lever-pilot-readiness.md

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Compile platform-neutral dossier boundary
        working-directory: backend
        run: |
          python -m py_compile \
            app/api/supervised_pilot_roster.py \
            app/schemas/supervised_pilot_dossier.py \
            app/services/supervised_pilot_dossier.py \
            app/services/lever_pilot_ingestion.py \
            app/services/lever_pilot_ledger_boundary.py

      - name: Run Greenhouse and Lever dossier regressions
        working-directory: backend
        run: |
          pytest -q --tb=short -ra \
            tests/test_supervised_pilot_dossier.py \
            tests/test_lever_supervised_pilot_dossier.py \
            tests/test_lever_pilot_ingestion.py \
            tests/test_lever_runtime_ledger_core_boundary.py \
            --junitxml=lever-phase-b-dossier-pytest.xml

      - name: Assert dossier is read-only and execution remains disabled
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from app.config import get_settings
          from app.services.supervised_pilot_dossier import (
              MANDATORY_STOP_REASONS,
              SUPPORTED_DOSSIER_PLATFORMS,
          )

          settings = get_settings()
          assert settings.allow_real_application_submit is False
          assert settings.greenhouse_supervised_pilot_enabled is False
          assert settings.lever_supervised_pilot_enabled is False
          assert os.environ.get('AUTOPILOT_ENABLED', '').lower() == 'false'
          assert settings.enable_resumable_handoffs is False
          assert SUPPORTED_DOSSIER_PLATFORMS == {'greenhouse', 'lever'}
          assert 'captcha_detected' in MANDATORY_STOP_REASONS
          assert 'identity_verification_required' in MANDATORY_STOP_REASONS
          PY

      - name: Assert dossier interface exposes no approval or submit action
        run: |
          ! grep -E "queueSupervisedSubmission|createSupervisedSubmissionApproval|submitApplication" frontend/src/components/SupervisedPilotDossierPanel.jsx
          grep -q "const platformName = platform === 'lever' ? 'Lever' : 'Greenhouse'" frontend/src/components/SupervisedPilotDossierPanel.jsx
          grep -q "{platformName} Phase B candidate dossier" frontend/src/components/SupervisedPilotDossierPanel.jsx
          grep -q "direct_submit_action_in_dossier" backend/app/services/supervised_pilot_dossier.py
          grep -q '"read_only": True' backend/app/services/supervised_pilot_dossier.py

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build platform-neutral dossier interface
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload Phase B dossier regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lever-phase-b-dossier-certification
          path: backend/lever-phase-b-dossier-pytest.xml
          if-no-files-found: error
          retention-days: 30
