name: Android frontend native recovery

on:
  pull_request:
    paths:
      - "backend/scripts/jobtomatik_termux_wrapper.sh"
      - "backend/scripts/repair_android_frontend_native_deps.py"
      - "backend/tests/test_android_frontend_native_recovery.py"
      - "frontend/package-lock.json"
      - ".github/workflows/android-frontend-native-recovery.yml"
  push:
    branches:
      - main
    paths:
      - "backend/scripts/jobtomatik_termux_wrapper.sh"
      - "backend/scripts/repair_android_frontend_native_deps.py"
      - "backend/tests/test_android_frontend_native_recovery.py"
      - "frontend/package-lock.json"
      - ".github/workflows/android-frontend-native-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-frontend-native-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover-locked-native-binding:
    name: recover-locked-native-binding (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            node_arch: x64
            native_package: lightningcss-linux-x64-gnu
          - runner: ubuntu-24.04-arm
            node_arch: arm64
            native_package: lightningcss-linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
      NATIVE_PACKAGE: ${{ matrix.native_package }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate runner architecture and Android recovery scripts
        run: |
          actual_arch="$(node -p 'process.arch')"
          echo "RUNNER_NODE_ARCH=$actual_arch"
          echo "EXPECTED_NODE_ARCH=$EXPECTED_NODE_ARCH"
          echo "NATIVE_PACKAGE=$NATIVE_PACKAGE"
          test "$actual_arch" = "$EXPECTED_NODE_ARCH"
          bash -n backend/scripts/jobtomatik_termux_wrapper.sh
          python -m py_compile backend/scripts/repair_android_frontend_native_deps.py

      - name: Install frontend dependencies in CI only
        run: npm ci --prefix frontend --include=optional --no-audit --no-fund

      - name: Prove architecture-native Lightning CSS works before fault injection
        working-directory: frontend
        run: |
          node -e "require('lightningcss'); console.log('LIGHTNINGCSS_BASELINE_READY platform=' + process.platform + ' arch=' + process.arch)"
          test -d "node_modules/$NATIVE_PACKAGE"

      - name: Delete only the architecture-native Lightning CSS binding
        run: |
          rm -rf "frontend/node_modules/$NATIVE_PACKAGE"
          test ! -e "frontend/node_modules/$NATIVE_PACKAGE"
          if (cd frontend && node -e "require('lightningcss')" >/dev/null 2>&1); then
            echo "Fault injection did not break Lightning CSS as expected for $NATIVE_PACKAGE." >&2
            exit 1
          fi
          echo "ANDROID_FRONTEND_NATIVE_BINDING_FAULT_REPRODUCED package=$NATIVE_PACKAGE arch=$EXPECTED_NODE_ARCH"

      - name: Repair complete host-native toolchain from package lock
        run: python backend/scripts/repair_android_frontend_native_deps.py

      - name: Prove repaired native toolchain and production frontend build
        working-directory: frontend
        run: |
          test -d "node_modules/$NATIVE_PACKAGE"
          node -e "require('lightningcss'); require('rolldown'); require('@tailwindcss/oxide'); console.log('ANDROID_FRONTEND_NATIVE_TOOLCHAIN_RECOVERED platform=' + process.platform + ' arch=' + process.arch)"
          npm run build
          echo "ANDROID_FRONTEND_NATIVE_RECOVERY_ACCEPTED package=$NATIVE_PACKAGE arch=$EXPECTED_NODE_ARCH"

  android-node-target-contract:
    name: android-node-target-contract (android-arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Prove CI host differs from Android Node target
        run: |
          test "$(node -p 'process.platform')" = "linux"
          test "$(node -p 'process.arch')" = "arm64"
          echo "CI_HOST_NODE_TARGET=linux-arm64"
          echo "PHYSICAL_ANDROID_NODE_TARGET=android-arm64"

      - name: Remove every Android ARM64 native package before recovery
        run: |
          rm -rf frontend/node_modules/lightningcss-android-arm64
          rm -rf frontend/node_modules/vite/node_modules/lightningcss-android-arm64
          rm -rf frontend/node_modules/@rolldown/binding-android-arm64
          rm -rf frontend/node_modules/@tailwindcss/oxide-android-arm64

      - name: Repair lockfile-pinned Android ARM64 native toolchain
        env:
          JOBTOMATIK_FRONTEND_NODE_PLATFORM: android
          JOBTOMATIK_FRONTEND_NODE_ARCH: arm64
        run: |
          python backend/scripts/repair_android_frontend_native_deps.py | tee /tmp/android-native-repair.log
          grep -Fq 'ANDROID_FRONTEND_NODE_TARGET platform=android arch=arm64 packages=lightningcss-android-arm64,@rolldown/binding-android-arm64,@tailwindcss/oxide-android-arm64' /tmp/android-native-repair.log

      - name: Verify every locked Android package contains native code
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          frontend = Path("frontend")
          lock = json.loads((frontend / "package-lock.json").read_text(encoding="utf-8"))
          package_names = (
              "lightningcss-android-arm64",
              "@rolldown/binding-android-arm64",
              "@tailwindcss/oxide-android-arm64",
          )
          checked = 0
          for package_name in package_names:
              suffix = f"node_modules/{package_name}"
              keys = [
                  key
                  for key in lock.get("packages", {})
                  if str(key).endswith(suffix)
              ]
              if not keys:
                  raise SystemExit(f"No lock entries found for {package_name}")
              for key in keys:
                  package = frontend / key
                  metadata = json.loads((package / "package.json").read_text(encoding="utf-8"))
                  if metadata.get("name") != package_name:
                      raise SystemExit(f"Wrong package identity at {key}")
                  native_files = list(package.rglob("*.node"))
                  if not native_files:
                      raise SystemExit(f"No native binary found at {package}")
                  if package_name == "lightningcss-android-arm64":
                      expected = package / "lightningcss.android-arm64.node"
                      if not expected.is_file() or expected.stat().st_size <= 0:
                          raise SystemExit(f"Missing exact Android Lightning CSS binary at {expected}")
                  for native_file in native_files:
                      if native_file.stat().st_size <= 0:
                          raise SystemExit(f"Empty native binary at {native_file}")
                  checked += 1
                  print(
                      "ANDROID_LOCKED_NATIVE_PACKAGE_VERIFIED "
                      f"package={package_name} path={key} "
                      f"native={','.join(path.name for path in native_files)}"
                  )
          if checked < 4:
              raise SystemExit(f"Expected at least four Android native lock entries, got {checked}")
          PY
          echo "ANDROID_NODE_TARGET_RECOVERY_ACCEPTED platform=android arch=arm64"
