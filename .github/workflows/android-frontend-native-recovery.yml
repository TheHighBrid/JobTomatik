name: Android frontend native recovery

on:
  pull_request:
    paths:
      - "backend/scripts/jobtomatik_termux_wrapper.sh"
      - "backend/scripts/repair_android_frontend_native_deps.py"
      - "backend/scripts/stage_android_frontend_native_bindings.py"
      - "backend/tests/test_android_frontend_native_recovery.py"
      - "backend/tests/test_android_frontend_native_integrity_receipt.py"
      - "backend/tests/test_android_frontend_native_linker_stage.py"
      - "frontend/package-lock.json"
      - ".github/workflows/android-frontend-native-recovery.yml"
  push:
    branches:
      - main
    paths:
      - "backend/scripts/jobtomatik_termux_wrapper.sh"
      - "backend/scripts/repair_android_frontend_native_deps.py"
      - "backend/scripts/stage_android_frontend_native_bindings.py"
      - "backend/tests/test_android_frontend_native_recovery.py"
      - "backend/tests/test_android_frontend_native_integrity_receipt.py"
      - "backend/tests/test_android_frontend_native_linker_stage.py"
      - "frontend/package-lock.json"
      - ".github/workflows/android-frontend-native-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-frontend-native-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover-locked-native-binding:
    name: recover-locked-native-binding (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            node_arch: x64
            native_package: lightningcss-linux-x64-gnu
          - runner: ubuntu-24.04-arm
            node_arch: arm64
            native_package: lightningcss-linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
      NATIVE_PACKAGE: ${{ matrix.native_package }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate runner architecture and Android recovery scripts
        run: |
          actual_arch="$(node -p 'process.arch')"
          echo "RUNNER_NODE_ARCH=$actual_arch"
          echo "EXPECTED_NODE_ARCH=$EXPECTED_NODE_ARCH"
          echo "NATIVE_PACKAGE=$NATIVE_PACKAGE"
          test "$actual_arch" = "$EXPECTED_NODE_ARCH"
          bash -n backend/scripts/jobtomatik_termux_wrapper.sh
          python -m py_compile backend/scripts/repair_android_frontend_native_deps.py
          python -m py_compile backend/scripts/stage_android_frontend_native_bindings.py

      - name: Install frontend dependencies in CI only
        run: npm ci --prefix frontend --include=optional --no-audit --no-fund

      - name: Prove architecture-native frontend toolchain works before fault injection
        working-directory: frontend
        run: |
          node -e "require('lightningcss'); require('rolldown'); require('@tailwindcss/oxide'); console.log('NATIVE_TOOLCHAIN_BASELINE_READY platform=' + process.platform + ' arch=' + process.arch)"
          test -d "node_modules/$NATIVE_PACKAGE"

      - name: Delete only the architecture-native Lightning CSS binding
        run: |
          rm -rf "frontend/node_modules/$NATIVE_PACKAGE"
          test ! -e "frontend/node_modules/$NATIVE_PACKAGE"
          if (cd frontend && node -e "require('lightningcss')" >/dev/null 2>&1); then
            echo "Fault injection did not break Lightning CSS as expected for $NATIVE_PACKAGE." >&2
            exit 1
          fi
          echo "ANDROID_FRONTEND_NATIVE_BINDING_FAULT_REPRODUCED package=$NATIVE_PACKAGE arch=$EXPECTED_NODE_ARCH"

      - name: Repair complete host-native toolchain from package lock
        run: python backend/scripts/repair_android_frontend_native_deps.py

      - name: Prove repaired native toolchain and production frontend build
        working-directory: frontend
        run: |
          node -e "require('lightningcss'); require('rolldown'); require('@tailwindcss/oxide'); console.log('ANDROID_FRONTEND_NATIVE_TOOLCHAIN_RECOVERED platform=' + process.platform + ' arch=' + process.arch)"
          npm run build
          echo "ANDROID_FRONTEND_NATIVE_RECOVERY_ACCEPTED package=$NATIVE_PACKAGE arch=$EXPECTED_NODE_ARCH"

  android-node-target-contract:
    name: android-node-target-contract (android-arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      JOBTOMATIK_ANDROID_NATIVE_STAGE_ROOT: /tmp/jobtomatik-android-native-stage

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Prove CI host differs from Android Node target
        run: |
          test "$(node -p 'process.platform')" = "linux"
          test "$(node -p 'process.arch')" = "arm64"
          echo "CI_HOST_NODE_TARGET=linux-arm64"
          echo "PHYSICAL_ANDROID_NODE_TARGET=android-arm64"
          echo "ANDROID_LINKER_STAGE_ROOT=$JOBTOMATIK_ANDROID_NATIVE_STAGE_ROOT"

      - name: Remove every Android ARM64 native package before recovery
        run: |
          rm -rf frontend/node_modules/lightningcss-android-arm64
          rm -rf frontend/node_modules/vite/node_modules/lightningcss-android-arm64
          rm -rf frontend/node_modules/@rolldown/binding-android-arm64
          rm -rf frontend/node_modules/@tailwindcss/oxide-android-arm64
          rm -f frontend/node_modules/.jobtomatik-android-native-integrity.json
          rm -rf "$JOBTOMATIK_ANDROID_NATIVE_STAGE_ROOT"

      - name: Repair lockfile-pinned Android ARM64 native toolchain without loading it
        env:
          JOBTOMATIK_FRONTEND_NODE_PLATFORM: android
          JOBTOMATIK_FRONTEND_NODE_ARCH: arm64
        run: |
          python backend/scripts/repair_android_frontend_native_deps.py | tee /tmp/android-native-repair.log
          grep -Fq 'ANDROID_FRONTEND_NODE_TARGET platform=android arch=arm64 native_load_validation=deferred_android_managed_frontend packages=lightningcss-android-arm64,@rolldown/binding-android-arm64,@tailwindcss/oxide-android-arm64' /tmp/android-native-repair.log
          grep -Fq 'ANDROID_FRONTEND_NATIVE_INTEGRITY_RECEIPT_READY' /tmp/android-native-repair.log

      - name: Stage verified Android packages into linker-safe runtime path
        run: |
          python backend/scripts/stage_android_frontend_native_bindings.py | tee /tmp/android-native-stage.log
          grep -Fq 'ANDROID_FRONTEND_NATIVE_LINKER_STAGE_ROOT_READY' /tmp/android-native-stage.log
          test "$(grep -c 'ANDROID_FRONTEND_NATIVE_LINKER_STAGE_READY' /tmp/android-native-stage.log)" -eq 4

      - name: Prove a second repair preserves linker-safe symlinks
        env:
          JOBTOMATIK_FRONTEND_NODE_PLATFORM: android
          JOBTOMATIK_FRONTEND_NODE_ARCH: arm64
        run: |
          python backend/scripts/repair_android_frontend_native_deps.py | tee /tmp/android-native-repair-reuse.log
          test "$(grep -c 'source=existing_verified' /tmp/android-native-repair-reuse.log)" -eq 4
          python backend/scripts/stage_android_frontend_native_bindings.py | tee /tmp/android-native-stage-reuse.log
          test "$(grep -c 'ANDROID_FRONTEND_NATIVE_LINKER_STAGE_READY' /tmp/android-native-stage-reuse.log)" -eq 4

      - name: Verify lockfile receipt, symlink targets, and exact Android binaries
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          frontend = Path("frontend")
          stage_root = Path(os.environ["JOBTOMATIK_ANDROID_NATIVE_STAGE_ROOT"]).resolve()
          lock = json.loads((frontend / "package-lock.json").read_text(encoding="utf-8"))
          packages = lock.get("packages", {})
          receipt_path = frontend / "node_modules/.jobtomatik-android-native-integrity.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("version") != 1 or not isinstance(receipt.get("entries"), dict):
              raise SystemExit("Android native integrity receipt is missing or malformed")
          receipt_entries = receipt["entries"]
          expected_binaries = {
              "lightningcss-android-arm64": "lightningcss.android-arm64.node",
              "@rolldown/binding-android-arm64": "rolldown-binding.android-arm64.node",
              "@tailwindcss/oxide-android-arm64": "tailwindcss-oxide.android-arm64.node",
          }
          checked = 0
          for package_name, binary_name in expected_binaries.items():
              suffix = f"node_modules/{package_name}"
              keys = [key for key in packages if str(key).endswith(suffix)]
              if not keys:
                  raise SystemExit(f"No lock entries found for {package_name}")
              for key in keys:
                  package = frontend / key
                  if not package.is_symlink():
                      raise SystemExit(f"Android native package is not linker-stage symlinked: {key}")
                  runtime_package = package.resolve(strict=True)
                  try:
                      runtime_package.relative_to(stage_root)
                  except ValueError as exc:
                      raise SystemExit(
                          f"Android native package resolves outside linker stage: {key} -> {runtime_package}"
                      ) from exc
                  installed = json.loads((package / "package.json").read_text(encoding="utf-8"))
                  locked = packages[key]
                  if installed.get("name") != package_name:
                      raise SystemExit(f"Wrong package identity at {key}")
                  if str(installed.get("version") or "") != str(locked.get("version") or ""):
                      raise SystemExit(
                          f"Version mismatch at {key}: installed={installed.get('version')} locked={locked.get('version')}"
                      )
                  binary = package / binary_name
                  if not binary.is_file() or binary.stat().st_size <= 0:
                      raise SystemExit(
                          f"Missing or empty exact Android native binary at {binary}"
                      )
                  runtime_binary = binary.resolve(strict=True)
                  try:
                      runtime_binary.relative_to(stage_root)
                  except ValueError as exc:
                      raise SystemExit(
                          f"Android native binary resolves outside linker stage: {key} -> {runtime_binary}"
                      ) from exc
                  record = receipt_entries.get(key)
                  if not isinstance(record, dict):
                      raise SystemExit(f"Missing integrity receipt entry for {key}")
                  if record.get("package") != package_name:
                      raise SystemExit(f"Receipt package mismatch at {key}")
                  if record.get("version") != str(locked.get("version") or ""):
                      raise SystemExit(f"Receipt version mismatch at {key}")
                  if record.get("binary") != binary_name:
                      raise SystemExit(f"Receipt binary mismatch at {key}")
                  if record.get("lock_integrity") != str(locked.get("integrity") or ""):
                      raise SystemExit(f"Receipt lock integrity mismatch at {key}")
                  digest = hashlib.sha256(binary.read_bytes()).hexdigest()
                  if record.get("binary_sha256") != digest:
                      raise SystemExit(f"Receipt binary hash mismatch at {key}")
                  checked += 1
                  print(
                      "ANDROID_LINKER_SAFE_NATIVE_PACKAGE_VERIFIED "
                      f"package={package_name} path={key} runtime={runtime_package} native={runtime_binary} sha256={digest}"
                  )
          if checked != len(receipt_entries):
              raise SystemExit(
                  f"Receipt contains unexpected entries: checked={checked} receipt={len(receipt_entries)}"
              )
          PY

      - name: Prove Node resolves Android native package entrypoints under linker stage without dlopen
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const { createRequire } = require('module')

          const frontend = path.resolve('frontend')
          const stageRoot = fs.realpathSync(process.env.JOBTOMATIK_ANDROID_NATIVE_STAGE_ROOT)
          const rootRequire = createRequire(path.join(frontend, 'package.json'))
          const viteRequire = createRequire(path.join(frontend, 'node_modules/vite/package.json'))
          const checks = [
            ['root-lightningcss', rootRequire, 'lightningcss-android-arm64'],
            ['vite-lightningcss', viteRequire, 'lightningcss-android-arm64'],
            ['rolldown', rootRequire, '@rolldown/binding-android-arm64'],
            ['tailwind-oxide', rootRequire, '@tailwindcss/oxide-android-arm64'],
          ]

          for (const [label, req, packageName] of checks) {
            const resolved = req.resolve(packageName)
            const real = fs.realpathSync(resolved)
            const relative = path.relative(stageRoot, real)
            if (relative.startsWith('..') || path.isAbsolute(relative)) {
              throw new Error(`${label} resolved outside linker stage: ${real}`)
            }
            console.log(`ANDROID_NODE_RESOLVE_LINKER_SAFE label=${label} package=${packageName} real=${real}`)
          }
          NODE
          echo "ANDROID_NODE_TARGET_RECOVERY_ACCEPTED platform=android arch=arm64"
